<style>
:root {
  --color-paper: #f6f4ee;
  --color-panel: #ffffff;
  --color-ink: #22262b;
  --color-ink-soft: #5b6168;
  --color-navy: #1c2b39;
  --color-navy-soft: #33465a;
  --color-line: #d9d4c6;
  --color-present: #2f6f4e;
  --color-present-bg: #e4efe6;
  --color-absent: #a8442f;
  --color-absent-bg: #f5e6e1;
  --color-gold: #b8863b;
  --color-accent: #3a7ca5;
  --color-accent-hover: #2f6690;
}
* { box-sizing: border-box; }
html, body, #app { height: 100%; }
body {
  margin: 0;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
/* 画面全体の文字をはっきり・くっきり・太めに統一する */
*, *::before, *::after {
  font-weight: 700 !important;
}
input, select, textarea, button {
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.font-display { font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-weight: 900; letter-spacing: 0.01em; }
button { cursor: pointer; font-family: inherit; }
.app-shell { display: flex; min-height: 100%; align-items: stretch; }
#view-container { flex: 1; min-width: 0; }
@media print {
  .app-shell { display: block; }
}
button:active { filter: brightness(0.85); }
.btn-light:active { background: var(--color-line); }
.icon-btn:active:not(:disabled) { background: var(--color-line); }
nav.app-nav .tab:active { color: var(--color-navy-soft); }
.category-tabs button:active { color: var(--color-navy-soft); }
input, select { font-family: inherit; }
select {
  border: 1px solid var(--color-line);
  border-radius: 8px;
  padding: 6px 10px;
  background: white;
  font-size: 14px;
  height: 38px;
  box-sizing: border-box;
}
:focus-visible { outline: 2px solid var(--color-gold); outline-offset: 2px; }

/* ---- ログイン画面 ---- */
.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.login-card {
  width: 100%;
  max-width: 380px;
  background: var(--color-panel);
  border: 1px solid var(--color-line);
  border-radius: 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  padding: 44px 40px;
}
.login-card .eyebrow { font-size: 13px; color: var(--color-ink-soft); margin: 0 0 6px; }
.login-card h1 { font-size: 26px; margin: 0 0 32px; color: var(--color-navy); }
.login-card label { display:block; font-size: 14px; color: var(--color-ink-soft); margin-bottom: 8px; }
.login-card input[type=password] {
  width: 100%; border: 1px solid var(--color-line); border-radius: 10px;
  padding: 12px 14px; margin-bottom: 18px; background: white; font-size: 15px;
}
.login-card input[type=password]:focus { border-color: var(--color-navy); }
.login-error { font-size: 13px; color: var(--color-absent); margin: 0 0 14px; }
.btn-primary {
  width: 100%; background: var(--color-navy); color: white; border: none;
  border-radius: 10px; padding: 14px; font-weight: 500; font-size: 15px;
}
.btn-primary:hover { background: var(--color-navy-soft); }
.btn-primary:disabled { opacity: 0.4; cursor: default; }

/* ---- ナビゲーション（サイドバー） ---- */
nav.app-nav {
  border-right: 1px solid var(--color-line); background: var(--color-panel);
  width: 200px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: space-between;
}
nav.app-nav .inner { display: flex; flex-direction: column; height: 100%; }
nav.app-nav .nav-toggle-btn {
  display: block; width: 100%; padding: 10px 20px; background: none; border: none; border-bottom: 1px solid var(--color-line);
  text-align: left; font-size: 12px; color: var(--color-ink-soft);
}
nav.app-nav .nav-toggle-btn:hover { color: var(--color-navy); background: var(--color-paper); }
.app-shell.nav-collapsed nav.app-nav { width: 34px; }
.app-shell.nav-collapsed nav.app-nav .inner { display: none; }
.app-shell.nav-collapsed nav.app-nav .nav-toggle-btn { padding: 14px 0; font-size: 18px; border-bottom: none; flex: 1; display: flex; justify-content: center; align-items: flex-start; }
nav.app-nav .tabs { display: flex; flex-direction: column; padding: 8px 0; }
nav.app-nav .tab {
  padding: 12px 20px; font-size: 14px; background: none; border: none; text-align: left;
  border-left: 3px solid transparent; color: var(--color-ink-soft);
}
nav.app-nav .tab.active { border-color: var(--color-navy); color: var(--color-navy); font-weight: 500; background: var(--color-paper); }
nav.app-nav .admin-menu-btn {
  margin: 8px 12px 0; padding: 9px 10px; font-size: 13px; text-align: left;
  background: var(--color-paper); border: 1px solid var(--color-line); border-radius: 8px; color: var(--color-navy);
}
nav.app-nav .admin-menu-btn:hover { border-color: var(--color-navy); }
nav.app-nav .admin-tabs { display: flex; flex-direction: column; border-top: 1px dashed var(--color-line); margin-top: 8px; padding-top: 4px; }
nav.app-nav .admin-tabs[hidden] { display: none; }
nav.app-nav .admin-tabs-title { padding: 6px 20px 2px; font-size: 11px; color: var(--color-ink-soft); }
nav.app-nav .sidebar-footer {
  padding: 16px 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  border-top: 1px solid var(--color-line); margin-top: 8px;
}
nav.app-nav .logout { font-size: 12px; color: var(--color-ink-soft); text-decoration: underline; background: none; border: none; }
.btn-update {
  background: #c0392b; color: white; border: none; border-radius: 8px;
  padding: 6px 14px; font-size: 12px; font-weight: 500;
}
.btn-update:hover { background: #a5301f; }
.btn-update:active { background: #8a2819; }

/* ---- 共通ツールバー ---- */
.toolbar {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px;
  margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--color-line);
}
.toolbar .field label { display:block; font-size: 11px; color: var(--color-ink-soft); margin-bottom: 4px; }
.toolbar select, .toolbar input[type=text] {
  border: 1px solid var(--color-line); background: white; border-radius: 8px;
  padding: 8px 12px; font-size: 14px;
}
.btn-dark {
  background: white; color: var(--color-accent); border: 2px solid var(--color-accent); border-radius: 8px;
  padding: 8px 16px; font-size: 14px; height: 38px; box-sizing: border-box;
}
.btn-dark:hover { background: var(--color-accent); color: white; }
.btn-dark:active { background: var(--color-accent-hover); border-color: var(--color-accent-hover); color: white; }
.btn-light {
  background: white; border: 1px solid var(--color-line); border-radius: 8px;
  padding: 8px 16px; font-size: 14px; color: var(--color-ink); height: 38px; box-sizing: border-box;
}
.btn-light:hover { background: var(--color-paper); }
.btn-light.active-toggle { background: var(--color-navy); color: white; border-color: var(--color-navy); }


/* ---- 資料作成（エクセルのような表） ---- */
.sheet-page { padding: 20px 16px 32px; max-width: 100%; }
.sheet-topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.sheet-title-input { flex: 1; min-width: 200px; max-width: 520px; font-size: 20px; padding: 6px 10px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--color-navy); }
.sheet-title-input:hover, .sheet-title-input:focus { border-color: var(--color-line); background: white; outline: none; }
.sheet-save-status { font-size: 12px; color: var(--color-ink-soft); }
.sheet-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 6px 8px; background: white; border: 1px solid var(--color-line); border-radius: 8px 8px 0 0; }
.sheet-tool { background: white; border: 1px solid transparent; border-radius: 6px; padding: 5px 10px; font-size: 13px; color: var(--color-ink); height: 32px; }
.sheet-tool:hover { background: var(--color-paper); border-color: var(--color-line); }
.sheet-tool.on { background: #dde6ee; border-color: #9fb4c8; color: var(--color-navy); }
.sheet-tool-select { height: 32px; font-size: 13px; padding: 2px 8px; }
.sheet-tool-sep { width: 1px; height: 22px; background: var(--color-line); margin: 0 4px; }
.sheet-formula-bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: white; border: 1px solid var(--color-line); border-top: none; }
.sheet-namebox { min-width: 70px; font-size: 13px; color: var(--color-navy); padding: 4px 8px; border: 1px solid var(--color-line); border-radius: 6px; text-align: center; }
.sheet-fx { font-size: 13px; color: var(--color-ink-soft); font-style: italic; }
.sheet-formula-input { flex: 1; border: 1px solid var(--color-line); border-radius: 6px; padding: 6px 10px; font-size: 14px; }
.sheet-formula-input:focus { outline: none; border-color: var(--color-accent); }
.sheet-wrap { position: relative; overflow: auto; max-height: calc(100vh - 250px); min-height: 300px; background: white; border: 1px solid var(--color-line); border-top: none; border-radius: 0 0 8px 8px; }
.sheet-table { border-collapse: collapse; table-layout: fixed; user-select: none; -webkit-user-select: none; }
.sheet-table th { position: sticky; background: #efece4; color: var(--color-ink-soft); font-size: 12px; font-weight: 500 !important; border: 1px solid var(--color-line); z-index: 3; }
.sheet-table thead th { top: 0; height: 26px; }
.sheet-table th.sheet-row-h { left: 0; text-align: center; z-index: 2; overflow: visible; }
.sheet-table th.sheet-corner { left: 0; z-index: 4; cursor: pointer; }
.sheet-table th.hl { background: #dde6ee; color: var(--color-navy); }
.sheet-table th.sheet-col-h { position: sticky; cursor: pointer; }
.sheet-col-resizer { position: absolute; right: -3px; top: 0; width: 7px; height: 100%; cursor: col-resize; z-index: 5; }
.sheet-row-resizer { position: absolute; left: 0; bottom: -3px; width: 100%; height: 7px; cursor: row-resize; z-index: 5; }
.sheet-size-label { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--color-ink-soft); margin: 0 4px; }
.sheet-size-input { width: 64px; height: 30px; border: 1px solid var(--color-line); border-radius: 6px; padding: 2px 6px; font-size: 13px; text-align: right; }
.sheet-size-input:focus { outline: none; border-color: var(--color-accent); }
.sheet-size-tip { position: fixed; z-index: 1000; display: none; background: var(--color-navy); color: white; font-size: 12px; padding: 3px 8px; border-radius: 4px; pointer-events: none; }
.sheet-table td.sc { border: 1px solid #e3dfd4; padding: 2px 6px; font-size: 11pt; font-weight: 500 !important; color: var(--color-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: cell; }
.sheet-table td.sc.bold { font-weight: 900 !important; }
.sheet-table td.sc.spill { overflow: visible; text-overflow: clip; }
.sheet-table td.sc.err { color: var(--color-absent); font-size: 12px; }
.sheet-table td.sc.sel { box-shadow: inset 0 0 0 9999px rgba(58,124,165,0.16); }
.sheet-table td.sc.active { outline: 2px solid var(--color-accent); outline-offset: -2px; }
.sheet-cell-editor { position: absolute; z-index: 1; opacity: 0; pointer-events: none; border: 2px solid var(--color-accent); padding: 2px 5px; font-size: 11pt; font-weight: 500 !important; background: white; box-sizing: border-box; caret-color: transparent; }
.sheet-cell-editor.editing { opacity: 1; pointer-events: auto; z-index: 2; caret-color: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
.sheet-cell-editor:focus { outline: none; }
.sheet-print-host { display: none; }

// 区分ごとの表示順（部署でまとめ、各部署内は主任を先頭に）でメンバーを並べる
function getOrderedMembersForCategory(category, year = selectedRosterYear()) {
  const activeMembers = getCategoryMemberEntries(category, year);
  if (category === 'geppai') {
    const deptOrder = new Map(GEPPAI_REPORT_DEPT_ORDER.map((name, i) => [name, i]));
    return activeMembers
      .filter((m) => m.department !== '営繕課')
      .slice()
      .sort((a, b) => {
        const orderA = deptOrder.get(a.department) ?? Infinity;
        const orderB = deptOrder.get(b.department) ?? Infinity;
        if (orderA !== orderB) return orderA - orderB;
        return (a.is_leader ? 0 : 1) - (b.is_leader ? 0 : 1);
      });
  }
  const deptOrder = new Map(state.departments.map((d, i) => [d.name, i]));
  return activeMembers.slice().sort((a, b) => {
    const orderA = deptOrder.get(a.department) ?? Infinity;
    const orderB = deptOrder.get(b.department) ?? Infinity;
    if (orderA !== orderB) return orderA - orderB;
    return (a.is_leader ? 0 : 1) - (b.is_leader ? 0 : 1);
  });
}

// にをいがけデー（「神・責欄を使う」区分）の全体名簿では、「総」（その日全体の責任者）の人を一番先頭にする。

function moveDayLeaderFirst(list, category) {
  if (!SPECIAL_ROLE_CATEGORIES.includes(category)) return list;
  const leaders = list.filter((m) => m._isDayLeader);
  if (leaders.length === 0) return list;
  return [...leaders, ...list.filter((m) => !m._isDayLeader)];
}

// 日本時間の「今日」（端末の時刻設定に関係なく、日本の日付で判断する）
function jstToday() {
  const d = new Date(Date.now() + 9 * 60 * 60 * 1000);
  return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate() };
}
function jstDateStr() {
  const t = jstToday();
  return `${t.y}-${String(t.m).padStart(2, '0')}-${String(t.d).padStart(2, '0')}`;
}
// 今日（日本時間）が入っている年度の開始年（立教）。4月〜翌3月が1つの年度
function currentFiscalStartReikiYear() {
  const t = jstToday();
  return (t.m >= 4 ? t.y : t.y - 1) - 1837;
}

function calendarMonthToSeq(m) { return m >= 4 ? m - 3 : m + 9; }
function getCurrentReikiMonthContext() {
  return getReikiMonthContext(new Date().getMonth() + 1);
}
function getReikiMonthContext(calendarMonth) {
  const fiscalYear = state.fiscalYears.find(y => y.id === state.fiscalYearId) || null;
  const reikiYear = fiscalYear
    ? (calendarMonth >= 4 ? fiscalYear.start_reiki_year : fiscalYear.start_reiki_year + 1)
    : null;
  const monthSeq = calendarMonthToSeq(calendarMonth);
  return { reikiYear, calendarMonth, fiscalYear, monthSeq };
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ==================== ログイン画面 ====================
function renderLogin() {
  app.innerHTML = `
    <div class="login-wrap">
      <form class="login-card" id="login-form">
        <p class="eyebrow">出欠管理システム</p>
        <h1 class="font-display">営繕課出欠記録</h1>

        <p class="login-error" id="login-error" style="display:none;"></p>
        <button type="submit" class="btn-primary" id="login-submit">ログイン</button>
      </form>
    </div>
  `;

  const form = document.getElementById('login-form');
  const input = document.getElementById('login-password');
  const errorEl = document.getElementById('login-error');
  const submitBtn = document.getElementById('login-submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = input.value;
    if (!password) return;
    errorEl.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = '確認中…';
    try {
      const { error } = await sb.auth.signInWithPassword({ email: LOGIN_EMAIL, password });
      if (error) {
        if (/invalid/i.test(error.message)) throw new Error('パスワードが違います。');
        throw new Error('接続に失敗しました。しばらくしてからもう一度お試しください。');
      }
      renderRoot();
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'ログイン';
    }
  });
}

  try { if (on) sessionStorage.setItem(ADMIN_MENU_KEY, '1'); else sessionStorage.removeItem(ADMIN_MENU_KEY); } catch (e) { /* 保存できなくても、このページを開いている間は有効 */ }
}
async function checkAdminMenuPassword(pw) {
  const data = new TextEncoder().encode('asagami-admin-menu:' + pw);
  const buf = await crypto.subtle.digest('SHA-256', data);
  const hex = [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  return hex === ADMIN_MENU_HASH;
}
// パスワードを聞く小さな画面。正しければ true、やめたら false を返す
function askAdminMenuPassword() {
  return new Promise((resolve) => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:16px;';

        <p id="admin-menu-pw-msg" style="margin:6px 0 0;min-height:18px;font-size:12px;color:var(--color-absent);"></p>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">
          <button type="button" id="admin-menu-pw-cancel" style="padding:8px 14px;border:1px solid var(--color-line);background:white;border-radius:6px;">やめる</button>
          <button type="button" id="admin-menu-pw-ok" class="btn-dark">開く</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    const input = wrap.querySelector('#admin-menu-pw');
    const msg = wrap.querySelector('#admin-menu-pw-msg');
    const finish = (ok) => { wrap.remove(); resolve(ok); };
    const tryOpen = async () => {
      let ok = false;
      try { ok = await checkAdminMenuPassword(input.value); } catch (e) { console.error(e); }
      if (ok) finish(true);
      else { msg.textContent = 'パスワードが違います。'; input.select(); }
    };
    wrap.querySelector('#admin-menu-pw-ok').addEventListener('click', tryOpen);
    wrap.querySelector('#admin-menu-pw-cancel').addEventListener('click', () => finish(false));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') tryOpen();
      if (e.key === 'Escape') finish(false);
    });
    setTimeout(() => input.focus(), 0);
  });
}

const JUST_UPDATED_KEY = 'asagami_just_updated';
const RESTORE_VIEW_KEY = 'asagami_restore_view';

// 「Update」で再読み込みする前に、今開いている画面と現場入力の選択内容を覚えておく
function saveViewStateBeforeUpdate() {
  try {
    sessionStorage.setItem(RESTORE_VIEW_KEY, JSON.stringify({
      view: state.view,
      fieldCategory: state.fieldCategory,
      fieldDeptFilter: state.fieldDeptFilter,
      fieldMonth: state.fieldMonth,
      fieldCheckpoint: state.fieldCheckpoint,
      fieldDutyDayFilter: state.fieldDutyDayFilter,
      docId: state.docId ?? null,
    }));
  } catch (e) { /* 保存できなくても再読み込み自体は続ける */ }
}

// 再読み込み後、覚えておいた画面（現場入力など）に戻す
function restoreViewStateAfterUpdate() {
  let saved = null;
  try {
    saved = JSON.parse(sessionStorage.getItem(RESTORE_VIEW_KEY) || 'null');
    sessionStorage.removeItem(RESTORE_VIEW_KEY);
  } catch (e) { saved = null; }
  if (!saved) return;
  for (const k of ['view', 'fieldCategory', 'fieldDeptFilter', 'fieldMonth', 'fieldCheckpoint', 'fieldDutyDayFilter', 'docId']) {
    if (saved[k] !== undefined && saved[k] !== null) state[k] = saved[k];
  }
}

function renderUpdateButtonHtml() {
  if (sessionStorage.getItem(JUST_UPDATED_KEY) === '1') {
    return `<p id="update-confirm-msg" style="font-size:12px;color:var(--color-present);font-weight:500;margin:0;">✓ 最新の情報に更新しました</p>`;
  }
  return `<button class="btn-update" id="hard-refresh-btn">Update</button><span id="update-message" style="font-size:11px;color:var(--color-ink-soft);"></span>`;
}

function attachUpdateButtonHandler() {
  const btn = document.getElementById('hard-refresh-btn');
  if (!btn) return;
  btn.addEventListener('click', () => {
    sessionStorage.setItem(JUST_UPDATED_KEY, '1');
    saveViewStateBeforeUpdate();
    if (typeof docsState !== 'undefined' && docsState.dirty) flushDocSave();
    const msgEl = document.getElementById('update-message');
    if (msgEl) msgEl.textContent = '最新版を読み込んでいます…';
    setTimeout(() => {
      const params = new URLSearchParams(window.location.search);
      params.set('_', Date.now());
      const url = window.location.origin + window.location.pathname + '?' + params.toString();
      window.location.href = url;
    }, 400);
  });
}

function updateNavActive() {
  document.querySelectorAll('.tab').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.view === state.view);
  });
}

// 「出欠記録」の見出しを右クリックしたときの隠しメニュー（現場入力への入口）
function showFieldShortcutMenu(x, y) {
  const old = document.getElementById('field-shortcut-menu');
  if (old) old.remove();

  const menu = document.createElement('div');
  menu.id = 'field-shortcut-menu';
  menu.className = 'context-menu';
  menu.style.left = `${x}px`;
  menu.style.top = `${y}px`;
  menu.innerHTML = `<button id="field-shortcut-open">現場入力（スマホ用）を開く</button>`;
  document.body.appendChild(menu);

  document.getElementById('field-shortcut-open').addEventListener('click', () => {
    menu.remove();
    state.view = 'field';
    renderView();
  });

  const closeOnOutsideClick = (ev) => {
    if (!menu.contains(ev.target)) {
      menu.remove();
      document.removeEventListener('click', closeOnOutsideClick);
      document.removeEventListener('contextmenu', closeOnOutsideClick);
    }
  };
  setTimeout(() => {
    document.addEventListener('click', closeOnOutsideClick);
    document.addEventListener('contextmenu', closeOnOutsideClick);
  }, 0);
}

function renderView() {
  const container = document.getElementById('view-container');
  // 「記録」タブは廃止したので、前に開いていた場合は出欠入力を表示する
  if (state.view === 'archive') { state.view = 'grid'; updateNavActive(); }
  // 資料作成の画面から離れるときは、未保存の変更をすぐ保存する
  if (state.view !== 'docs' && typeof docsState !== 'undefined' && docsState.dirty) flushDocSave();
  // 管理者メニューの画面は、管理者メニューのパスワードを入れるまで開けない
  if (ADMIN_MENU_VIEWS.has(state.view) && !isAdminMenuUnlocked()) { renderAdminMenuLockedView(container); return; }
  if (state.view === 'docs') renderDocsView(container);
  else if (state.view === 'references') renderRefsView(container);
  else if (state.view === 'grid') renderGridView(container);
  else if (state.view === 'field') renderFieldView(container);
  else if (state.view === 'report') renderReportView(container, 'asagami');
  else if (state.view === 'report-geppai') renderReportView(container, 'geppai');
  else if (state.view === 'roster') renderRosterView(container);
  else if (state.view === 'master') renderMasterView(container);
  else if (state.view === 'ceremony-times-page') renderCeremonyTimesPageView(container);
  else if (state.view === 'category-members-page') renderCategoryMembersPageView(container);
  else if (state.view === 'nioigake-roles-page') renderNioigakeRolesPageView(container);
  else if (state.view === 'categories-page') renderCategoriesPageView(container);
  else if (state.view === 'help') renderHelpView(container);
  else if (state.view === 'settings') renderSettingsView(container);
}

// ==================== 参考資料（ファイルに「年・月・名前」を付けて保管） ====================
const T_REFERENCES = 'asagami_references';
const REF_MAX_BYTES = 8 * 1024 * 1024; // 1ファイル8MBまで

const refsState = { list: [], loaded: false, yearFilter: 'all', editingId: null };

function currentReikiYear() { return new Date().getFullYear() - 1837; }
function refDisplayName(r) {
  const parts = [];
  if (r.reiki_year) parts.push(`立教${r.reiki_year}年`);
  if (r.month) parts.push(`${r.month}月`);
  const head = parts.join('');
  return head ? `${head}　${r.title}` : r.title;
}
function refFormatSize(n) {
  if (!n) return '';
  if (n < 1024 * 1024) return `${Math.max(1, Math.round(n / 1024))}KB`;
  return `${(n / 1024 / 1024).toFixed(1)}MB`;
}
function refYearOptions(selected, includeBlank) {
  const now = currentReikiYear();
  const years = new Set([now - 3, now - 2, now - 1, now, now + 1]);
  refsState.list.forEach((r) => { if (r.reiki_year) years.add(r.reiki_year); });
  if (selected) years.add(selected);
  const opts = [...years].sort((a, b) => b - a).map((y) => `<option value="${y}" ${y === selected ? 'selected' : ''}>立教${y}年（${y + 1837}年）</option>`);
  if (includeBlank) opts.push(`<option value="" ${!selected ? 'selected' : ''}>年なし</option>`);
  return opts.join('');
}
function refMonthOptions(selected) {
  const opts = [`<option value="" ${!selected ? 'selected' : ''}>月なし</option>`];
  for (let m = 1; m <= 12; m++) opts.push(`<option value="${m}" ${m === selected ? 'selected' : ''}>${m}月</option>`);
  return opts.join('');
}

async function loadRefsList() {
  const { data, error } = await sb.from(T_REFERENCES)
    .select('id,reiki_year,month,title,file_name,mime_type,file_size,sort_order,updated_at')
    .order('reiki_year', { ascending: false, nullsFirst: false })
    .order('month', { ascending: false, nullsFirst: false })
    .order('sort_order', { ascending: true })
    .order('id', { ascending: false });
  if (error) { alert('参考資料の一覧を読み込めませんでした: ' + error.message); return; }
  refsState.list = data ?? [];
  refsState.loaded = true;
}

async function fetchRefBlob(id) {
  const { data, error } = await sb.from(T_REFERENCES).select('data_base64,mime_type,file_name').eq('id', id).maybeSingle();
  if (error || !data || !data.data_base64) { alert('ファイルを読み込めませんでした' + (error ? ': ' + error.message : '')); return null; }
  const bin = atob(data.data_base64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return { blob: new Blob([bytes], { type: data.mime_type || 'application/octet-stream' }), fileName: data.file_name || 'file' };
}

async function renderRefsView(container) {
  if (!refsState.loaded) {
    container.innerHTML = `<div class="loading">読み込み中…</div>`;
    await loadRefsList();
    if (state.view !== 'references') return;
  }
  const years = [...new Set(refsState.list.map((r) => r.reiki_year).filter(Boolean))].sort((a, b) => b - a);
  if (refsState.yearFilter !== 'all' && refsState.yearFilter !== 'none' && !years.includes(refsState.yearFilter)) refsState.yearFilter = 'all';
  const filterTabs = [
    `<button class="tab-pill ${refsState.yearFilter === 'all' ? 'active' : ''}" data-ref-year="all">すべて</button>`,
    ...years.map((y) => `<button class="tab-pill ${refsState.yearFilter === y ? 'active' : ''}" data-ref-year="${y}">立教${y}年</button>`),
  ];
  if (refsState.list.some((r) => !r.reiki_year)) filterTabs.push(`<button class="tab-pill ${refsState.yearFilter === 'none' ? 'active' : ''}" data-ref-year="none">年なし</button>`);
  const shown = refsState.list.filter((r) => refsState.yearFilter === 'all' || (refsState.yearFilter === 'none' ? !r.reiki_year : r.reiki_year === refsState.yearFilter));

  const rows = shown.map((r) => {
    if (refsState.editingId === r.id) {
      return `
      <tr data-ref-id="${r.id}">
        <td colspan="3">
          <div class="ref-edit-row">
            <select class="ref-edit-year">${refYearOptions(r.reiki_year, true)}</select>
            <select class="ref-edit-month">${refMonthOptions(r.month)}</select>
            <input type="text" class="ref-edit-title" value="${escapeHtml(r.title)}" placeholder="名前（例: にをいがけデー参加要項）" />
            <button class="btn-dark" data-ref-act="save-edit" data-id="${r.id}">決定</button>
            <button class="btn-light" data-ref-act="cancel-edit" data-id="${r.id}">やめる</button>
          </div>
        </td>
      </tr>`;
    }
    return `
      <tr data-ref-id="${r.id}">
        <td>
          <button class="doc-title-link" data-ref-act="open" data-id="${r.id}">${escapeHtml(refDisplayName(r))}</button>
          <div class="ref-file-meta">${escapeHtml(r.file_name || '')}${r.file_size ? `（${refFormatSize(r.file_size)}）` : ''}</div>
        </td>
        <td style="color:var(--color-ink-soft);font-size:13px;white-space:nowrap;">${formatDocDate(r.updated_at)}</td>
        <td style="white-space:nowrap;text-align:right;">
          <button class="btn-light" data-ref-act="open" data-id="${r.id}">開く</button>
          <button class="btn-light" data-ref-act="download" data-id="${r.id}">ダウンロード</button>
          <button class="btn-light" data-ref-act="edit" data-id="${r.id}">名前を変更</button>
          <button class="btn-light" data-ref-act="del" data-id="${r.id}" style="color:var(--color-absent);">削除</button>
        </td>
      </tr>`;
  }).join('');

  const nowY = currentReikiYear();
  const nowM = new Date().getMonth() + 1;
  container.innerHTML = `
    <div class="grid-wrap">
      <div class="grid-header">
        <div>
          <p class="eyebrow">出欠管理システム</p>
          <h1 class="font-display">参考資料</h1>
        </div>
      </div>
      <p class="hint-text">PDF・写真・エクセルなどのファイルに、「立教○年○月　名前」を付けて保管できます。</p>

      <div class="ref-add-box">
        <h3>＋ 新しい参考資料を追加</h3>
        <div class="ref-edit-row">
          <select id="ref-new-year">${refYearOptions(nowY, true)}</select>
          <select id="ref-new-month">${refMonthOptions(nowM)}</select>
          <input type="text" id="ref-new-title" placeholder="名前（例: にをいがけデー参加要項）" />
        </div>
        <div class="ref-edit-row" style="margin-top:8px;">
          <input type="file" id="ref-new-file" />
          <button class="btn-dark" id="ref-add-btn">追加</button>
          <span id="ref-add-status" style="font-size:13px;color:var(--color-ink-soft);"></span>
        </div>
        <p class="hint-text" style="margin:6px 0 0;">名前を空欄のままにすると、ファイル名がそのまま名前になります。1つのファイルは8MBまでです。</p>
      </div>

      <div class="category-tabs" style="margin-top:20px;">${filterTabs.join('')}</div>
      ${shown.length ? `
        <table class="doc-list-table">
          <thead><tr><th style="text-align:left;">名前</th><th style="text-align:left;">更新</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>` : `<p style="color:var(--color-ink-soft);margin-top:20px;">まだ参考資料がありません。上の「追加」から登録してください。</p>`}
    </div>
  `;

  container.querySelectorAll('[data-ref-year]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.refYear;
      refsState.yearFilter = (v === 'all' || v === 'none') ? v : Number(v);
      renderView();
    });
  });

  document.getElementById('ref-add-btn').addEventListener('click', async () => {
    const statusEl = document.getElementById('ref-add-status');
    const file = document.getElementById('ref-new-file').files[0];
    const yearVal = document.getElementById('ref-new-year').value;
    const monthVal = document.getElementById('ref-new-month').value;
    let title = document.getElementById('ref-new-title').value.trim();
    if (!file) { statusEl.textContent = '⚠ ファイルを選んでください'; return; }
    if (file.size > REF_MAX_BYTES) { statusEl.textContent = `⚠ ファイルが大きすぎます（${refFormatSize(file.size)}）。8MBまでにしてください`; return; }
    if (!title) title = file.name.replace(/\.[^.]+$/, '');
    statusEl.textContent = '追加中…';
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const { data, error } = await sb.from(T_REFERENCES).insert({
      reiki_year: yearVal ? Number(yearVal) : null,
      month: monthVal ? Number(monthVal) : null,
      title,
      file_name: file.name,
      mime_type: file.type || 'application/octet-stream',
      file_size: file.size,
      data_base64: base64,
    }).select('id,reiki_year,month,title,file_name,mime_type,file_size,sort_order,updated_at').single();
    if (error) { statusEl.textContent = '⚠ 追加できませんでした: ' + error.message; return; }
    refsState.loaded = false;
    refsState.yearFilter = data.reiki_year || 'all';
    renderView();
  });

  container.querySelectorAll('[data-ref-act]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = Number(btn.dataset.id);
      const item = refsState.list.find((r) => r.id === id);
      const act = btn.dataset.refAct;
      if (act === 'open' || act === 'download') {
        const win = act === 'open' ? window.open('', '_blank') : null;
        const got = await fetchRefBlob(id);
        if (!got) { if (win) win.close(); return; }
        const url = URL.createObjectURL(got.blob);
        if (act === 'open') {
          const viewable = /^(application\/pdf|image\/|text\/)/.test(got.blob.type);
          if (win && viewable) { win.location.href = url; }
          else {
            if (win) win.close();
            const a = document.createElement('a'); a.href = url; a.download = got.fileName; document.body.appendChild(a); a.click(); a.remove();
          }
        } else {
          const a = document.createElement('a'); a.href = url; a.download = got.fileName; document.body.appendChild(a); a.click(); a.remove();
        }
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        return;
      }
      if (act === 'edit') { refsState.editingId = id; renderView(); return; }
      if (act === 'cancel-edit') { refsState.editingId = null; renderView(); return; }
      if (act === 'save-edit') {
        const tr = btn.closest('tr');
        const yearVal = tr.querySelector('.ref-edit-year').value;
        const monthVal = tr.querySelector('.ref-edit-month').value;
        const title = tr.querySelector('.ref-edit-title').value.trim() || (item ? item.title : '無題');
        const patch = { reiki_year: yearVal ? Number(yearVal) : null, month: monthVal ? Number(monthVal) : null, title, updated_at: new Date().toISOString() };
        const { error } = await sb.from(T_REFERENCES).update(patch).eq('id', id);
        if (error) { alert('変更できませんでした: ' + error.message); return; }
        refsState.editingId = null;
        refsState.loaded = false;
        renderView();
        return;
      }
      if (act === 'del') {
        if (!confirm(`「${item ? refDisplayName(item) : 'この資料'}」を削除します。元に戻せません。よろしいですか？`)) return;
        const { error } = await sb.from(T_REFERENCES).delete().eq('id', id);
        if (error) { alert('削除できませんでした: ' + error.message); return; }
        refsState.loaded = false;
        renderView();
      }
    });
  });
  const editTitle = container.querySelector('.ref-edit-title');
  if (editTitle) {
    editTitle.focus();
    editTitle.addEventListener('keydown', (e) => {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === 'Enter') container.querySelector('[data-ref-act="save-edit"]').click();
      if (e.key === 'Escape') container.querySelector('[data-ref-act="cancel-edit"]').click();
    });
  }
}

// ---- セル番地の変換 ----
function sheetColName(i) {
  let s = ''; let n = i + 1;
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
function sheetColIndex(name) {
  let n = 0;
  for (const ch of name.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}
function sheetKey(r, c) { return `${r}:${c}`; }
// 罫線：cell.bd = { t, r, b, l }（1=線あり / 0=線なし）。bd が無いセルは四方とも線あり（最初の状態）
function sheetCellBorders(cell) {
  const bd = cell && cell.bd;
  if (!bd) return { t: 1, r: 1, b: 1, l: 1 };
  return { t: bd.t ? 1 : 0, r: bd.r ? 1 : 0, b: bd.b ? 1 : 0, l: bd.l ? 1 : 0 };
}
function sheetBorderStyle(cell, onCss, offCss) {
  if (!cell || !cell.bd) return '';
  const b = sheetCellBorders(cell);
  return `border-top:${b.t ? onCss : offCss};border-right:${b.r ? onCss : offCss};border-bottom:${b.b ? onCss : offCss};border-left:${b.l ? onCss : offCss}`;
}
// ---- セルの結合 ----
// data.merges = [{ r, c, rs, cs }]（左上のセルと、縦・横に何マス分か）
function sheetMergeAt(data, r, c) {
  for (const m of data.merges || []) {
    if (r >= m.r && r < m.r + m.rs && c >= m.c && c < m.c + m.cs) return m;
  }
  return null;
}
// 範囲に結合セルが一部でもかかっていたら、その結合セル全体が入るよう範囲を広げる
function sheetExpandRangeForMerges(data, rg) {
  let { r1, r2, c1, c2 } = rg;
  let changed = true;
  while (changed) {
    changed = false;
    for (const m of data.merges || []) {
      const mr2 = m.r + m.rs - 1, mc2 = m.c + m.cs - 1;
      if (m.r > r2 || mr2 < r1 || m.c > c2 || mc2 < c1) continue;
      if (m.r < r1) { r1 = m.r; changed = true; }
      if (mr2 > r2) { r2 = mr2; changed = true; }
      if (m.c < c1) { c1 = m.c; changed = true; }
      if (mc2 > c2) { c2 = mc2; changed = true; }
    }
  }
  return { r1, r2, c1, c2 };
}
// 表を描くときに、結合で隠れるセル（skip）と、結合の左上のセル（merge）を調べる表
function sheetMergeLayout(data) {
  const map = new Map();
  for (const m of data.merges || []) {
    for (let r = m.r; r < m.r + m.rs; r++) {
      for (let c = m.c; c < m.c + m.cs; c++) map.set(sheetKey(r, c), (r === m.r && c === m.c) ? m : 'skip');
    }
  }
  return map;
}
// 結合セルの罫線：上・左は左上のセル、下は左下のセル、右は右上のセルの設定を使う
function sheetMergedBorderStyle(data, m, onCss, offCss) {
  const t = sheetCellBorders(data.cells[sheetKey(m.r, m.c)]).t;
  const l = sheetCellBorders(data.cells[sheetKey(m.r, m.c)]).l;
  const b = sheetCellBorders(data.cells[sheetKey(m.r + m.rs - 1, m.c)]).b;
  const r = sheetCellBorders(data.cells[sheetKey(m.r, m.c + m.cs - 1)]).r;
  if (t && l && b && r) return '';
  return `border-top:${t ? onCss : offCss};border-right:${r ? onCss : offCss};border-bottom:${b ? onCss : offCss};border-left:${l ? onCss : offCss}`;
}

// エクセルと同じように、左揃えの文字は右隣が空いていれば、はみ出して表示する
function sheetCanSpill(data, layout, r, c, lay, align, disp, maxC) {
  const self = data.cells[sheetKey(r, c)];
  if (self && self.sf) return false;
  if (lay || !disp.text || disp.isErr || align !== 'left') return false;
  if (c + 1 > maxC) return false;
  const nk = sheetKey(r, c + 1);
  if (layout.get(nk)) return false;
  return !sheetDisplayText(nk).text;
}

// インデント（1段 = 全角1文字分）と、上下の位置
const SHEET_INDENT_MAX = 10;
function sheetIndentVaStyles(cell, align, basePad) {
  const out = [];
  if (cell && cell.va) out.push(`vertical-align:${cell.va}`);
  const ind = Number(cell && cell.ind) || 0;
  if (ind > 0) {
    const pad = `calc(${basePad}px + ${ind}em)`;
    if (align === 'right') out.push(`padding-right:${pad}`);
    else if (align !== 'center') out.push(`padding-left:${pad}`);
  }
  return out;
}

function sheetCellFontPt(cell) { return Number(cell && cell.fs) || SHEET_DEFAULT_FONT_PT; }
function sheetCellIsEmpty(cell) {
  return (cell.v === undefined || cell.v === '') && !cell.b && !cell.a && !cell.bg && !cell.bd && !cell.bx && !cell.fs && !cell.ind && !cell.va && !cell.sf;
}
function sheetRowHeight(data, r) { return Number(data.rowHeights && data.rowHeights[r]) || SHEET_DEFAULT_ROW_HEIGHT; }
function sheetA1(r, c) { return `${sheetColName(c)}${r + 1}`; }
function sheetParseA1(ref) {
  const m = /^\$?([A-Z]+)\$?(\d+)$/i.exec(ref);
  return m ? { r: Number(m[2]) - 1, c: sheetColIndex(m[1]) } : null;
}

function newSheetData() {
  return { rows: SHEET_DEFAULT_ROWS, cols: SHEET_DEFAULT_COLS, colWidths: Array(SHEET_DEFAULT_COLS).fill(SHEET_DEFAULT_COL_WIDTH), rowHeights: {}, cells: {} };
}
function normalizeSheetData(d) {
  const data = (d && typeof d === 'object') ? d : {};
  data.rows = Math.max(1, Number(data.rows) || SHEET_DEFAULT_ROWS);
  data.cols = Math.max(1, Number(data.cols) || SHEET_DEFAULT_COLS);
  if (!Array.isArray(data.colWidths)) data.colWidths = [];
  while (data.colWidths.length < data.cols) data.colWidths.push(SHEET_DEFAULT_COL_WIDTH);
  data.colWidths.length = data.cols;
  if (!data.cells || typeof data.cells !== 'object') data.cells = {};
  if (!data.rowHeights || typeof data.rowHeights !== 'object' || Array.isArray(data.rowHeights)) data.rowHeights = {};
  if (!Array.isArray(data.merges)) data.merges = [];
  return data;
}

// ---- 計算式 ----
function sheetIsFormula(s) { return typeof s === 'string' && (s.startsWith('=') || s.startsWith('＝')) && s.length > 1; }
// 全角で入力された計算式（＝ＳＵＭ（Ａ１：Ａ３）など）も半角にそろえる
function sheetNormalizeFormula(s) { return s.normalize('NFKC'); }
function sheetParseNumber(s) {
  if (typeof s !== 'string') return null;
  const t = s.normalize('NFKC').replace(/,/g, '').trim();
  if (/^[-+]?(\d+\.?\d*|\.\d+)$/.test(t)) return Number(t);
  return null;
}
function sheetErr(code) { const e = new Error(code); e.sheetError = true; return e; }

function sheetTokenize(src) {
  const toks = [];
  let i = 0;
  while (i < src.length) {
    const rest = src.slice(i);
    let m;
    if (/^\s/.test(rest)) { i++; continue; }
    if ((m = /^(\d+\.?\d*|\.\d+)/.exec(rest))) { toks.push({ t: 'num', v: Number(m[1]) }); i += m[0].length; continue; }
    if ((m = /^"([^"]*)"/.exec(rest))) { toks.push({ t: 'str', v: m[1] }); i += m[0].length; continue; }
    if ((m = /^(\$?[A-Za-z]{1,3}\$?\d+)(?![A-Za-z0-9_(])/.exec(rest))) { toks.push({ t: 'ref', v: m[1].toUpperCase() }); i += m[0].length; continue; }
    if ((m = /^(TRUE|FALSE)(?![A-Za-z0-9_(])/i.exec(rest))) { toks.push({ t: 'bool', v: m[1].toUpperCase() === 'TRUE' }); i += m[0].length; continue; }
    if ((m = /^[A-Za-z_][A-Za-z0-9_.]*/.exec(rest))) { toks.push({ t: 'name', v: m[0].toUpperCase() }); i += m[0].length; continue; }
    if ((m = /^(<=|>=|<>)/.exec(rest))) { toks.push({ t: 'op', v: m[1] }); i += 2; continue; }
    if ('+-*/^&(),:=<>%'.includes(rest[0])) { toks.push({ t: 'op', v: rest[0] }); i++; continue; }
    throw sheetErr('#構文エラー');
  }
  return toks;
}

function sheetToNum(v) {
  if (Array.isArray(v)) throw sheetErr('#VALUE!');
  if (v === '' || v == null) return 0;
  if (typeof v === 'number') return v;
  if (typeof v === 'boolean') return v ? 1 : 0;
  const n = sheetParseNumber(String(v));
  if (n === null) throw sheetErr('#VALUE!');
  return n;
}
function sheetToStr(v) {
  if (Array.isArray(v)) throw sheetErr('#VALUE!');
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  if (typeof v === 'number') return sheetFormatNumber(v);
  return v == null ? '' : String(v);
}
function sheetTruthy(v) {
  if (typeof v === 'boolean') return v;
  if (typeof v === 'number') return v !== 0;
  if (v === '' || v == null) return false;
  const n = sheetParseNumber(String(v));
  if (n !== null) return n !== 0;
  const up = String(v).toUpperCase();
  if (up === 'TRUE') return true;
  if (up === 'FALSE') return false;
  throw sheetErr('#VALUE!');
}
function sheetCompare(op, a, b) {
  let x = a, y = b;
  const na = typeof a === 'number' ? a : sheetParseNumber(String(a ?? ''));
  const nb = typeof b === 'number' ? b : sheetParseNumber(String(b ?? ''));
  if (na !== null && nb !== null) { x = na; y = nb; }
  else { x = sheetToStr(a).toLowerCase(); y = sheetToStr(b).toLowerCase(); }
  switch (op) {
    case '=': return x === y;
    case '<>': return x !== y;
    case '<': return x < y;
    case '>': return x > y;
    case '<=': return x <= y;
    case '>=': return x >= y;
  }
  return false;
}
function sheetMatchCriteria(v, crit) {
  if (typeof crit === 'number') return sheetCompare('=', v, crit);
  const s = String(crit ?? '');
  const m = /^(<=|>=|<>|<|>|=)(.*)$/.exec(s);
  if (m) {
    if (m[2] === '' && (m[1] === '=' || m[1] === '<>')) {
      const empty = v === '' || v == null;
      return m[1] === '=' ? empty : !empty;
    }
    return sheetCompare(m[1], v, m[2]);
  }
  return sheetCompare('=', v, s);
}

function sheetCallFunction(name, args) {
  const flat = (list) => list.flatMap((a) => Array.isArray(a) ? a : [a]);
  const numsFrom = (list) => {
    const out = [];
    for (const a of list) {
      if (Array.isArray(a)) { for (const v of a) { if (typeof v === 'number') out.push(v); } }
      else out.push(sheetToNum(a));
    }
    return out;
  };
  const need = (n) => { if (args.length < n) throw sheetErr('#引数不足'); };
  switch (name) {
    case 'SUM': return numsFrom(args).reduce((s, x) => s + x, 0);
    case 'AVERAGE': { const n = numsFrom(args); if (!n.length) throw sheetErr('#DIV/0!'); return n.reduce((s, x) => s + x, 0) / n.length; }
    case 'MIN': { const n = numsFrom(args); return n.length ? Math.min(...n) : 0; }
    case 'MAX': { const n = numsFrom(args); return n.length ? Math.max(...n) : 0; }
    case 'COUNT': return flat(args).filter((v) => typeof v === 'number').length;
    case 'COUNTA': return flat(args).filter((v) => v !== '' && v != null).length;
    case 'COUNTBLANK': return flat(args).filter((v) => v === '' || v == null).length;
    case 'COUNTIF': { need(2); const range = Array.isArray(args[0]) ? args[0] : [args[0]]; return range.filter((v) => sheetMatchCriteria(v, args[1])).length; }
    case 'SUMIF': {
      need(2);
      const range = Array.isArray(args[0]) ? args[0] : [args[0]];
      const sumRange = args[2] === undefined ? range : (Array.isArray(args[2]) ? args[2] : [args[2]]);
      let total = 0;
      range.forEach((v, i) => { if (sheetMatchCriteria(v, args[1])) { const s = sumRange[i]; if (typeof s === 'number') total += s; } });
      return total;
    }
    case 'ROUND': case 'ROUNDUP': case 'ROUNDDOWN': {
      need(1);
      const x = sheetToNum(args[0]); const d = args[1] === undefined ? 0 : Math.trunc(sheetToNum(args[1]));
      const f = Math.pow(10, d);
      const y = Math.abs(x) * f;
      const r = name === 'ROUND' ? Math.round(y + 1e-9) : name === 'ROUNDUP' ? Math.ceil(y - 1e-9) : Math.floor(y + 1e-9);
      return Math.sign(x) * r / f;
    }
    case 'INT': need(1); return Math.floor(sheetToNum(args[0]));
    case 'ABS': need(1); return Math.abs(sheetToNum(args[0]));
    case 'IF': need(2); return sheetTruthy(args[0]) ? args[1] : (args[2] === undefined ? false : args[2]);
    case 'AND': return flat(args).every((v) => sheetTruthy(v));
    case 'OR': return flat(args).some((v) => sheetTruthy(v));
    case 'NOT': need(1); return !sheetTruthy(args[0]);
    case 'CONCAT': case 'CONCATENATE': return flat(args).map(sheetToStr).join('');
    case 'LEN': need(1); return sheetToStr(args[0]).length;
    case 'TODAY': { const d = new Date(); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; }
    default: throw sheetErr('#NAME?');
  }
}

function sheetEvalFormula(src, getCell) {
  const toks = sheetTokenize(src);
  let p = 0;
  const peek = () => toks[p];
  const isOp = (v) => peek() && peek().t === 'op' && peek().v === v;
  const expect = (v) => { const t = toks[p++]; if (!t || t.v !== v) throw sheetErr('#構文エラー'); };

  function rangeValues(a, b) {
    const s = sheetParseA1(a), e = sheetParseA1(b);
    if (!s || !e) throw sheetErr('#REF!');
    const out = [];
    for (let r = Math.min(s.r, e.r); r <= Math.max(s.r, e.r); r++) {
      for (let c = Math.min(s.c, e.c); c <= Math.max(s.c, e.c); c++) out.push(getCell(r, c));
    }
    return out;
  }
  function parseCompare() {
    let a = parseConcat();
    while (peek() && peek().t === 'op' && ['=', '<>', '<', '>', '<=', '>='].includes(peek().v)) {
      const op = toks[p++].v; const b = parseConcat();
      a = sheetCompare(op, a, b);
    }
    return a;
  }
  function parseConcat() {
    let a = parseAdd();
    while (isOp('&')) { p++; a = sheetToStr(a) + sheetToStr(parseAdd()); }
    return a;
  }
  function parseAdd() {
    let a = parseMul();
    while (isOp('+') || isOp('-')) {
      const op = toks[p++].v; const b = parseMul();
      a = op === '+' ? sheetToNum(a) + sheetToNum(b) : sheetToNum(a) - sheetToNum(b);
    }
    return a;
  }
  function parseMul() {
    let a = parsePow();
    while (isOp('*') || isOp('/')) {
      const op = toks[p++].v; const b = parsePow();
      if (op === '/') { const d = sheetToNum(b); if (d === 0) throw sheetErr('#DIV/0!'); a = sheetToNum(a) / d; }
      else a = sheetToNum(a) * sheetToNum(b);
    }
    return a;
  }
  function parsePow() {
    let a = parseUnary();
    while (isOp('^')) { p++; a = Math.pow(sheetToNum(a), sheetToNum(parseUnary())); }
    return a;
  }
  function parseUnary() {
    if (isOp('-')) { p++; return -sheetToNum(parseUnary()); }
    if (isOp('+')) { p++; return sheetToNum(parseUnary()); }
    let v = parsePrimary();
    while (isOp('%')) { p++; v = sheetToNum(v) / 100; }
    return v;
  }
  function parsePrimary() {
    const t = toks[p++];
    if (!t) throw sheetErr('#構文エラー');
    if (t.t === 'num' || t.t === 'str' || t.t === 'bool') return t.v;
    if (t.t === 'op' && t.v === '(') { const v = parseCompare(); expect(')'); return v; }
    if (t.t === 'ref') {
      if (isOp(':')) {
        p++;
        const t2 = toks[p++];
        if (!t2 || t2.t !== 'ref') throw sheetErr('#構文エラー');
        return rangeValues(t.v, t2.v);
      }
      const rc = sheetParseA1(t.v);
      return getCell(rc.r, rc.c);
    }
    if (t.t === 'name') {
      expect('(');
      const args = [];
      if (!isOp(')')) {
        args.push(parseCompare());
        while (isOp(',')) { p++; args.push(parseCompare()); }
      }
      expect(')');
      return sheetCallFunction(t.v, args);
    }
    throw sheetErr('#構文エラー');
  }
  const v = parseCompare();
  if (p < toks.length) throw sheetErr('#構文エラー');
  return v;
}

function sheetFormatNumber(v) {
  if (!Number.isFinite(v)) return '#NUM!';
  const r = Math.round(v * 1e10) / 1e10;
  return String(r);
}

// すべてのセルを計算して、表示用の値をまとめて返す
function sheetEvaluateAll(data) {
  const memo = new Map();
  const visiting = new Set();
  function cellValue(r, c) {
    const key = sheetKey(r, c);
    if (memo.has(key)) { const m = memo.get(key); if (m.err) throw sheetErr(m.err); return m.v; }
    const cell = data.cells[key];
    const raw = cell ? cell.v : '';
    if (raw == null || raw === '') return '';
    const s = String(raw);
    if (!sheetIsFormula(s)) {
      const n = sheetParseNumber(s);
      const v = n !== null ? n : s;
      memo.set(key, { v });
      return v;
    }
    if (visiting.has(key)) throw sheetErr('#循環参照');
    visiting.add(key);
    try {
      let v = sheetEvalFormula(sheetNormalizeFormula(s).slice(1), cellValue);
      if (Array.isArray(v)) v = v.length === 1 ? v[0] : (() => { throw sheetErr('#VALUE!'); })();
      memo.set(key, { v });
      return v;
    } catch (e) {
      const err = e && e.sheetError ? e.message : '#エラー';
      memo.set(key, { err });
      throw sheetErr(err);
    } finally {
      visiting.delete(key);
    }
  }
  const out = new Map();
  for (const key of Object.keys(data.cells)) {
    const [r, c] = key.split(':').map(Number);
    if (r >= data.rows || c >= data.cols) continue;
    try {
      const v = cellValue(r, c);
      out.set(key, { v });
    } catch (e) {
      out.set(key, { err: e.sheetError ? e.message : '#エラー' });
    }
  }
  return out;
}

function sheetDisplayText(key) {
  const res = docsState.values.get(key);
  if (!res) return { text: '', isNum: false, isErr: false };
  if (res.err) return { text: res.err, isNum: false, isErr: true };
  const cell = docsState.doc.data.cells[key];
  const raw = cell ? String(cell.v ?? '') : '';
  const v = res.v;
  if (!sheetIsFormula(raw)) return { text: raw, isNum: typeof v === 'number', isErr: false };
  if (typeof v === 'number') return { text: sheetFormatNumber(v), isNum: true, isErr: false };
  if (typeof v === 'boolean') return { text: v ? 'TRUE' : 'FALSE', isNum: false, isErr: false };
  return { text: String(v ?? ''), isNum: false, isErr: false };
}

// 計算式の中のセル番地を書き換える（行・列の挿入/削除、コピー貼り付けで使う）
// mapRC(r, c, absR, absC) → {r, c} または null（参照先がなくなった）
function sheetShiftFormulaRefs(formula, mapRC) {
  return formula.split(/("[^"]*")/).map((seg, i) => {
    if (i % 2 === 1) return seg;
    return seg.replace(/(\$?)([A-Za-z]{1,3})(\$?)(\d+)(?![A-Za-z0-9_(])/g, (m, d1, col, d2, row, offset, str) => {
      const prev = str[offset - 1];
      if (prev && /[A-Za-z0-9_.]/.test(prev)) return m;
      const rc = mapRC(Number(row) - 1, sheetColIndex(col), d2 === '$', d1 === '$');
      if (!rc || rc.r < 0 || rc.c < 0) return '#REF!';
      return `${d1}${sheetColName(rc.c)}${d2}${rc.r + 1}`;
    });
  }).join('');
}

// ---- データベース ----
async function loadDocsList() {
  const { data, error } = await sb.from(T_DOCUMENTS).select('id,title,updated_at,sort_order')
    .order('sort_order', { ascending: true, nullsFirst: true })
    .order('updated_at', { ascending: false });
  if (error) { console.error(error); alert('資料の一覧を読み込めませんでした: ' + error.message); return; }
  docsState.list = data ?? [];
  docsState.loaded = true;
}
async function createDoc(title, data) {
  // 新しい資料は一覧の一番上に来るようにする
  const orders = docsState.list.map((d) => Number(d.sort_order)).filter((n) => Number.isFinite(n));
  const sortOrder = orders.length ? Math.min(...orders) - 1 : 1;
  const { data: row, error } = await sb.from(T_DOCUMENTS).insert({ title, data, sort_order: sortOrder }).select().single();
  if (error) { alert('資料を作成できませんでした: ' + error.message); return null; }
  return row;
}
async function openDoc(id) {
  const { data, error } = await sb.from(T_DOCUMENTS).select('*').eq('id', id).maybeSingle();
  if (error || !data) {
    alert('資料を開けませんでした' + (error ? ': ' + error.message : '（削除された可能性があります）'));
    state.docId = null;
    docsState.doc = null;
    renderView();
    return;
  }
  docsState.doc = { id: data.id, title: data.title, data: normalizeSheetData(data.data) };
  docsState.sel = { ar: 0, ac: 0, fr: 0, fc: 0 };
  docsState.undo = [];
  docsState.editing = false;
  docsState.dirty = false;
  state.docId = data.id;
  renderView();
}
function scheduleDocSave() {
  docsState.dirty = true;
  setDocSaveStatus('未保存の変更があります…');
  clearTimeout(docsState.saveTimer);
  docsState.saveTimer = setTimeout(flushDocSave, 800);
}
async function flushDocSave() {
  clearTimeout(docsState.saveTimer);
  docsState.saveTimer = null;
  const doc = docsState.doc;
  if (!doc || !docsState.dirty) return;
  docsState.dirty = false;
  docsState.saving = true;
  setDocSaveStatus('保存中…');
  const { error } = await sb.from(T_DOCUMENTS)
    .update({ title: doc.title, data: doc.data, updated_at: new Date().toISOString() })
    .eq('id', doc.id);
  docsState.saving = false;
  if (error) {
    docsState.dirty = true;
    setDocSaveStatus('保存できませんでした（' + error.message + '）', true);
    return;
  }
  docsState.loaded = false; // 一覧の更新日時を読み直す
  if (!docsState.dirty) {
    const now = new Date();
    setDocSaveStatus(`✓ 保存しました（${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}）`);
  }
}
function setDocSaveStatus(text, isError) {
  const el = document.getElementById('sheet-save-status');
  if (!el) return;
  el.textContent = text;
  el.style.color = isError ? 'var(--color-absent)' : 'var(--color-ink-soft)';
}
window.addEventListener('beforeunload', (e) => {
  if (docsState.dirty || docsState.saving) {
    flushDocSave();
    e.preventDefault();
    e.returnValue = '';
  }
});

function formatDocDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

      ${docsState.list.length ? `
        <table class="doc-list-table" id="doc-list-table">
          <thead><tr><th></th><th style="text-align:left;">資料名</th><th style="text-align:left;">最終更新</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>` : `<p style="color:var(--color-ink-soft);margin-top:24px;">まだ資料がありません。「＋ 新しい表を作成」から作ってください。</p>`}
    </div>
  `;

  document.getElementById('doc-new-btn').addEventListener('click', async () => {
    const title = prompt('資料の名前を入力してください', '無題の資料');
    if (title === null) return;
    const row = await createDoc(title.trim() || '無題の資料', newSheetData());
    if (row) { docsState.loaded = false; openDoc(row.id); }
  });

  document.getElementById('doc-import-input').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const msg = document.getElementById('doc-list-msg');
    msg.textContent = '読み込み中…';
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array', cellFormula: true });
      const baseName = file.name.replace(/\.[^.]+$/, '');
      let firstId = null;
      for (const sheetName of wb.SheetNames) {
        const data = sheetDataFromWorksheet(wb.Sheets[sheetName]);
        const title = wb.SheetNames.length > 1 ? `${baseName}（${sheetName}）` : baseName;
        const row = await createDoc(title, data);
        if (row && !firstId) firstId = row.id;
      }
      docsState.loaded = false;
      if (firstId) openDoc(firstId); else renderView();
    } catch (err) {
      console.error(err);
      msg.textContent = '読み込めませんでした: ' + err.message;

  setupDocListDragAndDrop();

  container.querySelectorAll('[data-act]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const item = docsState.list.find((d) => d.id === id);
      if (btn.dataset.act === 'open') { openDoc(id); return; }
      if (btn.dataset.act === 'rename') { startDocRename(id); return; }
      if (btn.dataset.act === 'dup') {
        const { data: src, error } = await sb.from(T_DOCUMENTS).select('*').eq('id', id).maybeSingle();
        if (error || !src) { alert('複製できませんでした'); return; }
        const row = await createDoc(`${src.title}のコピー`, src.data);
        if (row) { docsState.loaded = false; renderView(); }
        return;
      }
      if (btn.dataset.act === 'del') {
        if (!confirm(`「${item ? item.title : ''}」を削除します。元に戻せません。よろしいですか？`)) return;
        const { error } = await sb.from(T_DOCUMENTS).delete().eq('id', id);
        if (error) { alert('削除できませんでした: ' + error.message); return; }
        docsState.loaded = false;
        renderView();
      }
    });
  });
}

// 一覧の並び順を、左の「⠿」を掴んでドラッグで変える（出欠入力と同じ操作）
function setupDocListDragAndDrop() {
  const table = document.getElementById('doc-list-table');
  if (!table) return;
  const tbody = table.querySelector('tbody');
  const rowsOf = () => tbody.querySelectorAll('tr[data-doc-id]');
  const clearMarks = () => rowsOf().forEach((r) => r.classList.remove('drag-over-top', 'drag-over-bottom', 'dragging'));
  tbody.querySelectorAll('.drag-handle').forEach((handle) => {
    handle.addEventListener('mousedown', () => {
      const tr = handle.closest('tr[data-doc-id]');
      if (tr) tr.draggable = true;
    });
  });
  const resetDraggable = () => rowsOf().forEach((tr) => { tr.draggable = false; });
  tbody.addEventListener('mouseup', resetDraggable);
  let draggedId = null;
  tbody.addEventListener('dragstart', (e) => {
    const tr = e.target.closest('tr[data-doc-id]');
    if (!tr) return;
    draggedId = tr.dataset.docId;
    tr.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', draggedId); } catch (err) { /* 無視 */ }
  });
  tbody.addEventListener('dragover', (e) => {
    const tr = e.target.closest('tr[data-doc-id]');
    if (!tr || draggedId === null) return;
    e.preventDefault();
    rowsOf().forEach((r) => r.classList.remove('drag-over-top', 'drag-over-bottom'));
    const rect = tr.getBoundingClientRect();
    tr.classList.add((e.clientY - rect.top) > rect.height / 2 ? 'drag-over-bottom' : 'drag-over-top');
  });
  tbody.addEventListener('drop', (e) => {
    const tr = e.target.closest('tr[data-doc-id]');
    clearMarks();
    if (!tr || draggedId === null) return;
    e.preventDefault();
    const rect = tr.getBoundingClientRect();
    const after = (e.clientY - rect.top) > rect.height / 2;
    const moved = draggedId;
    draggedId = null;
    reorderDocs(moved, tr.dataset.docId, after);
  });
  tbody.addEventListener('dragend', () => { clearMarks(); draggedId = null; resetDraggable(); });
}

async function reorderDocs(draggedId, targetId, insertAfter) {
  if (draggedId === targetId) return;
  const list = [...docsState.list];
  const from = list.findIndex((d) => d.id === draggedId);
  if (from === -1) return;
  const [moved] = list.splice(from, 1);
  let to = list.findIndex((d) => d.id === targetId);
  if (to === -1) return;
  list.splice(insertAfter ? to + 1 : to, 0, moved);
  list.forEach((d, i) => { d.sort_order = i + 1; });
  docsState.list = list;
  renderView();
  const results = await Promise.all(list.map((d) => sb.from(T_DOCUMENTS).update({ sort_order: d.sort_order }).eq('id', d.id)));
  const failed = results.find((r) => r.error);
  if (failed) alert('並び順を保存できませんでした: ' + failed.error.message);
}

// 一覧で資料名をその場で書き換える（Enterで確定、Escで取り消し）
function startDocRename(id) {
  const td = document.querySelector(`.doc-title-cell[data-id="${id}"]`);
  const item = docsState.list.find((d) => d.id === id);
  if (!td || !item || td.querySelector('input')) return;
  const original = item.title || '無題の資料';
  td.innerHTML = `<input type="text" class="doc-rename-input" value="${escapeHtml(original)}" />`;
  const input = td.querySelector('input');
  input.focus();
  input.select();
  let done = false;
  const finish = async (save) => {
    if (done) return;
    done = true;
    const title = input.value.trim() || '無題の資料';
    if (save && title !== original) {
      input.disabled = true;
      const { error } = await sb.from(T_DOCUMENTS).update({ title }).eq('id', id);
      if (error) { alert('名前を変更できませんでした: ' + error.message); }
      else item.title = title;
    }
    td.innerHTML = `<button class="doc-title-link" data-id="${id}">${escapeHtml(item.title || '無題の資料')}</button>`;
    td.querySelector('button').addEventListener('click', () => openDoc(id));
  };
  input.addEventListener('keydown', (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

function sheetDataFromWorksheet(ws) {
  const data = newSheetData();
  if (!ws || !ws['!ref']) return data;
  const range = XLSX.utils.decode_range(ws['!ref']);
  data.rows = Math.max(SHEET_DEFAULT_ROWS, range.e.r + 1 + 5);
  data.cols = Math.max(SHEET_DEFAULT_COLS, range.e.c + 1 + 2);
  data.colWidths = Array(data.cols).fill(SHEET_DEFAULT_COL_WIDTH);
  data.merges = (ws['!merges'] || []).map((m) => ({ r: m.s.r, c: m.s.c, rs: m.e.r - m.s.r + 1, cs: m.e.c - m.s.c + 1 })).filter((m) => m.rs > 1 || m.cs > 1);
  (ws['!rows'] || []).forEach((row, i) => {
    const px = row && (row.hpx || (row.hpt ? Math.round(row.hpt * 4 / 3) : null));
    if (px && Math.round(px) !== SHEET_DEFAULT_ROW_HEIGHT) data.rowHeights[i] = Math.max(SHEET_ROW_HEIGHT_MIN, Math.min(SHEET_ROW_HEIGHT_MAX, Math.round(px)));
  });
  (ws['!cols'] || []).forEach((col, i) => {
    if (col && i < data.cols) {
      const px = col.wpx || (col.wch ? Math.round(col.wch * 8 + 10) : null);
      if (px) data.colWidths[i] = Math.max(40, Math.min(600, px));
    }
  });
  for (let r = range.s.r; r <= range.e.r; r++) {
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cell = ws[XLSX.utils.encode_cell({ r, c })];
      if (!cell) continue;
      let v;
      if (cell.f) v = '=' + cell.f;
      else if (cell.w !== undefined) v = String(cell.w);
      else if (cell.v !== undefined) v = String(cell.v);
      if (v === undefined || v === '') continue;
      data.cells[sheetKey(r, c)] = { v };
    }
  }
  return data;
}

function sheetSelRange() {
  const s = docsState.sel;
  const rg = { r1: Math.min(s.ar, s.fr), r2: Math.max(s.ar, s.fr), c1: Math.min(s.ac, s.fc), c2: Math.max(s.ac, s.fc) };
  const data = docsState.doc && docsState.doc.data;
  return data ? sheetExpandRangeForMerges(data, rg) : rg;
}
// 選んでいる範囲が「結合セル1つ（またはセル1つ）」だけかどうか
function sheetSelIsSingle() {
  const data = docsState.doc.data;
  const { r1, r2, c1, c2 } = sheetSelRange();
  if (r1 === r2 && c1 === c2) return true;
  const m = sheetMergeAt(data, r1, c1);
  return !!m && m.r === r1 && m.c === c1 && m.r + m.rs - 1 === r2 && m.c + m.cs - 1 === c2;
}
