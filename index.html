<style>
:root {
  --color-paper: #f6f4ee;
  --color-panel: #ffffff;
  --color-ink: #22262b;
  --color-ink-soft: #5b6168;
  --color-navy: #1c2b39;
  --color-navy-soft: #33465a;
  --color-line: #d9d4c6;
  --color-present: #2f6f4e;
  --color-present-bg: #e4efe6;
  --color-absent: #a8442f;
  --color-absent-bg: #f5e6e1;
  --color-gold: #b8863b;
  --color-accent: #3a7ca5;
  --color-accent-hover: #2f6690;
}
* { box-sizing: border-box; }
html, body, #app { height: 100%; }
body {
  margin: 0;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
/* 画面全体の文字をはっきり・くっきり・太めに統一する */
*, *::before, *::after {
  font-weight: 700 !important;
}
input, select, textarea, button {
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.font-display { font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-weight: 900; letter-spacing: 0.01em; }
button { cursor: pointer; font-family: inherit; }
button:active { filter: brightness(0.85); }
.btn-light:active { background: var(--color-line); }
.icon-btn:active:not(:disabled) { background: var(--color-line); }
nav.app-nav .tab:active { color: var(--color-navy-soft); }
.category-tabs button:active { color: var(--color-navy-soft); }
input, select { font-family: inherit; }
select {
  border: 1px solid var(--color-line);
  border-radius: 8px;
  padding: 6px 10px;
  background: white;
  font-size: 14px;
  height: 38px;
  box-sizing: border-box;
}
:focus-visible { outline: 2px solid var(--color-gold); outline-offset: 2px; }

/* ---- ログイン画面 ---- */
.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.login-card {
  width: 100%;
  max-width: 380px;
  background: var(--color-panel);
  border: 1px solid var(--color-line);
  border-radius: 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  padding: 44px 40px;
}
.login-card .eyebrow { font-size: 13px; color: var(--color-ink-soft); margin: 0 0 6px; }
.login-card h1 { font-size: 26px; margin: 0 0 32px; color: var(--color-navy); }
.login-card label { display:block; font-size: 14px; color: var(--color-ink-soft); margin-bottom: 8px; }
.login-card input[type=password] {
  width: 100%; border: 1px solid var(--color-line); border-radius: 10px;
  padding: 12px 14px; margin-bottom: 18px; background: white; font-size: 15px;
}
.login-card input[type=password]:focus { border-color: var(--color-navy); }
.login-error { font-size: 13px; color: var(--color-absent); margin: 0 0 14px; }
.btn-primary {
  width: 100%; background: var(--color-navy); color: white; border: none;
  border-radius: 10px; padding: 14px; font-weight: 500; font-size: 15px;
}
.btn-primary:hover { background: var(--color-navy-soft); }
.btn-primary:disabled { opacity: 0.4; cursor: default; }

/* ---- ナビゲーション（上部横並び） ---- */
.app-shell { display: block; }
nav.app-nav { border-bottom: 1px solid var(--color-line); background: var(--color-panel); }
nav.app-nav .inner {
  max-width: 1400px; margin: 0 auto; padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
}
nav.app-nav .tabs { display: flex; flex-wrap: wrap; }
nav.app-nav .tab {
  padding: 12px 16px; font-size: 14px; background: none; border: none;
  border-bottom: 2px solid transparent; color: var(--color-ink-soft);
}
nav.app-nav .tab.active { border-color: var(--color-navy); color: var(--color-navy); font-weight: 500; }
nav.app-nav .sidebar-footer {
  padding: 8px 0; display: flex; flex-direction: row; align-items: center; gap: 12px;
}
nav.app-nav .logout { font-size: 12px; color: var(--color-ink-soft); text-decoration: underline; background: none; border: none; }
.btn-update {
  background: #c0392b; color: white; border: none; border-radius: 8px;
  padding: 6px 14px; font-size: 12px; font-weight: 500;
}
.btn-update:hover { background: #a5301f; }
.btn-update:active { background: #8a2819; }

/* ---- 共通ツールバー ---- */
.toolbar {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px;
  margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--color-line);
}
.toolbar .field label { display:block; font-size: 11px; color: var(--color-ink-soft); margin-bottom: 4px; }
.toolbar select, .toolbar input[type=text] {
  border: 1px solid var(--color-line); background: white; border-radius: 8px;
  padding: 8px 12px; font-size: 14px;
}
.btn-dark {
  background: white; color: var(--color-accent); border: 2px solid var(--color-accent); border-radius: 8px;
  padding: 8px 16px; font-size: 14px; height: 38px; box-sizing: border-box;
}
.btn-dark:hover { background: var(--color-accent); color: white; }
.btn-dark:active { background: var(--color-accent-hover); border-color: var(--color-accent-hover); color: white; }
.btn-light {
  background: white; border: 1px solid var(--color-line); border-radius: 8px;
  padding: 8px 16px; font-size: 14px; color: var(--color-ink); height: 38px; box-sizing: border-box;
}
.btn-light:hover { background: var(--color-paper); }

/* ---- 出欠入力グリッド ---- */
.grid-wrap { max-width: 1400px; margin: 0 auto; padding: 32px 16px; }
.help-view { max-width: 820px; }
.help-section { margin-top: 28px; }
.help-section h2 { font-size: 16px; color: var(--color-navy); margin: 0 0 8px; }
.help-section p { margin: 0 0 8px; color: var(--color-ink); }
.help-section ul { margin: 0; padding-left: 20px; }
.help-section li { margin-bottom: 6px; line-height: 1.6; }
.grid-header { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:24px; }
.grid-header h1 { font-size: 20px; margin: 0; color: var(--color-navy); }
.grid-header .eyebrow { font-size: 12px; color: var(--color-ink-soft); margin: 0 0 4px; }
.category-tabs { display:flex; gap: 2px; margin-bottom: 16px; }
.category-tabs button {
  padding: 8px 16px; font-size: 14px; background: none; border: none;
  border-bottom: 2px solid transparent; color: var(--color-ink-soft);
}
.category-tabs button.active { border-color: var(--color-navy); color: var(--color-navy); font-weight: 500; }
table.att-table { min-width: 100%; border-collapse: collapse; font-size: 13px; background: var(--color-panel); }
.att-table-wrap {
  overflow-x: auto; overflow-y: auto; max-height: 70vh;
  border: 1px solid var(--color-line); background: var(--color-panel); border-radius: 8px;
}
table.att-table thead tr { background: var(--color-accent); color: white; }
table.att-table thead th { position: sticky; top: 0; z-index: 20; background: var(--color-accent); }
table.att-table th { font-weight: 500; padding: 6px 8px; text-align: center; white-space: nowrap; }
table.att-table td { padding: 1px 4px; border-top: 1px solid var(--color-line); line-height: 1.2; }
table.att-table tbody tr:hover { background: #fbfaf6; }
.att-editable {
  width: 100%; background: transparent; padding: 2px 4px; border-radius: 8px;
  border: 1px solid transparent; font-size: 13px;
}
.att-editable:hover { border-color: var(--color-line); }
.att-editable:focus { border-color: var(--color-navy); background: white; }
.att-select {
  height: 26px; padding: 1px 6px; font-size: 13px;
}
.att-cell-btn {
  width: 26px; height: 26px; border-radius: 6px; font-weight: 500; font-size: 13px; border: 1px solid var(--color-line);
  background: white; color: transparent;
}
.att-cell-btn.present { background: var(--color-present-bg); color: var(--color-present); border-color: rgba(47,111,78,0.3); }
.att-cell-btn.absent { background: var(--color-absent-bg); color: var(--color-absent); border-color: rgba(168,68,47,0.3); }
.icon-btn {
  width: 24px; height: 24px; display:flex; align-items:center; justify-content:center;
  border-radius: 8px; font-size: 11px; border: 1px solid var(--color-line); background: white; color: var(--color-ink-soft);
}
.icon-btn:disabled { opacity: 0.3; }
.icon-btn.danger { color: var(--color-absent); }
.icon-btn.danger:hover { border-color: var(--color-absent); }
.drag-handle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 100%; height: 28px; cursor: grab; color: var(--color-ink-soft);
  font-size: 14px; user-select: none; touch-action: none;
}
.drag-handle:active { cursor: grabbing; }
tr[data-row-member].dragging { opacity: 0.4; }
tr[data-row-member].drag-over-top { box-shadow: inset 0 2px 0 0 var(--color-navy); }
tr[data-row-member].drag-over-bottom { box-shadow: inset 0 -2px 0 0 var(--color-navy); }
.hint-text { margin-top: 24px; font-size: 12px; color: var(--color-ink-soft); }

/* ---- 現場入力（スマホ用） ---- */
.field-view { max-width: 480px; margin: 0 auto; padding: 4px 16px 60px; }
.field-header { margin-bottom: 12px; }
.field-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.field-dept-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.field-dept-tabs button {
  padding: 6px 12px; font-size: 12px; border-radius: 999px; border: 1px solid var(--color-line);
  background: white; color: var(--color-ink-soft);
}
.field-dept-tabs button.active { background: var(--color-gold); color: white; border-color: var(--color-gold); font-weight: 500; }
.field-dept-tabs button.saved { border-color: var(--color-present); color: var(--color-present); }
.field-dept-tabs button.saved.active { background: var(--color-present); color: white; border-color: var(--color-present); }
.field-controls select { border: 1px solid var(--color-line); border-radius: 8px; padding: 8px 10px; font-size: 14px; background: white; }
.field-chip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 0; }
.field-chip {
  padding: 10px 6px; border-radius: 10px; border: 2px solid var(--color-line);
  background: white; font-size: 16px; font-weight: 500; color: var(--color-ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.field-chip.filled { border-color: var(--color-present); background: var(--color-present); color: white; font-weight: 700; }
.field-chip.pre-absent { border-color: var(--color-absent); background: var(--color-absent); color: white; font-weight: 700; }
.field-chip.pre-absent.filled { border-color: var(--color-absent); background: var(--color-absent); }
.field-chip-badge {
  display: inline-flex; align-items: center; justify-content: center;
  writing-mode: vertical-rl; text-orientation: upright;
  font-size: 10px; font-weight: 700; color: white; background: var(--color-accent);
  border-radius: 4px; padding: 2px 1px; margin-right: 4px; vertical-align: middle; line-height: 1.1;
}
.field-chip-badge.leader { background: var(--color-gold); }
.field-chip-badge.day-leader { background: var(--color-navy); }
.field-checkpoint-time-input {
  width: 70px; box-sizing: border-box; padding: 8px; text-align: center;
  border: 1px solid var(--color-line); border-radius: 8px; font-size: 14px;
}
.field-action-row { display: flex; gap: 10px; margin-top: 20px; }
.field-save-btn {
  display: block; flex: 1; padding: 14px;
  background: var(--color-navy); color: white; border: none; border-radius: 10px;
  font-size: 16px; font-weight: 500;
}
.field-save-btn:disabled { opacity: 0.6; }
.field-all-present-btn {
  display: block; flex: 1; padding: 14px;

// ---- Supabase接続情報（スパーベース・②③④⑤共用プロジェクト） ----

let SPECIAL_ROLE_CATEGORIES = []; // 「神」「Ｌ」（神名流し担当・リーダー）を使う区分
let NO_CHECKPOINT_YEARLY_CATEGORIES = []; // 年ごとだが「事前調査/会場外/会場内」の3回チェックは使わない区分
// 年ごとの区分は、1年に3回（事前調査／会場外／会場内）まで出欠確認できる。
// 内部的には month_seq の 1/2/3 をこの3回の記録として使い回す。

];
let FIELD_VISIBLE_CATEGORIES = []; // 現場入力（スマホ用）に表示する区分

const GEPPAI_REPORT_DEPT_ORDER = ['庶務係', '現場第一班', '現場第二班', '現場第三班', '製材班', '大工班', '木工班', '鉄工班', '空調衛生係'];
const ROWS_PER_BLOCK = 19;

// 区分ごとの表示順（部署でまとめ、各部署内は主任を先頭に）でメンバーを並べる
function getOrderedMembersForCategory(category) {
  const activeMembers = getCategoryMemberEntries(category);
  if (category === 'geppai') {
    const deptOrder = new Map(GEPPAI_REPORT_DEPT_ORDER.map((name, i) => [name, i]));
    return activeMembers
      .filter((m) => m.department !== '営繕課')
      .slice()
      .sort((a, b) => {
        const orderA = deptOrder.get(a.department) ?? Infinity;
        const orderB = deptOrder.get(b.department) ?? Infinity;
        if (orderA !== orderB) return orderA - orderB;
        return (a.is_leader ? 0 : 1) - (b.is_leader ? 0 : 1);
      });
  }
  const deptOrder = new Map(state.departments.map((d, i) => [d.name, i]));
  return activeMembers.slice().sort((a, b) => {
    const orderA = deptOrder.get(a.department) ?? Infinity;
    const orderB = deptOrder.get(b.department) ?? Infinity;
    if (orderA !== orderB) return orderA - orderB;
    return (a.is_leader ? 0 : 1) - (b.is_leader ? 0 : 1);
  });
}

function calendarMonthToSeq(m) { return m >= 4 ? m - 3 : m + 9; }
function getCurrentReikiMonthContext() {
  return getReikiMonthContext(new Date().getMonth() + 1);
}
function getReikiMonthContext(calendarMonth) {
  const fiscalYear = state.fiscalYears.find(y => y.id === state.fiscalYearId) || null;
  const reikiYear = fiscalYear
    ? (calendarMonth >= 4 ? fiscalYear.start_reiki_year : fiscalYear.start_reiki_year + 1)
    : null;
  const monthSeq = calendarMonthToSeq(calendarMonth);
  return { reikiYear, calendarMonth, fiscalYear, monthSeq };
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- アプリ全体の状態 ----
const state = {
  unlocked: false,
  view: 'grid', // 'grid' | 'report' | 'roster' | 'archive' | 'master'
  fiscalYears: [],
  fiscalYearId: null,
  members: [],
  departments: [],

  masterOpen: { department: false, position: false, dutyDay: false, leader: false, memberDept: false, categoryMembers: false, nioigakeRoles: false, categories: false, ceremonyTimes: false, dutyDayLabels: false },
  archiveFiscalYears: [], // 保管済み年度の一覧（asagami_fiscal_years からarchived=trueのもの）
  archiveFiscalYearId: null,
  archiveCategory: 'asagami',
  archiveRows: [], // 選択中の年度・区分の保管記録
  bulkActionMonth: new Date().getMonth() + 1, // 「全員出席」等の一括操作の対象月
  yearlyAttendance: new Map(), // 慰労拝受（中元/歳暮）用: `${memberId}-${category}-${fiscalYearId}` -> '○'|'×'
  checkpointTimes: new Map(), // `${category}::${fiscalYearId}::${checkpoint}` -> 会場外/会場内チェックの共通時刻
  yearlyAttendanceLoadedCategory: null,
  bulkActionFiscalYearId: null, // 慰労拝受の一括操作の対象年度
  bulkActionCheckpoint: 1, // 慰労拝受の一括操作の対象（事前調査/会場外/会場内）
  categoryMembers: new Map(), // `${category}::${memberId}` -> {member_id, category, sort_order, is_active}
  ceremonyTimes: new Map(), // reiki_year -> {chugen_checkin, ...}
  ceremonyTimesYears: [],
  ceremonyTimesLoaded: false,
  categories: [], // asagami_categories の内容（区分の一覧・並び順・設定）
  fieldCategory: 'asagami',
  fieldMonth: new Date().getMonth() + 1,
  fieldCheckpoint: 1, // 慰労拝受の現場入力での対象（事前調査/会場外/会場内）
  fieldDutyDayFilter: null, // 朝の神殿掃除の現場入力での当番日絞り込み（1/2/3またはnull=全員）
  fieldDeptFilter: 'eizen-shomu',
  fieldSavedGroups: new Set(), // 保存済みの「区分×年度×月(or年)×班」の組み合わせ
  fieldSavedGroups: new Set(), // 保存済みの班（`${category}-${deptKey}`）
};

function attKey(memberId, category, monthSeq) { return `${memberId}-${category}-${monthSeq}`; }

// 画面ごとに印刷用紙のサイズ・向きを切り替える
function setPrintPageSize(cssRule) {
  let styleEl = document.getElementById('dynamic-page-style');
  if (!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = 'dynamic-page-style';

const app = document.getElementById('app');

// ==================== 起動処理 ====================
const UNLOCK_KEY = 'asagami_unlocked';

async function init() {
  state.unlocked = sessionStorage.getItem(UNLOCK_KEY) === '1';
  renderRoot();
}

function isFieldOnlyMode() {
  return new URLSearchParams(window.location.search).get('field') === '1';
}

function renderRoot() {
  // 合言葉ログインは廃止し、常に直接アプリを開く
  renderMainShell();
}

// ==================== ログイン画面 ====================
function renderLogin() {
  app.innerHTML = `
    <div class="login-wrap">
      <form class="login-card" id="login-form">
        <p class="eyebrow">出欠管理システム</p>
        <h1 class="font-display">営繕課出欠記録</h1>
        <label for="login-password">合言葉</label>
        <input id="login-password" type="password" autofocus placeholder="合言葉を入力" />
        <p class="login-error" id="login-error" style="display:none;"></p>
        <button type="submit" class="btn-primary" id="login-submit">ログイン</button>
      </form>
    </div>
  `;

  const form = document.getElementById('login-form');
  const input = document.getElementById('login-password');
  const errorEl = document.getElementById('login-error');
  const submitBtn = document.getElementById('login-submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = input.value;
    if (!password) return;
    errorEl.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = '確認中…';
    try {
      const { data, error } = await sb.rpc(RPC_VERIFY_PASSWORD, { input_password: password });
      if (error) throw new Error('接続に失敗しました。しばらくしてからもう一度お試しください。');
      if (!data) throw new Error('合言葉が違います。');
      sessionStorage.setItem(UNLOCK_KEY, '1');
      state.unlocked = true;
      renderRoot();
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'ログイン';
    }
  });
}

  const isFieldOnly = isFieldOnlyMode();

  if (isFieldOnly) {
    state.view = 'field';
    app.innerHTML = `

        <div id="view-container"><div class="loading">読み込み中…</div></div>
      </div>
    `;
    await loadFiscalYearsAndMembers();
    renderView();
    return;
  }

  app.innerHTML = `
    <div class="app-shell">

          </div>

            ${renderUpdateButtonHtml()}

        </div>
      </nav>

  document.querySelectorAll('.tab').forEach((btn) => {

  updateNavActive();
  await loadFiscalYearsAndMembers();

const JUST_UPDATED_KEY = 'asagami_just_updated';

function renderUpdateButtonHtml() {
  if (sessionStorage.getItem(JUST_UPDATED_KEY) === '1') {
    return `<p id="update-confirm-msg" style="font-size:12px;color:var(--color-present);font-weight:500;margin:0;">✓ 最新の情報に更新しました</p>`;
  }
  return `<button class="btn-update" id="hard-refresh-btn">Update</button><span id="update-message" style="font-size:11px;color:var(--color-ink-soft);"></span>`;
}

function attachUpdateButtonHandler() {
  const btn = document.getElementById('hard-refresh-btn');
  if (!btn) return;
  btn.addEventListener('click', () => {
    sessionStorage.setItem(JUST_UPDATED_KEY, '1');
    const msgEl = document.getElementById('update-message');
    if (msgEl) msgEl.textContent = '最新版を読み込んでいます…';
    setTimeout(() => {
      const params = new URLSearchParams(window.location.search);
      params.set('_', Date.now());
      const url = window.location.origin + window.location.pathname + '?' + params.toString();
      window.location.href = url;
    }, 400);
  });
}

function updateNavActive() {
  document.querySelectorAll('.tab').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.view === state.view);
  });
}

// 「出欠記録」の見出しを右クリックしたときの隠しメニュー（現場入力への入口）
function showFieldShortcutMenu(x, y) {
  const old = document.getElementById('field-shortcut-menu');
  if (old) old.remove();

  const menu = document.createElement('div');
  menu.id = 'field-shortcut-menu';
  menu.className = 'context-menu';
  menu.style.left = `${x}px`;
  menu.style.top = `${y}px`;
  menu.innerHTML = `<button id="field-shortcut-open">現場入力（スマホ用）を開く</button>`;
  document.body.appendChild(menu);

  document.getElementById('field-shortcut-open').addEventListener('click', () => {
    menu.remove();
    state.view = 'field';
    renderView();
  });

  const closeOnOutsideClick = (ev) => {
    if (!menu.contains(ev.target)) {
      menu.remove();
      document.removeEventListener('click', closeOnOutsideClick);
      document.removeEventListener('contextmenu', closeOnOutsideClick);
    }
  };
  setTimeout(() => {
    document.addEventListener('click', closeOnOutsideClick);
    document.addEventListener('contextmenu', closeOnOutsideClick);
  }, 0);
}

function renderView() {
  const container = document.getElementById('view-container');
  if (state.view === 'grid') renderGridView(container);
  else if (state.view === 'field') renderFieldView(container);
  else if (state.view === 'report') renderReportView(container, 'asagami');
  else if (state.view === 'report-geppai') renderReportView(container, 'geppai');
  else if (state.view === 'roster') renderRosterView(container);
  else if (state.view === 'archive') renderArchiveView(container);
  else if (state.view === 'master') renderMasterView(container);
  else if (state.view === 'help') renderHelpView(container);
}

// ==================== データ取得 ====================
async function loadFiscalYearsAndMembers() {
  const { data: fyData, error: fyError } = await sb
    .from(T_FISCAL_YEARS).select('*').order('start_reiki_year', { ascending: false });
  if (fyError) { console.error(fyError); return; }
  state.fiscalYears = fyData ?? [];
  state.fiscalYearId = (state.fiscalYears.find(y => y.is_current) ?? state.fiscalYears[0])?.id ?? null;

  const { data: memberData, error: memberError } = await sb
    .from(T_MEMBERS).select('*').eq('is_active', true).order('sort_order', { ascending: true });
  if (memberError) { console.error(memberError); return; }
  state.members = memberData ?? [];

  const { data: deptData } = await sb.from(T_DEPARTMENTS).select('*').order('sort_order', { ascending: true });
  state.departments = deptData ?? [];

  const { data: posData } = await sb.from(T_POSITIONS).select('*').order('sort_order', { ascending: true });
  state.positions = posData ?? [];

  const { data: catMemberData } = await sb.from(T_CATEGORY_MEMBERS).select('*');
  state.categoryMembers = new Map((catMemberData ?? []).map((r) => [`${r.category}::${r.member_id}`, r]));

  const { data: catData } = await sb.from(T_CATEGORIES).select('*').order('sort_order', { ascending: true });
  state.categories = catData ?? [];
  applyCategoriesFromState();

  const { data: checkpointTimeData } = await sb.from(T_CHECKPOINT_TIMES).select('*');
  state.checkpointTimes = new Map((checkpointTimeData ?? []).map((r) => [`${r.category}::${r.fiscal_year_id}::${r.checkpoint}`, r.time_value]));

  const { data: configData } = await sb.from(T_CONFIG).select('day1_label,day2_label,day3_label').eq('id', true).maybeSingle();
  if (configData) {
    state.rosterDay1 = configData.day1_label ?? state.rosterDay1;
    state.rosterDay2 = configData.day2_label ?? state.rosterDay2;
    state.rosterDay3 = configData.day3_label ?? state.rosterDay3;
  }

  await loadAttendanceForFiscalYear();
}

// state.categories の内容を、アプリ全体で使うCATEGORY_LABEL等に反映する
function applyCategoriesFromState() {
  CATEGORY_LABEL = Object.fromEntries(state.categories.map((c) => [c.key, c.label]));
  ALL_CATEGORIES = [...state.categories].sort((a, b) => a.sort_order - b.sort_order).map((c) => c.key);
  YEARLY_CATEGORIES = state.categories.filter((c) => c.is_yearly).map((c) => c.key);
  SPECIAL_ROLE_CATEGORIES = state.categories.filter((c) => c.has_special_role).map((c) => c.key);
  NO_CHECKPOINT_YEARLY_CATEGORIES = state.categories.filter((c) => c.is_yearly && c.has_checkpoints === false).map((c) => c.key);
  FIELD_VISIBLE_CATEGORIES = state.categories
    .filter((c) => c.show_in_field)
    .sort((a, b) => (a.field_sort_order ?? a.sort_order) - (b.field_sort_order ?? b.sort_order))
    .map((c) => c.key);
  GRID_VISIBLE_CATEGORIES = state.categories
    .filter((c) => c.show_in_grid)
    .sort((a, b) => a.sort_order - b.sort_order)
    .map((c) => c.key);
  if (!ALL_CATEGORIES.includes(state.category)) state.category = ALL_CATEGORIES[0] ?? state.category;
  if (!GRID_VISIBLE_CATEGORIES.includes(state.category)) state.category = GRID_VISIBLE_CATEGORIES[0] ?? ALL_CATEGORIES[0] ?? state.category;
  if (!ALL_CATEGORIES.includes(state.fieldCategory)) state.fieldCategory = FIELD_VISIBLE_CATEGORIES[0] ?? ALL_CATEGORIES[0] ?? state.fieldCategory;
}

// 指定区分の名簿（有効なメンバーのみ、区分ごとの並び順）を返す
// 「にをいがけでー(9/28)」のような区分名から、括弧の中身（日付部分）だけを取り出す。
// 括弧がなければそのまま返す
function shortenCategoryLabelForDay(label) {
  const match = label.match(/[（(]([^）)]+)[）)]/);
  return match ? match[1] : label;
}

function getCategoryMemberEntries(category) {
  return state.members
    .map((m) => {
      const cm = state.categoryMembers.get(`${category}::${m.id}`);
      const isActive = cm ? cm.is_active : true;
      const sortOrder = cm ? cm.sort_order : m.sort_order;
      return isActive ? { ...m, _catSortOrder: sortOrder, _isSpecial: !!cm?.is_special, _isSpecialLeader: !!cm?.is_special_leader, _isDayLeader: !!cm?.is_day_leader } : null;
    })
    .filter(Boolean)
    .sort((a, b) => a._catSortOrder - b._catSortOrder);
}

async function loadAttendanceForFiscalYear() {
  state.attendance = new Map();
  if (!state.fiscalYearId) return;
  const { data, error } = await sb
    .from(T_ATTENDANCE).select('*').eq('fiscal_year_id', state.fiscalYearId);
  if (error) { console.error(error); return; }
  for (const row of (data ?? [])) {
    state.attendance.set(attKey(row.member_id, row.category, row.month_seq), row.status);
  }
}

function currentFiscalYearLabel() {
  return state.fiscalYears.find(y => y.id === state.fiscalYearId)?.label ?? '';
}

    renderMasterPanels();
  });
  document.getElementById('edit-member-dept-btn').addEventListener('click', () => {
    state.masterOpen.memberDept = !state.masterOpen.memberDept;
    renderMasterPanels();
  });
  document.getElementById('edit-category-members-btn').addEventListener('click', () => {
    state.masterOpen.categoryMembers = !state.masterOpen.categoryMembers;
    renderMasterPanels();
  });
  document.getElementById('edit-nioigake-roles-btn').addEventListener('click', () => {
    state.masterOpen.nioigakeRoles = !state.masterOpen.nioigakeRoles;
    renderMasterPanels();
  });
  document.getElementById('edit-categories-btn').addEventListener('click', () => {
    state.masterOpen.categories = !state.masterOpen.categories;
    renderMasterPanels();
  });
  document.getElementById('edit-ceremony-times-btn').addEventListener('click', async () => {
    state.masterOpen.ceremonyTimes = !state.masterOpen.ceremonyTimes;
    if (state.masterOpen.ceremonyTimes && !state.ceremonyTimesLoaded) {
      await loadCeremonyTimes();
    }
    renderMasterPanels();
  });
  document.getElementById('edit-duty-day-labels-btn').addEventListener('click', () => {
    state.masterOpen.dutyDayLabels = !state.masterOpen.dutyDayLabels;
    renderMasterPanels();
  });

  renderMasterPanels();
}

function renderMasterPanels() {
  const panelsEl = document.getElementById('master-panels');
  if (!panelsEl) return;
  panelsEl.innerHTML = '';
  if (state.masterOpen.department) panelsEl.appendChild(buildMasterPanel('department'));
  if (state.masterOpen.position) panelsEl.appendChild(buildMasterPanel('position'));
  if (state.masterOpen.dutyDay) panelsEl.appendChild(buildDutyDayPanel());
  if (state.masterOpen.leader) panelsEl.appendChild(buildLeaderPanel());
  if (state.masterOpen.memberDept) panelsEl.appendChild(buildMemberDeptPanel());
  if (state.masterOpen.categoryMembers) panelsEl.appendChild(buildCategoryMembersPanel({ sortByCategory: null }));
  if (state.masterOpen.nioigakeRoles) panelsEl.appendChild(buildNioigakeRolesPanel());
  if (state.masterOpen.categories) panelsEl.appendChild(buildCategoriesPanel());
  if (state.masterOpen.ceremonyTimes) panelsEl.appendChild(buildCeremonyTimesPanel());
  if (state.masterOpen.dutyDayLabels) panelsEl.appendChild(buildDutyDayLabelsPanel());
}

function buildMemberDeptPanel() {
  const panel = document.createElement('div');
  panel.className = 'master-panel';
  panel.style.maxWidth = '420px';
  panel.innerHTML = `
    <h2>メンバーの部署を変更</h2>
    <p class="modal-hint" style="margin-bottom:10px;">
      選んだ部署に応じて、当番表の担当日や当番表への振り分けも自動的に変わります。
    </p>
    <ul class="modal-list" id="member-dept-list" style="max-height:400px;overflow-y:auto;"></ul>
  `;

  function renderList() {
    const listEl = panel.querySelector('#member-dept-list');
    const deptOrder = new Map(state.departments.map((d, i) => [d.name, i]));
    const sortedMembers = [...state.members].sort((a, b) => {
      const orderA = deptOrder.get(a.department) ?? Infinity;
      const orderB = deptOrder.get(b.department) ?? Infinity;
      if (orderA !== orderB) return orderA - orderB;
      return (a.is_leader ? 0 : 1) - (b.is_leader ? 0 : 1);
    });
    listEl.innerHTML = sortedMembers.map((m) => `
      <li data-id="${m.id}" style="justify-content:space-between;">
        <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;">${escapeHtml(m.name)}</span>
        <select class="member-dept-select" data-id="${m.id}" style="flex-shrink:0;min-width:150px;">
          <option value="" ${!m.department ? 'selected' : ''}>（部署未設定）</option>
          ${state.departments.map((d) => `<option value="${escapeHtml(d.name)}" ${m.department === d.name ? 'selected' : ''}>${escapeHtml(d.name)}</option>`).join('')}
        </select>
      </li>`).join('');

    listEl.querySelectorAll('.member-dept-select').forEach((sel) => {
      const id = Number(sel.dataset.id);
      sel.addEventListener('change', async () => {
        const val = sel.value || null;
        const m = state.members.find((mm) => mm.id === id);
        m.department = val;
        await sb.from(T_MEMBERS).update({ department: val }).eq('id', id);
        renderView();
      });
    });
  }

  renderList();
  return panel;
}

function buildCategoryMembersPanel(options) {
  const opts = options || {};
  const title = opts.title || '区分の名簿を管理';
  const categoriesToShow = opts.categories || ALL_CATEGORIES;
  const sortByCategory = opts.sortByCategory ?? categoriesToShow[0] ?? null;
  const specialCatsInView = categoriesToShow.filter((c) => SPECIAL_ROLE_CATEGORIES.includes(c));
  const normalCatsInView = categoriesToShow.filter((c) => !SPECIAL_ROLE_CATEGORIES.includes(c));

  const panel = document.createElement('div');
  panel.className = 'master-panel';
  panel.style.maxWidth = '1300px';
  panel.innerHTML = `
    <h2>${escapeHtml(title)}</h2>
    <p class="modal-hint" style="margin-bottom:10px;">
      チェックを外すと、その人はその区分(出欠入力・報告書・当番表・現場入力など)の名簿から外れます。
      退職にはならず、記録も削除されません。チェックを入れ直せばいつでも名簿に戻せます。<br>
      ${specialCatsInView.length > 0 ? '「にをいがけデー」欄は参加日をプルダウンで選びます。「神」「責」「総」の設定は「にをいがけデーの役割区分」で行います。' : ''}
    </p>
    <div style="overflow-x:auto;">
      <div id="category-members-header-${sortByCategory}" style="display:flex;justify-content:space-between;font-size:11px;color:var(--color-ink-soft);font-weight:500;padding:4px 8px;border-bottom:1px solid var(--color-line);background:var(--color-panel);position:sticky;top:0;z-index:1;min-width:840px;"></div>
      <ul class="modal-list" id="category-members-list-${sortByCategory}" style="max-height:400px;overflow-y:auto;margin-top:0;min-width:840px;"></ul>
    </div>
  `;

  function findActiveSpecialCat(memberId) {
    return specialCatsInView.find((c) => state.categoryMembers.get(`${c}::${memberId}`)?.is_active);
  }

  function buildNioigakeCell(m) {
    const activeCat = findActiveSpecialCat(m.id);
    return `<span style="width:120px;flex-shrink:0;display:flex;align-items:center;justify-content:center;">
      <select class="nioigake-day-select" data-id="${m.id}" style="font-size:11px;max-width:110px;">
        <option value="">－</option>
        ${specialCatsInView.map((c) => `<option value="${c}" ${activeCat === c ? 'selected' : ''}>${escapeHtml(shortenCategoryLabelForDay(CATEGORY_LABEL[c]))}</option>`).join('')}
      </select>
    </span>`;
  }

  function renderList() {
    const headerEl = panel.querySelector(`#category-members-header-${sortByCategory}`);
    headerEl.innerHTML = `
      <span style="width:90px;min-width:90px;flex-shrink:0;">氏名</span>
      ${normalCatsInView.map((c) => `<span style="min-width:44px;padding:0 4px;text-align:center;flex-shrink:0;white-space:nowrap;font-size:10px;">${escapeHtml(CATEGORY_LABEL[c])}</span>`).join('')}
      ${specialCatsInView.length > 0 ? `<span style="width:120px;text-align:center;flex-shrink:0;">にをいがけデー</span>` : ''}
    `;

    // 表示順は、指定された区分（1つ目）での並び順に合わせる
    const membersInOrder = sortByCategory
      ? getCategoryMemberEntries(sortByCategory).concat(
          state.members.filter((m) => !getCategoryMemberEntries(sortByCategory).some((mm) => mm.id === m.id))
        )
      : state.members;

    const listEl = panel.querySelector(`#category-members-list-${sortByCategory}`);
    listEl.innerHTML = membersInOrder.map((m) => `
      <li data-id="${m.id}" style="justify-content:space-between;">
        <span style="width:90px;min-width:90px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(m.name)}</span>
        ${normalCatsInView.map((c) => {
          const cm = state.categoryMembers.get(`${c}::${m.id}`);
          const isActive = cm ? cm.is_active : true;
          return `<span style="min-width:44px;padding:0 4px;text-align:center;flex-shrink:0;">
            <input type="checkbox" class="category-member-checkbox" data-id="${m.id}" data-category="${c}" ${isActive ? 'checked' : ''} />
          </span>`;
        }).join('')}
        ${specialCatsInView.length > 0 ? buildNioigakeCell(m) : ''}
      </li>`).join('');

    listEl.querySelectorAll('.category-member-checkbox').forEach((cb) => {
      cb.addEventListener('change', async () => {
        const memberId = Number(cb.dataset.id);
        const category = cb.dataset.category;
        if (cb.checked) {
          await addMemberToCategory(memberId, category);
          renderList();
        } else {
          const m = state.members.find((mm) => mm.id === memberId);
          const label = m && m.name.trim() ? m.name : 'このメンバー';
          if (!confirm(`${label} を「${CATEGORY_LABEL[category]}」の名簿からだけ外します（退職にはなりません）。よろしいですか？`)) {
            cb.checked = true;
            return;
          }
          const key = `${category}::${memberId}`;
          const existing = state.categoryMembers.get(key) ?? { member_id: memberId, category, sort_order: (m?.sort_order ?? 9999) };
          const updated = { ...existing, member_id: memberId, category, is_active: false, is_special: false, is_special_leader: false, is_day_leader: false };
          state.categoryMembers.set(key, updated);
          await sb.from(T_CATEGORY_MEMBERS).upsert(updated, { onConflict: 'member_id,category' });
          renderList();
        }
      });
    });

    listEl.querySelectorAll('.nioigake-day-select').forEach((sel) => {
      sel.addEventListener('change', async () => {
        const memberId = Number(sel.dataset.id);
        const newCat = sel.value || null;
        const oldCat = findActiveSpecialCat(memberId);
        if (oldCat === newCat) return;
        const m = state.members.find((mm) => mm.id === memberId);
        const writes = [];

        if (oldCat) {
          const key = `${oldCat}::${memberId}`;
          const existing = state.categoryMembers.get(key) ?? { member_id: memberId, category: oldCat, sort_order: (m?.sort_order ?? 9999) };
          const cleared = { ...existing, member_id: memberId, category: oldCat, is_active: false, is_special: false, is_special_leader: false, is_day_leader: false };
          state.categoryMembers.set(key, cleared);
          writes.push(cleared);
        }
        if (newCat) {
          const list = getCategoryMemberEntries(newCat);
          const maxOrder = list.length > 0 ? Math.max(...list.map((mm) => mm._catSortOrder)) : 0;
          const key = `${newCat}::${memberId}`;
          const updated = { member_id: memberId, category: newCat, sort_order: maxOrder + 1, is_active: true };
          state.categoryMembers.set(key, updated);
          writes.push(updated);
        }
        if (writes.length > 0) await sb.from(T_CATEGORY_MEMBERS).upsert(writes, { onConflict: 'member_id,category' });
        renderList();
      });
    });
  }

  renderList();
  return panel;
}

function buildNioigakeRolesPanel() {
  const panel = document.createElement('div');
  panel.className = 'master-panel';
  panel.style.maxWidth = '900px';
  panel.innerHTML = `
    <h2>にをいがけデーの役割区分</h2>
    <p class="modal-hint" style="margin-bottom:10px;">
      「区分の名簿を管理」で参加日を選んだ人だけがここに表示されます。
      「神」は神名流しなど特別な役割の人、「責」はそのリーダー(神責)、「総」はその日全体の責任者(1人だけ)を表します。
    </p>
    <div id="nioigake-roles-body" style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;"></div>
  `;

  function renderRoles() {
    const bodyEl = panel.querySelector('#nioigake-roles-body');
    bodyEl.innerHTML = SPECIAL_ROLE_CATEGORIES.map((category, index) => {
      const members = getOrderedMembersForCategory(category);
      const rows = members.map((m) => {
        const cm = state.categoryMembers.get(`${category}::${m.id}`);
        const isSpecial = cm ? !!cm.is_special : false;
        const isLeader = cm ? !!cm.is_special_leader : false;
        const isDayLeader = cm ? !!cm.is_day_leader : false;
        const isTransport = cm ? !!cm.is_transport : false;
        return `<li data-id="${m.id}" style="justify-content:space-between;border-bottom:1px solid var(--color-line);padding:6px 0;">
          <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;">${escapeHtml(m.name)}</span>
          <label style="display:flex;align-items:center;gap:2px;font-size:12px;">
            <input type="checkbox" class="role-special-checkbox" data-id="${m.id}" data-category="${category}" ${isSpecial ? 'checked' : ''} />神
          </label>
          <label style="display:flex;align-items:center;gap:2px;font-size:12px;${isSpecial ? '' : 'opacity:0.3;'}">
            <input type="checkbox" class="role-leader-checkbox" data-id="${m.id}" data-category="${category}" ${isLeader ? 'checked' : ''} ${isSpecial ? '' : 'disabled'} />責
          </label>
          <label style="display:flex;align-items:center;gap:2px;font-size:12px;">
            <input type="checkbox" class="role-day-leader-checkbox" data-id="${m.id}" data-category="${category}" ${isDayLeader ? 'checked' : ''} />総
          </label>
          <label style="display:flex;align-items:center;gap:2px;font-size:12px;">
            <input type="checkbox" class="role-transport-checkbox" data-id="${m.id}" data-category="${category}" ${isTransport ? 'checked' : ''} />運
          </label>
        </li>`;
      }).join('') || `<li style="color:var(--color-ink-soft);border-bottom:1px solid var(--color-line);padding:6px 0;">まだ誰も参加日が選ばれていません</li>`;

      return `
        <div style="min-width:260px;flex:1;${index > 0 ? 'border-left:1px solid var(--color-line);padding-left:20px;' : ''}">
          <h3 style="margin:0 0 6px;font-size:14px;">${escapeHtml(CATEGORY_LABEL[category])}　　<span style="color:var(--color-ink-soft);font-weight:500;">${members.length}名</span></h3>
          <ul class="modal-list" data-category="${category}">${rows}</ul>
        </div>
      `;
    }).join('');

    bodyEl.querySelectorAll('.role-special-checkbox').forEach((cb) => {
      cb.addEventListener('change', async () => {
        const memberId = Number(cb.dataset.id);
        const category = cb.dataset.category;
        const key = `${category}::${memberId}`;
        const m = state.members.find((mm) => mm.id === memberId);
        const existing = state.categoryMembers.get(key) ?? { member_id: memberId, category, sort_order: (m?.sort_order ?? 9999), is_active: true };
        const updated = { ...existing, member_id: memberId, category, is_special: cb.checked };
        if (!cb.checked) updated.is_special_leader = false;
        state.categoryMembers.set(key, updated);
        await sb.from(T_CATEGORY_MEMBERS).upsert(updated, { onConflict: 'member_id,category' });
        renderRoles();
      });
    });

    bodyEl.querySelectorAll('.role-leader-checkbox').forEach((cb) => {
      cb.addEventListener('change', async () => {
        const memberId = Number(cb.dataset.id);
        const category = cb.dataset.category;
        const key = `${category}::${memberId}`;
        const m = state.members.find((mm) => mm.id === memberId);
        const existing = state.categoryMembers.get(key) ?? { member_id: memberId, category, sort_order: (m?.sort_order ?? 9999), is_active: true, is_special: true };
        const updated = { ...existing, member_id: memberId, category, is_special_leader: cb.checked };
        state.categoryMembers.set(key, updated);
        await sb.from(T_CATEGORY_MEMBERS).upsert(updated, { onConflict: 'member_id,category' });
        renderRoles();
      });
    });

    bodyEl.querySelectorAll('.role-day-leader-checkbox').forEach((cb) => {
      cb.addEventListener('change', async () => {
        const memberId = Number(cb.dataset.id);
        const category = cb.dataset.category;
        const wasChecked = cb.checked;

        if (wasChecked) {
          // その日全体の責任者は1人だけにする（同じ日の他の人のチェックを外す）
          const updates = [];
          for (const [key, cm] of state.categoryMembers.entries()) {
            if (cm.category === category && cm.is_day_leader && cm.member_id !== memberId) {
              const cleared = { ...cm, is_day_leader: false };
              state.categoryMembers.set(key, cleared);
              updates.push(cleared);
            }
          }
          if (updates.length > 0) await sb.from(T_CATEGORY_MEMBERS).upsert(updates, { onConflict: 'member_id,category' });
        }

        const key = `${category}::${memberId}`;
        const m = state.members.find((mm) => mm.id === memberId);
        const existing = state.categoryMembers.get(key) ?? { member_id: memberId, category, sort_order: (m?.sort_order ?? 9999), is_active: true };
        const updated = { ...existing, member_id: memberId, category, is_day_leader: wasChecked };
        state.categoryMembers.set(key, updated);
        await sb.from(T_CATEGORY_MEMBERS).upsert(updated, { onConflict: 'member_id,category' });
        renderRoles();
      });
    });

    bodyEl.querySelectorAll('.role-transport-checkbox').forEach((cb) => {
      cb.addEventListener('change', async () => {
        const memberId = Number(cb.dataset.id);
        const category = cb.dataset.category;
        const key = `${category}::${memberId}`;
        const m = state.members.find((mm) => mm.id === memberId);
        const existing = state.categoryMembers.get(key) ?? { member_id: memberId, category, sort_order: (m?.sort_order ?? 9999), is_active: true };
        const updated = { ...existing, member_id: memberId, category, is_transport: cb.checked };
        state.categoryMembers.set(key, updated);
        await sb.from(T_CATEGORY_MEMBERS).upsert(updated, { onConflict: 'member_id,category' });
        renderRoles();
      });
    });
  }

  renderRoles();
  return panel;
}

function buildCategoriesPanel() {
  const panel = document.createElement('div');
  panel.className = 'master-panel';
  panel.style.maxWidth = '760px';
  panel.innerHTML = `
    <h2>区分（タブ）を管理</h2>
    <p class="modal-hint" style="margin-bottom:10px;">
      出欠入力・現場入力などで使う「区分」の一覧です。名前の変更・年ごとの切り替え・
      新しい区分の追加はここで行い、並び順は出欠入力(デスクトップ)と現場入力(スマホ用)で
      別々に設定できます。
    </p>
    <ul class="modal-list" id="categories-list" style="max-height:320px;overflow-y:auto;"></ul>
    <div class="modal-add-row">
      <input type="text" id="new-category-input" placeholder="新しい区分名（例: 特別拝受）" />
      <label style="display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap;">
        <input type="checkbox" id="new-category-yearly" /> 年ごとの記録
      </label>
      <button class="btn-dark" id="new-category-add-btn">追加</button>
    </div>

    <h2 style="margin-top:20px;">出欠入力（デスクトップ）の並び順</h2>
    <ul class="modal-list" id="grid-order-list" style="max-height:220px;overflow-y:auto;"></ul>

    <h2 style="margin-top:20px;">現場入力（スマホ用）の並び順</h2>
    <p class="modal-hint" style="margin-bottom:6px;">「スマホのリストに表示」がオンの区分だけが並びます。</p>
    <ul class="modal-list" id="field-order-list" style="max-height:220px;overflow-y:auto;"></ul>
  `;

  function renderList() {
    const listEl = panel.querySelector('#categories-list');
    const gridOrderEl = panel.querySelector('#grid-order-list');
    const fieldOrderEl = panel.querySelector('#field-order-list');

    const byGridOrder = [...state.categories].sort((a, b) => a.sort_order - b.sort_order);
    const byFieldOrder = [...state.categories]
      .filter((c) => c.show_in_field)
      .sort((a, b) => (a.field_sort_order ?? a.sort_order) - (b.field_sort_order ?? b.sort_order));

    // ---- 名前・年ごと・スマホ表示・削除（並び順は関係なし） ----
    listEl.innerHTML = byGridOrder.map((c) => `
      <li data-key="${escapeHtml(c.key)}" style="justify-content:space-between;flex-wrap:wrap;">
        <input type="text" class="modal-rename-input category-label-input" data-key="${escapeHtml(c.key)}" value="${escapeHtml(c.label)}" style="flex:1;min-width:220px;" />
        <label style="display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;">
          <input type="checkbox" class="category-grid-checkbox" data-key="${escapeHtml(c.key)}" ${c.show_in_grid ? 'checked' : ''} /> 出欠入力に表示
        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;">
          <input type="checkbox" class="category-field-checkbox" data-key="${escapeHtml(c.key)}" ${c.show_in_field ? 'checked' : ''} /> スマホのリストに表示
        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;">
          <input type="checkbox" class="category-yearly-checkbox" data-key="${escapeHtml(c.key)}" ${c.is_yearly ? 'checked' : ''} /> 年ごと
        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;">
          <input type="checkbox" class="category-special-role-checkbox" data-key="${escapeHtml(c.key)}" ${c.has_special_role ? 'checked' : ''} /> 神・責欄を使う
        </label>
        <button class="icon-btn danger category-delete-btn" data-key="${escapeHtml(c.key)}" title="この区分を削除">×</button>
      </li>`).join('');

    // ---- 出欠入力（デスクトップ）の並び順 ----
    gridOrderEl.innerHTML = byGridOrder.map((c, i) => `
      <li data-key="${escapeHtml(c.key)}" style="justify-content:space-between;">
        <span style="flex:1;min-width:0;">${escapeHtml(c.label)}</span>
        <button class="icon-btn grid-order-up-btn" data-key="${escapeHtml(c.key)}" ${i === 0 ? 'disabled' : ''} title="上へ">↑</button>
        <button class="icon-btn grid-order-down-btn" data-key="${escapeHtml(c.key)}" ${i === byGridOrder.length - 1 ? 'disabled' : ''} title="下へ">↓</button>
      </li>`).join('') || `<li style="color:var(--color-ink-soft);">区分がありません</li>`;

    // ---- 現場入力（スマホ用）の並び順 ----
    fieldOrderEl.innerHTML = byFieldOrder.map((c, i) => `
      <li data-key="${escapeHtml(c.key)}" style="justify-content:space-between;">
        <span style="flex:1;min-width:0;">${escapeHtml(c.label)}</span>
        <button class="icon-btn field-order-up-btn" data-key="${escapeHtml(c.key)}" ${i === 0 ? 'disabled' : ''} title="上へ">↑</button>
        <button class="icon-btn field-order-down-btn" data-key="${escapeHtml(c.key)}" ${i === byFieldOrder.length - 1 ? 'disabled' : ''} title="下へ">↓</button>
      </li>`).join('') || `<li style="color:var(--color-ink-soft);">「スマホのリストに表示」がオンの区分がありません</li>`;

    listEl.querySelectorAll('.category-label-input').forEach((input) => {
      input.addEventListener('blur', async () => {
        const key = input.dataset.key;
        const val = input.value.trim() || key;
        const c = state.categories.find((cc) => cc.key === key);
        if (c) c.label = val;
        await sb.from(T_CATEGORIES).update({ label: val }).eq('key', key);
        applyCategoriesFromState();
        renderView();
      });
    });
    listEl.querySelectorAll('.category-grid-checkbox').forEach((cb) => {
      cb.addEventListener('change', async () => {
        const key = cb.dataset.key;
        const c = state.categories.find((cc) => cc.key === key);
        if (c) c.show_in_grid = cb.checked;
        await sb.from(T_CATEGORIES).update({ show_in_grid: cb.checked }).eq('key', key);
        applyCategoriesFromState();
        renderView();
      });
    });
    listEl.querySelectorAll('.category-field-checkbox').forEach((cb) => {
      cb.addEventListener('change', async () => {
        const key = cb.dataset.key;
        const c = state.categories.find((cc) => cc.key === key);
        if (c) c.show_in_field = cb.checked;
        await sb.from(T_CATEGORIES).update({ show_in_field: cb.checked }).eq('key', key);
        applyCategoriesFromState();
        renderView();
      });
    });
    listEl.querySelectorAll('.category-yearly-checkbox').forEach((cb) => {
      cb.addEventListener('change', async () => {
        const key = cb.dataset.key;
        if (!confirm('「年ごと」の設定を変えると、この区分の出欠の表示・入力の仕組みが変わります。よろしいですか？')) {
          cb.checked = !cb.checked;
          return;
        }
        const c = state.categories.find((cc) => cc.key === key);
        if (c) c.is_yearly = cb.checked;
        await sb.from(T_CATEGORIES).update({ is_yearly: cb.checked }).eq('key', key);
        applyCategoriesFromState();
        renderView();
      });
    });
    listEl.querySelectorAll('.category-special-role-checkbox').forEach((cb) => {
      cb.addEventListener('change', async () => {
        const key = cb.dataset.key;
        const c = state.categories.find((cc) => cc.key === key);
        if (c) c.has_special_role = cb.checked;
        await sb.from(T_CATEGORIES).update({ has_special_role: cb.checked }).eq('key', key);
        applyCategoriesFromState();
        renderView();
      });
    });
    listEl.querySelectorAll('.category-delete-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const key = btn.dataset.key;
        const c = state.categories.find((cc) => cc.key === key);
        if (!confirm(`「${c?.label ?? key}」を削除します。この区分の出欠記録は残りますが、画面には表示されなくなります。よろしいですか？`)) return;
        state.categories = state.categories.filter((cc) => cc.key !== key);
        await sb.from(T_CATEGORIES).delete().eq('key', key);
        applyCategoriesFromState();
        renderView();
      });
    });

    gridOrderEl.querySelectorAll('.grid-order-up-btn, .grid-order-down-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const key = btn.dataset.key;
        const dir = btn.classList.contains('grid-order-up-btn') ? -1 : 1;
        const idx = byGridOrder.findIndex((c) => c.key === key);
        const targetIdx = idx + dir;
        if (targetIdx < 0 || targetIdx >= byGridOrder.length) return;
        const a = byGridOrder[idx], b = byGridOrder[targetIdx];
        const orderA = a.sort_order, orderB = b.sort_order;
        a.sort_order = orderB; b.sort_order = orderA;
        await Promise.all([
          sb.from(T_CATEGORIES).update({ sort_order: orderB }).eq('key', a.key),
          sb.from(T_CATEGORIES).update({ sort_order: orderA }).eq('key', b.key),
        ]);
        applyCategoriesFromState();
        renderView();
      });
    });

    fieldOrderEl.querySelectorAll('.field-order-up-btn, .field-order-down-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const key = btn.dataset.key;
        const dir = btn.classList.contains('field-order-up-btn') ? -1 : 1;
        const idx = byFieldOrder.findIndex((c) => c.key === key);
        const targetIdx = idx + dir;
        if (targetIdx < 0 || targetIdx >= byFieldOrder.length) return;
        const a = byFieldOrder[idx], b = byFieldOrder[targetIdx];
        const orderA = a.field_sort_order ?? a.sort_order, orderB = b.field_sort_order ?? b.sort_order;
        a.field_sort_order = orderB; b.field_sort_order = orderA;
        await Promise.all([
          sb.from(T_CATEGORIES).update({ field_sort_order: orderB }).eq('key', a.key),
          sb.from(T_CATEGORIES).update({ field_sort_order: orderA }).eq('key', b.key),
        ]);
        applyCategoriesFromState();
        renderView();
      });
    });
  }

  panel.querySelector('#new-category-add-btn').addEventListener('click', async () => {
    const input = panel.querySelector('#new-category-input');
    const label = input.value.trim();
    if (!label) return;
    const isYearly = panel.querySelector('#new-category-yearly').checked;
    const key = 'custom_' + Date.now().toString(36);
    const maxOrder = state.categories.length > 0 ? Math.max(...state.categories.map((c) => c.sort_order)) : 0;
    const maxFieldOrder = state.categories.length > 0 ? Math.max(...state.categories.map((c) => c.field_sort_order ?? c.sort_order)) : 0;
    const newCat = { key, label, sort_order: maxOrder + 1, field_sort_order: maxFieldOrder + 1, show_in_field: true, is_yearly: isYearly };
    const { error } = await sb.from(T_CATEGORIES).insert(newCat);
    if (error) { alert('追加に失敗しました: ' + error.message); return; }
    state.categories.push(newCat);
    // 既存の全メンバーを、新しい区分の名簿にも登録する
    const catInserts = state.members.map((m) => ({ member_id: m.id, category: key, sort_order: m.sort_order, is_active: true }));
    if (catInserts.length > 0) await sb.from(T_CATEGORY_MEMBERS).upsert(catInserts, { onConflict: 'member_id,category' });
    for (const ci of catInserts) state.categoryMembers.set(`${key}::${ci.member_id}`, ci);
    applyCategoriesFromState();
    input.value = '';
    renderView();
  });

  renderList();
  return panel;
}

// ==================== 慰労拝受 記録（時間） ====================
const CEREMONY_TIME_FIELDS = [
  { key: 'checkin', label: '出欠確認時間' },
  { key: 'lineup', label: '廊下整列時間' },
  { key: 'end', label: '部終了時間' },
];

async function loadCeremonyTimes() {
  const currentMax = state.fiscalYears.length > 0
    ? Math.max(...state.fiscalYears.map((fy) => fy.start_reiki_year))
    : (new Date().getFullYear() - 1837);
  const years = [0, 1, 2, 3, 4].map((i) => currentMax - i);
  state.ceremonyTimesYears = years;

  // 過去5年より古い記録は自動的に削除する
  await sb.from(T_CEREMONY_TIMES).delete().lt('reiki_year', currentMax - 4);

  const { data } = await sb.from(T_CEREMONY_TIMES).select('*').in('reiki_year', years);
  state.ceremonyTimes = new Map((data ?? []).map((r) => [r.reiki_year, r]));
  state.ceremonyTimesLoaded = true;
}

function buildCeremonyTimesPanel() {
  const panel = document.createElement('div');
  panel.className = 'master-panel';
  panel.style.maxWidth = '1300px';
  panel.innerHTML = `
    <h2>慰労拝受 記録（時間）</h2>
    <p class="modal-hint" style="margin-bottom:10px;">
      慰労拝受(中元・歳暮)の各種時間を年度ごとに記録します。過去5年分だけ保存され、
      新しい年度になると自動的に一番古い年の記録が消え、最新の年が一番上に追加されます。
    </p>
    <div style="overflow-x:auto;">
      <table class="ceremony-table" id="ceremony-times-table"></table>
    </div>
  `;

  function renderTable() {
    const tableEl = panel.querySelector('#ceremony-times-table');
    const fieldHeaders = `<th>日付</th>` + CEREMONY_TIME_FIELDS.map((f) => `<th>${f.label}</th>`).join('');
    const rows = state.ceremonyTimesYears.map((y) => {
      const rec = state.ceremonyTimes.get(y) ?? {};
      const cells = ['chugen', 'seibo'].flatMap((cat) => {
        const dateCol = `${cat}_date`;
        const dateCell = `<td><input type="text" class="ceremony-time-input" data-year="${y}" data-col="${dateCol}" value="${escapeHtml(rec[dateCol] || '')}" placeholder="例: 8/1" style="width:100%;box-sizing:border-box;border:none;text-align:center;" /></td>`;
        const fieldCells = CEREMONY_TIME_FIELDS.map((f) => {
          const col = `${cat}_${f.key}`;
          return `<td><input type="text" class="ceremony-time-input" data-year="${y}" data-col="${col}" value="${escapeHtml(rec[col] || '')}" style="width:100%;box-sizing:border-box;border:none;text-align:center;" /></td>`;
        }).join('');
        const joyuuCol = `${cat}_joyuu`;
        const joyuuCell = `<td><input type="text" class="ceremony-time-input" data-year="${y}" data-col="${joyuuCol}" value="${escapeHtml(rec[joyuuCol] || '')}" style="width:100%;box-sizing:border-box;border:none;text-align:center;" /></td>`;
        const noteCol = `${cat}_note`;
        const noteCell = `<td><input type="text" class="ceremony-time-input" data-year="${y}" data-col="${noteCol}" value="${escapeHtml(rec[noteCol] || '')}" style="width:100%;box-sizing:border-box;border:none;text-align:center;" /></td>`;
        return [dateCell, fieldCells, joyuuCell, noteCell];
      });
      return `<tr><td class="ceremony-year-col" style="font-weight:500;padding:4px 8px;">立教${y}年</td>${cells.join('')}</tr>`;
    }).join('');

    tableEl.innerHTML = `
      <thead>
        <tr>
          <th rowspan="2" class="ceremony-year-col"></th>
          <th colspan="4">勤務者慰労拝受（中元）</th>
          <th rowspan="2">常傭拝受時間</th>
          <th rowspan="2">備考</th>
          <th colspan="4">勤務者慰労拝受（歳暮）</th>
          <th rowspan="2">常傭拝受時間</th>
          <th rowspan="2">備考</th>
        </tr>
        <tr>${fieldHeaders}${fieldHeaders}</tr>
      </thead>
      <tbody>${rows}</tbody>
    `;

    const allTimeInputs = Array.from(tableEl.querySelectorAll('.ceremony-time-input'));
    allTimeInputs.forEach((input, idx) => {
      input.addEventListener('blur', async () => {
        const year = Number(input.dataset.year);
        const col = input.dataset.col;
        const isDateField = col.endsWith('_date') || col.endsWith('_note');
        const value = isDateField ? input.value.trim() : formatTimeInputValue(input.value);
        input.value = value;
        const existing = state.ceremonyTimes.get(year) ?? { reiki_year: year };
        existing[col] = value;
        state.ceremonyTimes.set(year, existing);
        await sb.from(T_CEREMONY_TIMES).upsert({ reiki_year: year, [col]: value }, { onConflict: 'reiki_year' });
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const next = allTimeInputs[idx + 1];
          if (next) next.focus(); else input.blur();
        }
      });
    });
  }

// 「0812」のような3〜4桁の数字を「8:12」の時刻表記に変換する。それ以外はそのまま返す
function formatTimeInputValue(raw) {
  const trimmed = raw.trim();
  if (/^\d{3,4}$/.test(trimmed)) {
    const padded = trimmed.padStart(4, '0');
    const hour = parseInt(padded.slice(0, 2), 10);
    const minute = padded.slice(2, 4);
    return `${hour}:${minute}`;
  }
  return raw;
}

  renderTable();
  return panel;
}

// ==================== 保管記録（閲覧専用） ====================
async function loadArchiveFiscalYears() {
  const { data } = await sb.from(T_FISCAL_YEARS)
    .select('id,label,start_reiki_year')
    .eq('archived', true)
    .order('start_reiki_year', { ascending: false });
  state.archiveFiscalYears = data ?? [];
  if (!state.archiveFiscalYearId || !state.archiveFiscalYears.some(fy => fy.id === state.archiveFiscalYearId)) {
    state.archiveFiscalYearId = state.archiveFiscalYears[0]?.id ?? null;
  }
}

async function loadArchiveRows() {
  if (!state.archiveFiscalYearId) { state.archiveRows = []; return; }
  const { data } = await sb.from(T_ATTENDANCE_ARCHIVE)
    .select('*')
    .eq('fiscal_year_id', state.archiveFiscalYearId)
    .eq('category', state.archiveCategory)
    .order('member_sort_order', { ascending: true, nullsFirst: false })
    .order('member_name', { ascending: true });
  state.archiveRows = data ?? [];
}

function renderArchiveView(container) {
  if (!state._archiveLoaded) {
    container.innerHTML = `<div class="loading">読み込み中…</div>`;
    loadArchiveFiscalYears()
      .then(() => loadArchiveRows())
      .then(() => { state._archiveLoaded = true; renderView(); });
    return;
  }

  if (state.archiveFiscalYears.length === 0) {
    container.innerHTML = `
      <div class="grid-wrap">
        <div class="grid-header">
          <div><p class="eyebrow">出欠管理システム</p><h1 class="font-display">保管記録</h1></div>
        </div>
        <p class="hint-text" style="margin-top:0;">
          まだ保管された年度データはありません。年度が終了すると、自動的にここへ記録が保管されます。
        </p>
      </div>`;
    return;
  }

  const fyOptions = state.archiveFiscalYears.map(fy =>
    `<option value="${fy.id}" ${fy.id === state.archiveFiscalYearId ? 'selected' : ''}>${escapeHtml(fy.label)}</option>`
  ).join('');
  const catTabs = ALL_CATEGORIES.map(c =>
    `<button data-cat="${c}" class="${state.archiveCategory === c ? 'active' : ''}">${CATEGORY_LABEL[c]}</button>`
  ).join('');

  // 部署ごと・メンバーごとにまとめる（登録順=member_sort_orderを維持）
  const groups = [];
  const idxMap = new Map();
  for (const r of state.archiveRows) {
    const key = r.department || '（部署未設定）';
    if (!idxMap.has(key)) { idxMap.set(key, groups.length); groups.push({ dept: key, members: new Map() }); }
    const g = groups[idxMap.get(key)];
    const memberKey = `${r.member_id ?? 'x'}-${r.member_name}`;
    if (!g.members.has(memberKey)) g.members.set(memberKey, { name: r.member_name, months: {} });
    g.members.get(memberKey).months[r.month_seq] = r.status;
  }

  const monthHeaders = MONTH_SEQUENCE.map(m => `<th style="text-align:center;">${m}月</th>`).join('');

  const bodyHtml = groups.map(g => {
    const memberRows = Array.from(g.members.values()).map((m) => {
      let present = 0, absent = 0;
      const cells = MONTH_SEQUENCE.map((seq) => {
        const status = m.months[seq] ?? null;
        if (status === '○') present++;
        if (status === '×') absent++;
        const cls = status === '○' ? 'present' : status === '×' ? 'absent' : '';
        return `<td style="text-align:center;padding:2px;">
          <span class="att-cell-btn ${cls}" style="display:inline-flex;align-items:center;justify-content:center;">${status ?? ''}</span>
        </td>`;
      }).join('');
      const total = present + absent;
      const rate = total > 0 ? Math.round((present / total) * 100) + '%' : '—';
      return `
        <tr>
          <td style="padding:2px 8px;">${escapeHtml(m.name)}</td>
          ${cells}
          <td style="text-align:center;color:var(--color-present);font-weight:500;">${present}</td>
          <td style="text-align:center;color:var(--color-absent);font-weight:500;">${absent}</td>
          <td style="text-align:center;color:var(--color-ink-soft);">${rate}</td>
        </tr>`;
    }).join('');
    return `<tbody>
      <tr><td colspan="${2 + MONTH_SEQUENCE.length + 2}" style="background:#f1efe8;font-weight:500;padding:4px 8px;">${escapeHtml(g.dept)}</td></tr>
      ${memberRows}
    </tbody>`;
  }).join('');

  container.innerHTML = `
    <div class="grid-wrap">
      <div class="grid-header">
        <div>
          <p class="eyebrow">出欠管理システム</p>
          <h1 class="font-display">保管記録</h1>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <select id="archive-fy-select">${fyOptions}</select>
        </div>
      </div>
      <p class="hint-text" style="margin-top:0;margin-bottom:16px;">
        年度が終了すると自動的にここへ記録が保管されます。閲覧専用で、内容の編集はできません。
      </p>
      <div class="category-tabs">${catTabs}</div>
      ${state.archiveRows.length === 0 ? `
        <p class="hint-text">この年度・区分の保管記録はありません。</p>
      ` : `
        <div class="att-table-wrap">
          <table class="att-table">
            <thead>
              <tr>
                <th>氏名</th>
                ${monthHeaders}
                <th style="text-align:center;">出席</th>
                <th style="text-align:center;">欠席</th>
                <th style="text-align:center;">出席率</th>
              </tr>
            </thead>
            ${bodyHtml}
          </table>
        </div>
      `}
    </div>
  `;

  document.getElementById('archive-fy-select').addEventListener('change', async (e) => {
    state.archiveFiscalYearId = Number(e.target.value);
    await loadArchiveRows();
    renderView();
  });
  document.querySelectorAll('.category-tabs button').forEach((btn) => {
    btn.addEventListener('click', async () => {
      state.archiveCategory = btn.dataset.cat;
      await loadArchiveRows();
      renderView();
    });
  });
}
function yearlyAttKey(memberId, category, fiscalYearId, checkpoint) {
  return `${memberId}-${category}-${fiscalYearId}-${checkpoint}`;
}

async function loadYearlyAttendance(category) {
  const { data } = await sb.from(T_ATTENDANCE)
    .select('member_id,fiscal_year_id,month_seq,status')
    .eq('category', category)
    .in('month_seq', YEARLY_CHECKPOINTS.map((cp) => cp.seq));
  state.yearlyAttendance = new Map((data ?? []).map((r) => [yearlyAttKey(r.member_id, category, r.fiscal_year_id, r.month_seq), r.status]));
  state.yearlyAttendanceLoadedCategory = category;
}

function computeYearlySummary(memberId, category) {
  let present = 0, absent = 0;
  for (const fy of state.fiscalYears) {
    for (const cp of YEARLY_CHECKPOINTS) {
      const s = state.yearlyAttendance.get(yearlyAttKey(memberId, category, fy.id, cp.seq));
      if (s === '○') present++;
      if (s === '×') absent++;
    }
  }
  const total = present + absent;
  return { present, absent, rate: total > 0 ? present / total : null };
}

async function toggleYearlyCell(memberId, fiscalYearId, checkpoint, btnEl) {
  const category = state.category;
  const key = yearlyAttKey(memberId, category, fiscalYearId, checkpoint);
  const current = state.yearlyAttendance.get(key) ?? null;
  const next = current === null ? '○' : current === '○' ? '×' : null;

  if (next === null) state.yearlyAttendance.delete(key); else state.yearlyAttendance.set(key, next);
  btnEl.textContent = next ?? '';
  btnEl.classList.remove('present', 'absent');
  if (next === '○') btnEl.classList.add('present');
  if (next === '×') btnEl.classList.add('absent');

  if (next === null) {
    await sb.from(T_ATTENDANCE).delete().match({ member_id: memberId, fiscal_year_id: fiscalYearId, category, month_seq: checkpoint });
  } else {
    await sb.from(T_ATTENDANCE).upsert(
      { member_id: memberId, fiscal_year_id: fiscalYearId, category, month_seq: checkpoint, status: next },
      { onConflict: 'member_id,fiscal_year_id,category,month_seq' }
    );
  }
  renderView();
}

async function saveCheckpointTime(category, fiscalYearId, checkpoint, inputEl) {
  const key = `${category}::${fiscalYearId}::${checkpoint}`;
  const value = formatTimeInputValue(inputEl.value);
  if (document.activeElement !== inputEl) inputEl.value = value; // 入力中はカーソル位置を崩さないよう、離れた後だけ表示を整形
  if (value) state.checkpointTimes.set(key, value); else state.checkpointTimes.delete(key);
  const statusEl = document.getElementById('checkpoint-time-status');
  if (statusEl) statusEl.textContent = '保存中…';
  if (!fiscalYearId) {
    if (statusEl) statusEl.textContent = '⚠ 年度が未選択のため保存できません';
    console.error('checkpoint time save skipped: fiscalYearId is empty', { category, fiscalYearId, checkpoint });
    return;
  }
  try {
    const { error } = await sb.from(T_CHECKPOINT_TIMES).upsert(
      { category, fiscal_year_id: fiscalYearId, checkpoint, time_value: value || null },
      { onConflict: 'category,fiscal_year_id,checkpoint' }
    );
    if (error) {
      console.error('checkpoint time save failed', error);
      if (statusEl) statusEl.textContent = '⚠ 保存に失敗: ' + error.message;
    } else {
      if (statusEl) statusEl.textContent = value ? '✓ 保存しました' : '';
    }
  } catch (e) {
    console.error('checkpoint time save threw', e);
    if (statusEl) statusEl.textContent = '⚠ エラー: ' + e.message;
  }
}

let checkpointTimeSaveTimer = null;
function scheduleCheckpointTimeSave(category, fiscalYearId, checkpoint, inputEl) {
  if (checkpointTimeSaveTimer) clearTimeout(checkpointTimeSaveTimer);
  checkpointTimeSaveTimer = setTimeout(() => {
    saveCheckpointTime(category, fiscalYearId, checkpoint, inputEl);
  }, 600);
}

async function bulkMarkYear(fiscalYearId, checkpoint, mode) {
  const category = state.category;
  const fy = state.fiscalYears.find((f) => f.id === fiscalYearId);
  const cp = YEARLY_CHECKPOINTS.find((c) => c.seq === checkpoint);
  const yearLabel = fy ? `立教${fy.start_reiki_year}年・${cp ? cp.label : ''}` : '';

  if (mode === 'all-present') {
    if (!confirm(`${yearLabel}分を、${CATEGORY_LABEL[category]}について全員○にします。すでに入力されている×も上書きされます。よろしいですか？`)) return;
  } else if (mode === 'clear') {
    if (!confirm(`${yearLabel}分（${CATEGORY_LABEL[category]}）の入力を、全員分まとめて空欄に戻します。よろしいですか？`)) return;
  }

  if (mode === 'clear') {
    for (const m of state.members) state.yearlyAttendance.delete(yearlyAttKey(m.id, category, fiscalYearId, checkpoint));
    await sb.from(T_ATTENDANCE).delete().match({ fiscal_year_id: fiscalYearId, category, month_seq: checkpoint });
    renderView();
    return;
  }

  const updates = [];
  for (const m of state.members) {
    const key = yearlyAttKey(m.id, category, fiscalYearId, checkpoint);
    const current = state.yearlyAttendance.get(key) ?? null;
    if (mode === 'all-present' || (mode === 'fill-blank-present' && current === null)) {
      state.yearlyAttendance.set(key, '○');
      updates.push({ member_id: m.id, fiscal_year_id: fiscalYearId, category, month_seq: checkpoint, status: '○' });
    }
  }
  if (updates.length === 0) { renderView(); return; }
  await sb.from(T_ATTENDANCE).upsert(updates, { onConflict: 'member_id,fiscal_year_id,category,month_seq' });
  renderView();
}

function computeSummary(memberId, category) {
  let present = 0, absent = 0;
  for (let seq = 1; seq <= 12; seq++) {
    const s = state.attendance.get(attKey(memberId, category, seq));
    if (s === '○') present++;
    if (s === '×') absent++;
  }
  const total = present + absent;
  return { present, absent, rate: total > 0 ? present / total : null };
}

function renderMasterSelect(field, memberId, currentValue, masterList, compact) {
  const options = masterList.map(item =>
    `<option value="${escapeHtml(item.name)}" ${item.name === currentValue ? 'selected' : ''}>${escapeHtml(item.name)}</option>`
  ).join('');
  const hasCurrent = masterList.some(item => item.name === currentValue);
  const extra = (!hasCurrent && currentValue) ? `<option value="${escapeHtml(currentValue)}" selected>${escapeHtml(currentValue)}（一覧に無い値）</option>` : '';
  const blank = `<option value="" ${!currentValue ? 'selected' : ''}>（未設定）</option>`;
  const style = compact ? ' style="width:100%;box-sizing:border-box;"' : '';
  return `<select class="att-select" data-field="${field}" data-member="${memberId}"${style}>${blank}${extra}${options}</select>`;
}

const MASTER_CONFIG = {
  department: { table: T_DEPARTMENTS, label: '部署', memberField: 'department' },
  position: { table: T_POSITIONS, label: '立場', memberField: 'position' },
};

function buildMasterPanel(kind) {
  const cfg = MASTER_CONFIG[kind];
  const list = kind === 'department' ? state.departments : state.positions;

  const panel = document.createElement('div');
  panel.className = 'master-panel';
  panel.innerHTML = `
    <h2>${cfg.label}一覧</h2>
    <ul class="modal-list" id="panel-list-${kind}"></ul>
    <div class="modal-add-row">
      <input type="text" id="panel-add-input-${kind}" placeholder="新しい${cfg.label}名" />
      <button class="btn-dark" id="panel-add-btn-${kind}">追加</button>
    </div>
  `;

  function renderList() {
    const listEl = panel.querySelector(`#panel-list-${kind}`);
    listEl.innerHTML = list.map(item => {
      const dayField = kind === 'department' ? `
        <select class="duty-day-select" data-id="${item.id}">
          <option value="" ${!item.duty_day ? 'selected' : ''}>担当日未設定</option>
          <option value="1" ${item.duty_day === 1 ? 'selected' : ''}>${(state.rosterDay1 && state.rosterDay1.trim()) || '1日目'}</option>
          <option value="2" ${item.duty_day === 2 ? 'selected' : ''}>${(state.rosterDay2 && state.rosterDay2.trim()) || '2日目'}</option>
          <option value="3" ${item.duty_day === 3 ? 'selected' : ''}>${(state.rosterDay3 && state.rosterDay3.trim()) || '3日目'}</option>
        </select>` : '';
      return `
      <li data-id="${item.id}">
        <input type="text" class="modal-rename-input" value="${escapeHtml(item.name)}" />
        ${dayField}
        <button class="icon-btn danger modal-delete-btn" title="削除">×</button>
      </li>
    `;
    }).join('');

    listEl.querySelectorAll('.modal-rename-input').forEach((input) => {
      const li = input.closest('li');
      const id = Number(li.dataset.id);
      input.addEventListener('blur', async () => {
        const item = list.find((i) => i.id === id);
        const newName = input.value.trim();
        if (!newName || newName === item.name) { input.value = item.name; return; }
        const oldName = item.name;
        const { error } = await sb.from(cfg.table).update({ name: newName }).eq('id', id);
        if (error) { alert('更新に失敗しました（同じ名前がすでにある可能性があります）。'); input.value = item.name; return; }
        item.name = newName;
        await sb.from(T_MEMBERS).update({ [cfg.memberField]: newName }).eq(cfg.memberField, oldName);
        state.members.forEach((m) => { if (m[cfg.memberField] === oldName) m[cfg.memberField] = newName; });
        renderList();
      });
    });

    if (kind === 'department') {
      listEl.querySelectorAll('.duty-day-select').forEach((sel) => {
        const id = Number(sel.dataset.id);
        sel.addEventListener('change', async () => {
          const item = list.find((i) => i.id === id);
          const val = sel.value ? Number(sel.value) : null;
          await sb.from(cfg.table).update({ duty_day: val }).eq('id', id);
          item.duty_day = val;
        });
      });
    }

    listEl.querySelectorAll('.modal-delete-btn').forEach((btn) => {
      const li = btn.closest('li');
      const id = Number(li.dataset.id);
      btn.addEventListener('click', async () => {
        const item = list.find((i) => i.id === id);
        if (!confirm(`「${item.name}」を一覧から削除します。すでに割り当てられているメンバーの表示はそのまま残ります。よろしいですか？`)) return;
        await sb.from(cfg.table).delete().eq('id', id);
        const idx = list.findIndex((i) => i.id === id);
        if (idx >= 0) list.splice(idx, 1);
        renderList();
      });
    });
  }

  renderList();

  panel.querySelector(`#panel-add-btn-${kind}`).addEventListener('click', async () => {
    const input = panel.querySelector(`#panel-add-input-${kind}`);
    const name = input.value.trim();
    if (!name) return;
    const nextOrder = list.length > 0 ? Math.max(...list.map((i) => i.sort_order)) + 1 : 1;
    const { data, error } = await sb.from(cfg.table).insert({ name, sort_order: nextOrder }).select().single();
    if (error) { alert('追加に失敗しました（同じ名前がすでにある可能性があります）。'); return; }
    list.push(data);
    input.value = '';
    renderList();
  });

  return panel;
}

async function bulkMarkMonth(monthCtx, mode) {
  if (!monthCtx.fiscalYear) {
    alert(`立教${monthCtx.reikiYear}年${monthCtx.calendarMonth}月にあたる年度がまだ登録されていません。先に「＋年度追加」で該当の年度を追加してください。`);
    return;
  }
  if (monthCtx.fiscalYear.id !== state.fiscalYearId) {
    alert(`今表示している年度には、立教${monthCtx.reikiYear}年${monthCtx.calendarMonth}月が含まれていません。上の「年度」のプルダウンで「${monthCtx.fiscalYear.label}」に切り替えてから、もう一度お試しください。`);
    return;
  }

  const monthSeqValue = monthCtx.monthSeq;
  const fiscalYear = monthCtx.fiscalYear;

  if (mode === 'all-present') {
    if (!confirm(`立教${monthCtx.reikiYear}年${monthCtx.calendarMonth}月分を、${CATEGORY_LABEL[state.category]}について全員○にします。すでに入力されている×も上書きされます。よろしいですか？`)) return;
  }
  if (mode === 'clear') {
    if (!confirm(`立教${monthCtx.reikiYear}年${monthCtx.calendarMonth}月分（${CATEGORY_LABEL[state.category]}）の入力を、全員分まとめて空欄に戻します。よろしいですか？`)) return;
    for (const m of state.members) {
      state.attendance.delete(attKey(m.id, state.category, monthSeqValue));
    }
    await sb.from(T_ATTENDANCE).delete().match({ fiscal_year_id: fiscalYear.id, category: state.category, month_seq: monthSeqValue });
    renderView();
    return;
  }

  const updates = [];
  for (const m of state.members) {
    const key = attKey(m.id, state.category, monthSeqValue);
    const current = state.attendance.get(key) ?? null;
    if (mode === 'all-present') {
      state.attendance.set(key, '○');
      updates.push({ member_id: m.id, fiscal_year_id: fiscalYear.id, category: state.category, month_seq: monthSeqValue, status: '○' });
    } else if (mode === 'fill-blank-present' && current === null) {
      state.attendance.set(key, '○');
      updates.push({ member_id: m.id, fiscal_year_id: fiscalYear.id, category: state.category, month_seq: monthSeqValue, status: '○' });
    }
  }

  if (updates.length === 0) { renderView(); return; }

  await sb.from(T_ATTENDANCE).upsert(updates, { onConflict: 'member_id,fiscal_year_id,category,month_seq' });
  renderView();
}
