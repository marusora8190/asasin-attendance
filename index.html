      </li>`;
    }).join('');

    listEl.querySelectorAll('.member-pos-select').forEach((sel) => {
      const id = Number(sel.dataset.id);
      sel.addEventListener('change', async () => {
        const val = sel.value || null;
        const m = state.members.find((mm) => mm.id === id);
        const before = m.position;
        const { error } = await sb.from(T_MEMBERS).update({ position: val }).eq('id', id);
        if (error) {
          console.error(error);
          alert('立場を保存できませんでした。画面を読み込み直して、もう一度操作してください。\n（' + error.message + '）');
          sel.value = before || '';
          return;
        }
        m.position = val;
        renderView();
      });
    });
  }

  renderList();
  return panel;
}

function buildCategoryMembersPanel(options) {
  const opts = options || {};
  const title = opts.title || '区分の名簿を管理';
  const categoriesToShow = opts.categories || ALL_CATEGORIES;
  const sortByCategory = opts.sortByCategory ?? categoriesToShow[0] ?? null;
  const specialCatsInView = categoriesToShow.filter((c) => SPECIAL_ROLE_CATEGORIES.includes(c));
  const normalCatsInView = categoriesToShow.filter((c) => !SPECIAL_ROLE_CATEGORIES.includes(c));

  // どの年度・年の名簿を見るか（立教の年）。年度の一覧にある年と、名簿が保存されている年から選べる
  const yearChoices = [...new Set([...state.fiscalYears.map((fy) => fy.start_reiki_year), ...state.rosterYears])].sort((a, b) => a - b);
  if (state.catMembersYear == null || !yearChoices.includes(state.catMembersYear)) state.catMembersYear = selectedRosterYear();
  if (!yearChoices.includes(state.catMembersYear)) yearChoices.push(state.catMembersYear);
  const year = state.catMembersYear;
  const baseYear = rosterBaseYear(year);

  const panel = document.createElement('div');
  panel.className = 'master-panel';
  panel.style.maxWidth = '1300px';
  panel.innerHTML = `
    <h2>${escapeHtml(title)}</h2>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
      <label style="font-size:13px;color:var(--color-navy);">年度・年
        <select id="category-members-year-select">${yearChoices.map((y) => `<option value="${y}" ${y === year ? 'selected' : ''}>立教${y}年度 ／ 立教${y}年</option>`).join('')}</select>
      </label>
    </div>
    <p class="modal-hint" style="margin-bottom:6px;">
      名簿は年ごとに別々に保存されます。朝の神殿掃除・月例参拝は「立教${year}年度」（4月〜翌年3月）、慰労拝受・にをいがけデーは「立教${year}年」の名簿として使われます。
      ${baseYear != null && baseYear !== year ? `<br><strong>立教${year}年の名簿はまだ作られていないため、立教${baseYear}年の名簿と同じ内容を表示しています。</strong>チェックなどを変えると、立教${year}年の名簿が作られます（立教${baseYear}年の名簿は変わりません）。` : ''}
    </p>
    <p class="modal-hint" style="margin-bottom:10px;">
      チェックを外すと、その人はその区分(出欠入力・報告書・当番表・現場入力など)の名簿から外れます。
      退職にはならず、記録も削除されません。チェックを入れ直せばいつでも名簿に戻せます。<br>
      ${specialCatsInView.length > 0 ? '「にをいがけデー」欄は参加日をプルダウンで選びます。「神」「責」「総」「運」の設定と、今年の日付の入力は「にをいがけデー役割」で行います。' : ''}
    </p>
    <div style="overflow-x:auto;">
      <div id="category-members-header-${sortByCategory}" style="display:flex;justify-content:space-between;font-size:11px;color:var(--color-ink-soft);font-weight:500;padding:4px 8px;border-bottom:1px solid var(--color-line);background:var(--color-panel);position:sticky;top:0;z-index:1;min-width:840px;"></div>
      <ul class="modal-list" id="category-members-list-${sortByCategory}" style="max-height:400px;overflow-y:auto;margin-top:0;min-width:840px;"></ul>
    </div>
  `;

  function findActiveSpecialCat(memberId) {
    return specialCatsInView.find((c) => getRosterEntry(c, memberId, year)?.is_active);
  }

  function buildNioigakeCell(m) {
    const activeCat = findActiveSpecialCat(m.id);
    return `<span style="width:120px;flex-shrink:0;display:flex;align-items:center;justify-content:center;">
      <select class="nioigake-day-select" data-id="${m.id}" style="font-size:11px;max-width:110px;">
        <option value="">－</option>
        ${specialCatsInView.map((c) => {
          const dateText = nioigakeDateText(c, year);
          return `<option value="${c}" ${activeCat === c ? 'selected' : ''}>${escapeHtml(shortenCategoryLabelForDay(CATEGORY_LABEL[c]))}${dateText ? ' ' + dateText : ''}</option>`;
        }).join('')}
      </select>
    </span>`;
  }

  function renderList() {
    const headerEl = panel.querySelector(`#category-members-header-${sortByCategory}`);
    headerEl.innerHTML = `
      <span style="width:90px;min-width:90px;flex-shrink:0;">氏名</span>
      ${normalCatsInView.map((c) => `<span style="min-width:44px;padding:0 4px;text-align:center;flex-shrink:0;white-space:nowrap;font-size:10px;">${escapeHtml(CATEGORY_LABEL[c])}</span>`).join('')}
      ${specialCatsInView.length > 0 ? `<span style="width:120px;text-align:center;flex-shrink:0;">にをいがけデー</span>` : ''}
    `;

    // 表示順は、指定された区分（1つ目）での並び順に合わせる
    const membersInOrder = sortByCategory
      ? getCategoryMemberEntries(sortByCategory, year).concat(
          state.members.filter((m) => !getCategoryMemberEntries(sortByCategory, year).some((mm) => mm.id === m.id))
        )
      : state.members;

    const listEl = panel.querySelector(`#category-members-list-${sortByCategory}`);
    listEl.innerHTML = membersInOrder.map((m) => `
      <li data-id="${m.id}" style="justify-content:space-between;">
        <span style="width:90px;min-width:90px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(m.name)}</span>
        ${normalCatsInView.map((c) => {
          const cm = getRosterEntry(c, m.id, year);
          const isActive = cm ? cm.is_active : true;
          return `<span style="min-width:44px;padding:0 4px;text-align:center;flex-shrink:0;">
            <input type="checkbox" class="category-member-checkbox" data-id="${m.id}" data-category="${c}" ${isActive ? 'checked' : ''} />
          </span>`;
        }).join('')}
        ${specialCatsInView.length > 0 ? buildNioigakeCell(m) : ''}
      </li>`).join('');

    listEl.querySelectorAll('.category-member-checkbox').forEach((cb) => {
      cb.addEventListener('change', async () => {
        const memberId = Number(cb.dataset.id);
        const category = cb.dataset.category;
        const yearWasNew = !state.rosterYears.includes(year);
        if (cb.checked) {
          await addMemberToCategory(memberId, category, year);
          if (yearWasNew) renderView(); else renderList();
        } else {
          const m = state.members.find((mm) => mm.id === memberId);
          const label = m && m.name.trim() ? m.name : 'このメンバー';
          if (!confirm(`${label} を「${CATEGORY_LABEL[category]}」の名簿からだけ外します（退職にはなりません）。よろしいですか？`)) {
            cb.checked = true;
            return;
          }
          const existing = getRosterEntry(category, memberId, year) ?? { member_id: memberId, category, sort_order: (m?.sort_order ?? 9999) };
          const updated = { ...existing, member_id: memberId, category, is_active: false, is_special: false, is_special_leader: false, is_day_leader: false };
          await writeRoster(year, [updated]);
          if (yearWasNew) renderView(); else renderList();
        }
      });
    });

    listEl.querySelectorAll('.nioigake-day-select').forEach((sel) => {
      sel.addEventListener('change', async () => {
        const memberId = Number(sel.dataset.id);
        const newCat = sel.value || null;
        const oldCat = findActiveSpecialCat(memberId);
        if (oldCat === newCat) return;
        const m = state.members.find((mm) => mm.id === memberId);
        const yearWasNew = !state.rosterYears.includes(year);
        const writes = [];

        if (oldCat) {
          const existing = getRosterEntry(oldCat, memberId, year) ?? { member_id: memberId, category: oldCat, sort_order: (m?.sort_order ?? 9999) };
          const cleared = { ...existing, member_id: memberId, category: oldCat, is_active: false, is_special: false, is_special_leader: false, is_day_leader: false };
          writes.push(cleared);
        }
        if (newCat) {
          const list = getCategoryMemberEntries(newCat, year);
          const maxOrder = list.length > 0 ? Math.max(...list.map((mm) => mm._catSortOrder)) : 0;
          const updated = { member_id: memberId, category: newCat, sort_order: maxOrder + 1, is_active: true };
          writes.push(updated);
        }
        if (writes.length > 0) await writeRoster(year, writes);
        if (yearWasNew) renderView(); else renderList();
      });
    });
  }

  panel.querySelector('#category-members-year-select').addEventListener('change', (e) => {
    state.catMembersYear = Number(e.target.value);
    renderView();
  });

  renderList();
  return panel;
}

// ==================== にをいがけデーの役割（年ごと） ====================
const T_NIOIGAKE_ROLES = 'asagami_nioigake_roles';
const T_NIOIGAKE_ROLE_LOCKS = 'asagami_nioigake_role_locks';
const ROLE_FLAGS = ['is_special', 'is_special_leader', 'is_day_leader', 'is_transport'];

// 選べる年：今年・去年・2年前・3年前（立教の年号。年が変わると一番古い年は自動で消える）
function nioigakeRoleYearChoices() {
  const now = currentReikiYear();
  return [
    { year: now, label: `立教${now}年（今年）` },
    { year: now - 1, label: `立教${now - 1}年（去年）` },
    { year: now - 2, label: `立教${now - 2}年（2年前）` },
    { year: now - 3, label: `立教${now - 3}年（3年前）` },
  ];
}

function buildNioigakeRolesPanel() {
  const panel = document.createElement('div');
  panel.className = 'master-panel';
  panel.style.maxWidth = '900px';
  const choices = nioigakeRoleYearChoices();
  if (!choices.some((c) => c.year === state.nioigakeRolesYear)) state.nioigakeRolesYear = choices[0].year;
  panel.innerHTML = `
    <h2>にをいがけデーの役割区分</h2>
    <p class="modal-hint" style="margin-bottom:10px;">
      「区分名簿」で参加日を選んだ人だけがここに表示されます。
      「神」は神名流しなど特別な役割の人、「責」はそのリーダー(神責)、「総」はその日全体の責任者(1人だけ)、「運」はマイクロ運転手を表します。<br>
      各区分の「日付」に、その年の実際の日付を入れると、区分名簿・出欠入力・現場入力に「1日目 9/29」のように表示されます（日付は入力するとすぐ保存されます。「チェック済み」でも変更できます）。
    </p>
    <div class="roles-toolbar">
      <label style="font-size:13px;color:var(--color-navy);">年
        <select id="roles-year-select">${choices.map((c) => `<option value="${c.year}" ${c.year === state.nioigakeRolesYear ? 'selected' : ''}>${c.label}</option>`).join('')}</select>
      </label>
      <button class="btn-dark" id="roles-lock-btn">各役割のチェック済み</button>
      <button class="btn-light" id="roles-unlock-btn">解除</button>
      <span id="roles-status" class="roles-status"></span>
    </div>
    <div id="nioigake-roles-body" style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;"><div class="loading">読み込み中…</div></div>
  `;

  const rs = { year: state.nioigakeRolesYear, draft: new Map(), locked: false, dirty: false, extraCats: [] };
  const draftKey = (category, memberId) => `${category}::${memberId}`;
  const getFlags = (category, memberId) => rs.draft.get(draftKey(category, memberId)) || { is_special: false, is_special_leader: false, is_day_leader: false, is_transport: false };
  const setStatus = (text, color) => {
    const el = panel.querySelector('#roles-status');
    if (el) { el.textContent = text; el.style.color = color || 'var(--color-ink-soft)'; }
  };

  async function loadYear(year) {
    rs.year = year;
    rs.draft = new Map();
    rs.dirty = false;
    panel.querySelector('#nioigake-roles-body').innerHTML = '<div class="loading">読み込み中…</div>';
    const [rolesRes, lockRes] = await Promise.all([
      sb.from(T_NIOIGAKE_ROLES).select('*').eq('reiki_year', year),
      sb.from(T_NIOIGAKE_ROLE_LOCKS).select('*').eq('reiki_year', year).maybeSingle(),
    ]);
    if (rolesRes.error) { setStatus('読み込めませんでした: ' + rolesRes.error.message, 'var(--color-absent)'); return; }
    (rolesRes.data || []).forEach((r) => {
      rs.draft.set(draftKey(r.category, r.member_id), { is_special: !!r.is_special, is_special_leader: !!r.is_special_leader, is_day_leader: !!r.is_day_leader, is_transport: !!r.is_transport });
    });
    rs.locked = !!(lockRes.data && lockRes.data.locked);
    // その年に役割が付いていた区分で、今は「神・責欄を使う」になっていない区分も表示する
    const cats = new Set((rolesRes.data || []).map((r) => r.category));
    rs.extraCats = [...cats].filter((c) => !SPECIAL_ROLE_CATEGORIES.includes(c) && CATEGORY_LABEL[c]);
    renderRoles();
  }

  function categoriesToShow() { return [...SPECIAL_ROLE_CATEGORIES, ...rs.extraCats]; }
  function membersFor(category) {
    const list = [...getOrderedMembersForCategory(category, rs.year)];
    // 今の名簿にはいないが、その年に役割が付いていた人も表示する
    for (const key of rs.draft.keys()) {
      const [cat, idStr] = key.split('::');
      if (cat !== category) continue;
      const id = Number(idStr);
      if (!list.some((m) => m.id === id)) {
        const m = state.members.find((mm) => mm.id === id);
        if (m) list.push(m);
      }
    }
    return list;
  }

  function updateButtons() {
    const lockBtn = panel.querySelector('#roles-lock-btn');
    const unlockBtn = panel.querySelector('#roles-unlock-btn');
    lockBtn.disabled = rs.locked;
    unlockBtn.disabled = !rs.locked;
    if (rs.locked) setStatus('✓ チェック済み（保存されています）。変更するときは「解除」を押してください', 'var(--color-present)');
    else if (rs.dirty) setStatus('未保存の変更があります。終わったら「各役割のチェック済み」を押してください', 'var(--color-absent)');
    else setStatus('入力できます。終わったら「各役割のチェック済み」を押すと保存されます');
  }

  function renderRoles() {
    const locked = rs.locked;
    const bodyEl = panel.querySelector('#nioigake-roles-body');
    const cats = categoriesToShow();
    if (!cats.length) {
      bodyEl.innerHTML = `<p class="hint-text">「表示区分」で「神・責欄を使う」がオンになっている区分がありません。</p>`;
      updateButtons();
      return;
    }
    bodyEl.innerHTML = cats.map((category, index) => {
      const members = membersFor(category);
      const rows = members.map((m) => {
        const f = getFlags(category, m.id);
        const dis = locked ? 'disabled' : '';
        const fade = (checked) => (locked && !checked) ? 'opacity:0.15;' : '';
        return `<li data-id="${m.id}" style="justify-content:space-between;border-bottom:1px solid var(--color-line);padding:6px 0;">
          <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;">${escapeHtml(m.name)}</span>
          <label style="display:flex;align-items:center;gap:2px;font-size:12px;${fade(f.is_special)}">
            <input type="checkbox" class="role-cb" data-flag="is_special" data-id="${m.id}" data-category="${category}" ${f.is_special ? 'checked' : ''} ${dis} />神
          </label>
          <label style="display:flex;align-items:center;gap:2px;font-size:12px;${f.is_special ? fade(f.is_special_leader) : 'opacity:0.3;'}">
            <input type="checkbox" class="role-cb" data-flag="is_special_leader" data-id="${m.id}" data-category="${category}" ${f.is_special_leader ? 'checked' : ''} ${(f.is_special && !locked) ? '' : 'disabled'} />責
          </label>
          <label style="display:flex;align-items:center;gap:2px;font-size:12px;${fade(f.is_day_leader)}">
            <input type="checkbox" class="role-cb" data-flag="is_day_leader" data-id="${m.id}" data-category="${category}" ${f.is_day_leader ? 'checked' : ''} ${dis} />総
          </label>
          <label style="display:flex;align-items:center;gap:2px;font-size:12px;${fade(f.is_transport)}">
            <input type="checkbox" class="role-cb" data-flag="is_transport" data-id="${m.id}" data-category="${category}" ${f.is_transport ? 'checked' : ''} ${dis} />運
          </label>
        </li>`;
      }).join('') || `<li style="color:var(--color-ink-soft);border-bottom:1px solid var(--color-line);padding:6px 0;">まだ誰も参加日が選ばれていません</li>`;
      return `
        <div style="min-width:260px;flex:1;${index > 0 ? 'border-left:1px solid var(--color-line);padding-left:20px;' : ''}">
          <h3 style="margin:0 0 6px;font-size:14px;">${escapeHtml(CATEGORY_LABEL[category] || category)}　　<span style="color:var(--color-ink-soft);font-weight:500;">${members.length}名</span></h3>
          <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-navy);margin:0 0 6px;">日付
            <input type="date" class="nioigake-date-input" data-category="${category}" value="${escapeHtml(state.nioigakeDates.get(`${rs.year}::${category}`) || '')}" min="${rs.year + 1837}-01-01" max="${rs.year + 1837}-12-31" style="font-size:12px;" />
          </label>
          <ul class="modal-list" data-category="${category}">${rows}</ul>
        </div>
      `;
    }).join('');

    bodyEl.querySelectorAll('.nioigake-date-input').forEach((input) => {
      input.addEventListener('change', async () => {
        const category = input.dataset.category;
        const year = rs.year;
        const key = `${year}::${category}`;
        const value = input.value || null;
        const res = value
          ? await sb.from(T_NIOIGAKE_DATES).upsert({ reiki_year: year, category, event_date: value, updated_at: new Date().toISOString() }, { onConflict: 'reiki_year,category' })
          : await sb.from(T_NIOIGAKE_DATES).delete().eq('reiki_year', year).eq('category', category);
        if (res.error) {
          input.value = state.nioigakeDates.get(key) || '';
          alert('日付を保存できませんでした: ' + res.error.message);
          return;
        }
        if (value) state.nioigakeDates.set(key, value);
        else state.nioigakeDates.delete(key);
        alert(value ? `${CATEGORY_LABEL[category] || category} の日付を ${nioigakeDateText(category, year)} にしました。` : `${CATEGORY_LABEL[category] || category} の日付を消しました。`);
      });
    });

    bodyEl.querySelectorAll('.role-cb').forEach((cb) => {
      cb.addEventListener('change', () => {
        const memberId = Number(cb.dataset.id);
        const category = cb.dataset.category;
        const flag = cb.dataset.flag;
        const f = { ...getFlags(category, memberId), [flag]: cb.checked };
        if (flag === 'is_special' && !cb.checked) f.is_special_leader = false;
        if (flag === 'is_day_leader' && cb.checked) {
          // その日全体の責任者は1人だけにする
          for (const [key, other] of rs.draft.entries()) {
            if (key.startsWith(`${category}::`) && key !== draftKey(category, memberId) && other.is_day_leader) rs.draft.set(key, { ...other, is_day_leader: false });
          }
        }
        rs.draft.set(draftKey(category, memberId), f);
        rs.dirty = true;
        renderRoles();
      });
    });
    updateButtons();
  }

  // 「各役割のチェック済み」：その年の役割を保存して、チェック済み（編集できない状態）にする
  panel.querySelector('#roles-lock-btn').addEventListener('click', async () => {
    const btn = panel.querySelector('#roles-lock-btn');
    btn.disabled = true;
    setStatus('保存中…');
    const year = rs.year;
    const cats = categoriesToShow();
    const rows = [];
    for (const [key, f] of rs.draft.entries()) {
      const [category, idStr] = key.split('::');
      if (!cats.includes(category)) continue;
      if (ROLE_FLAGS.some((k) => f[k])) rows.push({ reiki_year: year, category, member_id: Number(idStr), ...f, updated_at: new Date().toISOString() });
    }
    let res = await sb.from(T_NIOIGAKE_ROLES).delete().eq('reiki_year', year).in('category', cats);
    if (!res.error && rows.length) res = await sb.from(T_NIOIGAKE_ROLES).insert(rows);
    if (!res.error) res = await sb.from(T_NIOIGAKE_ROLE_LOCKS).upsert({ reiki_year: year, locked: true, updated_at: new Date().toISOString() }, { onConflict: 'reiki_year' });
    // 今年の分は、出欠入力・現場入力の「役割」表示にも反映する
    if (!res.error && year === currentReikiYear()) {
      const updates = [];
      for (const category of SPECIAL_ROLE_CATEGORIES) {
        for (const m of getOrderedMembersForCategory(category, year)) {
          const existing = getRosterEntry(category, m.id, year);
          if (!existing) continue;
          const f = getFlags(category, m.id);
          const updated = { ...existing, member_id: m.id, category, ...f };
          updates.push(updated);
        }
      }
      if (updates.length) res = await writeRoster(year, updates);
    }
    if (res.error) {
      btn.disabled = false;
      setStatus('保存できませんでした: ' + res.error.message, 'var(--color-absent)');
      return;
    }
    rs.locked = true;
    rs.dirty = false;
    renderRoles();
  });

  // 「解除」：チェック済みを外して、もう一度編集できるようにする
  panel.querySelector('#roles-unlock-btn').addEventListener('click', async () => {
    const res = await sb.from(T_NIOIGAKE_ROLE_LOCKS).upsert({ reiki_year: rs.year, locked: false, updated_at: new Date().toISOString() }, { onConflict: 'reiki_year' });
    if (res.error) { setStatus('解除できませんでした: ' + res.error.message, 'var(--color-absent)'); return; }
    rs.locked = false;
    renderRoles();
  });

  panel.querySelector('#roles-year-select').addEventListener('change', (e) => {
    const next = Number(e.target.value);
    if (rs.dirty && !confirm('保存していない変更があります。年を切り替えると、変更は消えます。よろしいですか？')) {
      e.target.value = String(rs.year);
      return;
    }
    state.nioigakeRolesYear = next;
    loadYear(next);
  });

  loadYear(state.nioigakeRolesYear);
  return panel;
}

function buildCategoriesPanel() {

      .sort((a, b) => (a.field_sort_order ?? a.sort_order) - (b.field_sort_order ?? b.sort_order));

    // ---- 名前・年ごと・スマホ表示・削除（並び順は関係なし） ----

      <li data-key="${escapeHtml(c.key)}" style="justify-content:space-between;flex-wrap:wrap;">
        <input type="text" class="modal-rename-input category-label-input" data-key="${escapeHtml(c.key)}" value="${escapeHtml(c.label)}" style="flex:1;min-width:220px;" />
        <label style="display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;">
          <input type="checkbox" class="category-grid-checkbox" data-key="${escapeHtml(c.key)}" ${c.show_in_grid ? 'checked' : ''} /> 出欠入力に表示

        <label style="display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;">

        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;">
          <input type="checkbox" class="category-yearly-checkbox" data-key="${escapeHtml(c.key)}" ${c.is_yearly ? 'checked' : ''} /> 年ごと
        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;">
          <input type="checkbox" class="category-special-role-checkbox" data-key="${escapeHtml(c.key)}" ${c.has_special_role ? 'checked' : ''} /> 神・責欄を使う
        </label>
        <button class="icon-btn danger category-delete-btn" data-key="${escapeHtml(c.key)}" title="この区分を削除">×</button>

    // ---- 出欠入力（デスクトップ）の並び順 ----
    gridOrderEl.innerHTML = byGridOrder.map((c, i) => `

        <span style="flex:1;min-width:0;">${escapeHtml(c.label)}</span>
        <button class="icon-btn field-order-up-btn" data-key="${escapeHtml(c.key)}" ${i === 0 ? 'disabled' : ''} title="上へ">↑</button>

    listEl.querySelectorAll('.category-grid-checkbox').forEach((cb) => {
      cb.addEventListener('change', async () => {

        const c = state.categories.find((cc) => cc.key === key);
        if (c) c.show_in_grid = cb.checked;

        renderView();
      });

    listEl.querySelectorAll('.category-yearly-checkbox').forEach((cb) => {

        renderView();

    listEl.querySelectorAll('.category-special-role-checkbox').forEach((cb) => {

    listEl.querySelectorAll('.category-delete-btn').forEach((btn) => {

        state.categories = state.categories.filter((cc) => cc.key !== key);

        applyCategoriesFromState();
        renderView();
      });
    });

    gridOrderEl.querySelectorAll('.grid-order-up-btn, .grid-order-down-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const key = btn.dataset.key;
        const dir = btn.classList.contains('grid-order-up-btn') ? -1 : 1;
        const idx = byGridOrder.findIndex((c) => c.key === key);
        const targetIdx = idx + dir;
        if (targetIdx < 0 || targetIdx >= byGridOrder.length) return;
        const a = byGridOrder[idx], b = byGridOrder[targetIdx];
        const orderA = a.sort_order, orderB = b.sort_order;
        a.sort_order = orderB; b.sort_order = orderA;
        await Promise.all([
          sb.from(T_CATEGORIES).update({ sort_order: orderB }).eq('key', a.key),
          sb.from(T_CATEGORIES).update({ sort_order: orderA }).eq('key', b.key),

      });

        if (targetIdx < 0 || targetIdx >= byFieldOrder.length) return;
        const a = byFieldOrder[idx], b = byFieldOrder[targetIdx];
        const orderA = a.field_sort_order ?? a.sort_order, orderB = b.field_sort_order ?? b.sort_order;
        a.field_sort_order = orderB; b.field_sort_order = orderA;
        await Promise.all([
          sb.from(T_CATEGORIES).update({ field_sort_order: orderB }).eq('key', a.key),
          sb.from(T_CATEGORIES).update({ field_sort_order: orderA }).eq('key', b.key),

    const isYearly = panel.querySelector('#new-category-yearly').checked;
    const key = 'custom_' + Date.now().toString(36);
    const maxOrder = state.categories.length > 0 ? Math.max(...state.categories.map((c) => c.sort_order)) : 0;
    const maxFieldOrder = state.categories.length > 0 ? Math.max(...state.categories.map((c) => c.field_sort_order ?? c.sort_order)) : 0;
    const newCat = { key, label, sort_order: maxOrder + 1, field_sort_order: maxFieldOrder + 1, show_in_field: true, is_yearly: isYearly };
    const { error } = await sb.from(T_CATEGORIES).insert(newCat);
    if (error) { alert('追加に失敗しました: ' + error.message); return; }
    state.categories.push(newCat);
    // 既存の全メンバーを、新しい区分の名簿にも登録する
    // （区分名簿は年ごとのため、名簿が保存されているすべての年に登録する）
    const catInserts = state.members.map((m) => ({ member_id: m.id, category: key, sort_order: m.sort_order, is_active: true }));
    const rosterYearsForNew = state.rosterYears.length > 0 ? [...state.rosterYears] : [selectedRosterYear()];
    if (catInserts.length > 0) for (const y of rosterYearsForNew) await writeRoster(y, catInserts);
    applyCategoriesFromState();
    input.value = '';
    renderView();
  });

  renderList();
  return panel;
}

// ==================== 慰労拝受 記録（時間） ====================
const CEREMONY_TIME_FIELDS = [
  { key: 'checkin', label: '出欠確認時間' },
  { key: 'lineup', label: '廊下整列時間' },
  { key: 'end', label: '部終了時間' },
];

async function loadCeremonyTimes() {
  const currentMax = state.fiscalYears.length > 0
    ? Math.max(...state.fiscalYears.map((fy) => fy.start_reiki_year))
    : (new Date().getFullYear() - 1837);
  const years = [0, 1, 2, 3, 4].map((i) => currentMax - i);
  state.ceremonyTimesYears = years;

  // 過去5年より古い記録は自動的に削除する
  await sb.from(T_CEREMONY_TIMES).delete().lt('reiki_year', currentMax - 4);

  const { data } = await sb.from(T_CEREMONY_TIMES).select('*').in('reiki_year', years);
  state.ceremonyTimes = new Map((data ?? []).map((r) => [r.reiki_year, r]));
  state.ceremonyTimesLoaded = true;
}

function buildCeremonyTimesPanel() {

// 「0812」のような3〜4桁の数字を「8:12」の時刻表記に変換する。それ以外はそのまま返す
function formatTimeInputValue(raw) {
  const trimmed = raw.trim();
  if (/^\d{3,4}$/.test(trimmed)) {
    const padded = trimmed.padStart(4, '0');
    const hour = parseInt(padded.slice(0, 2), 10);
    const minute = padded.slice(2, 4);
    return `${hour}:${minute}`;
  }
  return raw;
}

// 出欠の保存に失敗したときに知らせる（黙って失敗しないように）
function alertIfAttendanceError(res) {
  if (res && res.error) {
    console.error(res.error);
    alert('出欠を保存できませんでした。通信状態を確認して、もう一度入力してください。\n（' + res.error.message + '）');
    return true;
  }
  return false;
}

function yearlyAttKey(memberId, category, fiscalYearId, checkpoint) {
  return `${memberId}-${category}-${fiscalYearId}-${checkpoint}`;
}

async function loadYearlyAttendance(category) {
  const { data } = await fetchAllPaged(() => sb.from(T_ATTENDANCE)
    .select('member_id,fiscal_year_id,month_seq,status')
    .eq('category', category)
    .in('month_seq', YEARLY_CHECKPOINTS.map((cp) => cp.seq))
    .order('id'));
  state.yearlyAttendance = new Map((data ?? []).map((r) => [yearlyAttKey(r.member_id, category, r.fiscal_year_id, r.month_seq), r.status]));
  state.yearlyAttendanceLoadedCategory = category;
}

function computeYearlySummary(memberId, category) {
  let present = 0, absent = 0;
  for (const fy of state.fiscalYears) {
    for (const cp of YEARLY_CHECKPOINTS) {
      const s = state.yearlyAttendance.get(yearlyAttKey(memberId, category, fy.id, cp.seq));
      if (s === '○') present++;
      if (s === '×') absent++;
    }
  }
  const total = present + absent;
  return { present, absent, rate: total > 0 ? present / total : null };
}

async function toggleYearlyCell(memberId, fiscalYearId, checkpoint, btnEl) {
  const category = state.category;
  const key = yearlyAttKey(memberId, category, fiscalYearId, checkpoint);
  const current = state.yearlyAttendance.get(key) ?? null;
  const next = current === null ? '○' : current === '○' ? '×' : null;

  if (next === null) state.yearlyAttendance.delete(key); else state.yearlyAttendance.set(key, next);
  btnEl.textContent = next ?? '';
  btnEl.classList.remove('present', 'absent');
  if (next === '○') btnEl.classList.add('present');
  if (next === '×') btnEl.classList.add('absent');

  let res;
  if (next === null) {
    res = await sb.from(T_ATTENDANCE).delete().match({ member_id: memberId, fiscal_year_id: fiscalYearId, category, month_seq: checkpoint });
  } else {
    res = await sb.from(T_ATTENDANCE).upsert(
      { member_id: memberId, fiscal_year_id: fiscalYearId, category, month_seq: checkpoint, status: next },
      { onConflict: 'member_id,fiscal_year_id,category,month_seq' }
    );
  }
  if (alertIfAttendanceError(res)) { state.yearlyAttendanceLoadedCategory = null; }
  renderView();
}

async function saveCheckpointTime(category, fiscalYearId, checkpoint, inputEl) {
  const key = `${category}::${fiscalYearId}::${checkpoint}`;
  const value = formatTimeInputValue(inputEl.value);
  if (document.activeElement !== inputEl) inputEl.value = value; // 入力中はカーソル位置を崩さないよう、離れた後だけ表示を整形
  if (value) state.checkpointTimes.set(key, value); else state.checkpointTimes.delete(key);
  const statusEl = document.getElementById('checkpoint-time-status');
  if (statusEl) statusEl.textContent = '保存中…';
  if (!fiscalYearId) {
    if (statusEl) statusEl.textContent = '⚠ 年度が未選択のため保存できません';
    console.error('checkpoint time save skipped: fiscalYearId is empty', { category, fiscalYearId, checkpoint });
    return;
  }
  try {
    const { error } = await sb.from(T_CHECKPOINT_TIMES).upsert(
      { category, fiscal_year_id: fiscalYearId, checkpoint, time_value: value || null },
      { onConflict: 'category,fiscal_year_id,checkpoint' }
    );
    if (error) {
      console.error('checkpoint time save failed', error);
      if (statusEl) statusEl.textContent = '⚠ 保存に失敗: ' + error.message;
    } else {
      if (statusEl) statusEl.textContent = value ? '✓ 保存しました' : '';
    }
  } catch (e) {
    console.error('checkpoint time save threw', e);
    if (statusEl) statusEl.textContent = '⚠ エラー: ' + e.message;
  }
}

let checkpointTimeSaveTimer = null;
function scheduleCheckpointTimeSave(category, fiscalYearId, checkpoint, inputEl) {
  if (checkpointTimeSaveTimer) clearTimeout(checkpointTimeSaveTimer);
  checkpointTimeSaveTimer = setTimeout(() => {
    saveCheckpointTime(category, fiscalYearId, checkpoint, inputEl);
  }, 600);
}

async function bulkMarkYear(fiscalYearId, checkpoint, mode) {
  const category = state.category;
  const fy = state.fiscalYears.find((f) => f.id === fiscalYearId);
  const cp = YEARLY_CHECKPOINTS.find((c) => c.seq === checkpoint);
  const yearLabel = fy ? `立教${fy.start_reiki_year}年・${cp ? cp.label : ''}` : '';

  if (mode === 'all-present') {
    if (!confirm(`${yearLabel}分を、${CATEGORY_LABEL[category]}について全員○にします。すでに入力されている×も上書きされます。よろしいですか？`)) return;
  } else if (mode === 'clear') {
    if (!confirm(`${yearLabel}分（${CATEGORY_LABEL[category]}）の入力を、全員分まとめて空欄に戻します。よろしいですか？`)) return;
  }

  if (mode === 'clear') {
    for (const m of state.members) state.yearlyAttendance.delete(yearlyAttKey(m.id, category, fiscalYearId, checkpoint));
    const res = await sb.from(T_ATTENDANCE).delete().match({ fiscal_year_id: fiscalYearId, category, month_seq: checkpoint });
    if (alertIfAttendanceError(res)) state.yearlyAttendanceLoadedCategory = null;
    renderView();
    return;
  }

  const updates = [];
  for (const m of state.members) {
    const key = yearlyAttKey(m.id, category, fiscalYearId, checkpoint);
    const current = state.yearlyAttendance.get(key) ?? null;
    if (mode === 'all-present' || (mode === 'fill-blank-present' && current === null)) {
      state.yearlyAttendance.set(key, '○');
      updates.push({ member_id: m.id, fiscal_year_id: fiscalYearId, category, month_seq: checkpoint, status: '○' });
    }
  }
  if (updates.length === 0) { renderView(); return; }
  const res = await sb.from(T_ATTENDANCE).upsert(updates, { onConflict: 'member_id,fiscal_year_id,category,month_seq' });
  if (alertIfAttendanceError(res)) state.yearlyAttendanceLoadedCategory = null;
  renderView();
}

function computeSummary(memberId, category) {
  let present = 0, absent = 0;
  for (let seq = 1; seq <= 12; seq++) {
    const s = state.attendance.get(attKey(memberId, category, seq));
    if (s === '○') present++;
    if (s === '×') absent++;
  }
  const total = present + absent;
  return { present, absent, rate: total > 0 ? present / total : null };
}

function renderMasterSelect(field, memberId, currentValue, masterList, compact) {
  const options = masterList.map(item =>
    `<option value="${escapeHtml(item.name)}" ${item.name === currentValue ? 'selected' : ''}>${escapeHtml(item.name)}</option>`
  ).join('');
  const hasCurrent = masterList.some(item => item.name === currentValue);
  const extra = (!hasCurrent && currentValue) ? `<option value="${escapeHtml(currentValue)}" selected>${escapeHtml(currentValue)}（一覧に無い値）</option>` : '';
  const blank = `<option value="" ${!currentValue ? 'selected' : ''}>（未設定）</option>`;
  const style = compact ? ' style="width:100%;box-sizing:border-box;"' : '';
  return `<select class="att-select" data-field="${field}" data-member="${memberId}"${style}>${blank}${extra}${options}</select>`;
}

const MASTER_CONFIG = {
  department: { table: T_DEPARTMENTS, label: '部署', memberField: 'department' },
  position: { table: T_POSITIONS, label: '立場', memberField: 'position' },
};

function buildMasterPanel(kind) {
  const cfg = MASTER_CONFIG[kind];
  const list = kind === 'department' ? state.departments : state.positions;

  const panel = document.createElement('div');
  panel.className = 'master-panel';
  panel.innerHTML = `
    <h2>${cfg.label}一覧</h2>
    <ul class="modal-list" id="panel-list-${kind}"></ul>
    <div class="modal-add-row">
      <input type="text" id="panel-add-input-${kind}" placeholder="新しい${cfg.label}名" />
      <button class="btn-dark" id="panel-add-btn-${kind}">追加</button>
    </div>
  `;

  function renderList() {
    const listEl = panel.querySelector(`#panel-list-${kind}`);
    listEl.innerHTML = list.map(item => {
      const dayField = kind === 'department' ? `
        <select class="duty-day-select" data-id="${item.id}">
          <option value="" ${!item.duty_day ? 'selected' : ''}>担当日未設定</option>
          <option value="1" ${item.duty_day === 1 ? 'selected' : ''}>${(state.rosterDay1 && state.rosterDay1.trim()) || '1日目'}</option>
          <option value="2" ${item.duty_day === 2 ? 'selected' : ''}>${(state.rosterDay2 && state.rosterDay2.trim()) || '2日目'}</option>
          <option value="3" ${item.duty_day === 3 ? 'selected' : ''}>${(state.rosterDay3 && state.rosterDay3.trim()) || '3日目'}</option>
        </select>` : '';
      return `
      <li data-id="${item.id}">
        <input type="text" class="modal-rename-input" value="${escapeHtml(item.name)}" />
        ${dayField}
        <button class="icon-btn danger modal-delete-btn" title="削除">×</button>
      </li>
    `;
    }).join('');

    listEl.querySelectorAll('.modal-rename-input').forEach((input) => {
      const li = input.closest('li');
      const id = Number(li.dataset.id);
      input.addEventListener('blur', async () => {
        const item = list.find((i) => i.id === id);
        const newName = input.value.trim();
        if (!newName || newName === item.name) { input.value = item.name; return; }
        const oldName = item.name;
        const { error } = await sb.from(cfg.table).update({ name: newName }).eq('id', id);
        if (error) { alert('更新に失敗しました（同じ名前がすでにある可能性があります）。'); input.value = item.name; return; }
        item.name = newName;
        await sb.from(T_MEMBERS).update({ [cfg.memberField]: newName }).eq(cfg.memberField, oldName);
        state.members.forEach((m) => { if (m[cfg.memberField] === oldName) m[cfg.memberField] = newName; });
        renderList();
      });
    });

    if (kind === 'department') {
      listEl.querySelectorAll('.duty-day-select').forEach((sel) => {
        const id = Number(sel.dataset.id);
        sel.addEventListener('change', async () => {
          const item = list.find((i) => i.id === id);
          const val = sel.value ? Number(sel.value) : null;
          await sb.from(cfg.table).update({ duty_day: val }).eq('id', id);
          item.duty_day = val;
        });
      });
    }

    listEl.querySelectorAll('.modal-delete-btn').forEach((btn) => {
      const li = btn.closest('li');
      const id = Number(li.dataset.id);
      btn.addEventListener('click', async () => {
        const item = list.find((i) => i.id === id);
        if (!confirm(`「${item.name}」を一覧から削除します。すでに割り当てられているメンバーの表示はそのまま残ります。よろしいですか？`)) return;
        await sb.from(cfg.table).delete().eq('id', id);
        const idx = list.findIndex((i) => i.id === id);
        if (idx >= 0) list.splice(idx, 1);
        renderList();
      });
    });
  }

  renderList();

  panel.querySelector(`#panel-add-btn-${kind}`).addEventListener('click', async () => {
    const input = panel.querySelector(`#panel-add-input-${kind}`);
    const name = input.value.trim();
    if (!name) return;
    const nextOrder = list.length > 0 ? Math.max(...list.map((i) => i.sort_order)) + 1 : 1;
    const { data, error } = await sb.from(cfg.table).insert({ name, sort_order: nextOrder }).select().single();
    if (error) { alert('追加に失敗しました（同じ名前がすでにある可能性があります）。'); return; }
    list.push(data);
    input.value = '';
    renderList();
  });

  return panel;
}

async function bulkMarkMonth(monthCtx, mode) {
  if (!monthCtx.fiscalYear) {
    alert(`立教${monthCtx.reikiYear}年${monthCtx.calendarMonth}月にあたる年度がまだ登録されていません。先に「＋年度追加」で該当の年度を追加してください。`);
    return;
  }
  if (monthCtx.fiscalYear.id !== state.fiscalYearId) {
    alert(`今表示している年度には、立教${monthCtx.reikiYear}年${monthCtx.calendarMonth}月が含まれていません。上の「年度」のプルダウンで「${monthCtx.fiscalYear.label}」に切り替えてから、もう一度お試しください。`);
    return;
  }

  const monthSeqValue = monthCtx.monthSeq;
  const fiscalYear = monthCtx.fiscalYear;

  if (mode === 'all-present') {
    if (!confirm(`立教${monthCtx.reikiYear}年${monthCtx.calendarMonth}月分を、${CATEGORY_LABEL[state.category]}について全員○にします。すでに入力されている×も上書きされます。よろしいですか？`)) return;
  }
  if (mode === 'clear') {
    if (!confirm(`立教${monthCtx.reikiYear}年${monthCtx.calendarMonth}月分（${CATEGORY_LABEL[state.category]}）の入力を、全員分まとめて空欄に戻します。よろしいですか？`)) return;
    for (const m of state.members) {
      state.attendance.delete(attKey(m.id, state.category, monthSeqValue));
    }
    alertIfAttendanceError(await sb.from(T_ATTENDANCE).delete().match({ fiscal_year_id: fiscalYear.id, category: state.category, month_seq: monthSeqValue }));
    renderView();
    return;
  }

  const updates = [];
  for (const m of state.members) {
    const key = attKey(m.id, state.category, monthSeqValue);
    const current = state.attendance.get(key) ?? null;
    if (mode === 'all-present') {
      state.attendance.set(key, '○');
      updates.push({ member_id: m.id, fiscal_year_id: fiscalYear.id, category: state.category, month_seq: monthSeqValue, status: '○' });
    } else if (mode === 'fill-blank-present' && current === null) {
      state.attendance.set(key, '○');
      updates.push({ member_id: m.id, fiscal_year_id: fiscalYear.id, category: state.category, month_seq: monthSeqValue, status: '○' });
    }
  }

  if (updates.length === 0) { renderView(); return; }

  alertIfAttendanceError(await sb.from(T_ATTENDANCE).upsert(updates, { onConflict: 'member_id,fiscal_year_id,category,month_seq' }));
  renderView();
}

    document.getElementById('clear-month-btn').addEventListener('click', () => bulkMarkYear(state.bulkActionFiscalYearId, state.bulkActionCheckpoint, 'clear'));

      });
    } else {

    const bulkCheckpointTimeInputEl = document.getElementById('bulk-checkpoint-time-input');
    if (bulkCheckpointTimeInputEl) {

        scheduleCheckpointTimeSave(state.category, state.bulkActionFiscalYearId, state.bulkActionCheckpoint, bulkCheckpointTimeInputEl);
      });

      });

  } else {
    document.querySelectorAll('.att-cell-btn').forEach(btn => {
      btn.addEventListener('click', () => toggleCell(Number(btn.dataset.member), Number(btn.dataset.seq), btn));
    });
    document.getElementById('mark-all-present-btn').addEventListener('click', () => bulkMarkMonth(monthCtx, 'all-present'));

    document.getElementById('clear-month-btn').addEventListener('click', () => bulkMarkMonth(monthCtx, 'clear'));

      state.bulkActionMonth = Number(e.target.value);

    });
  }

  document.querySelectorAll('.att-editable').forEach(input => {
    input.addEventListener('blur', () => updateMemberField(Number(input.dataset.member), input.dataset.field, input.value));
  });
  document.querySelectorAll('.att-select').forEach(sel => {
    sel.addEventListener('change', () => updateMemberField(Number(sel.dataset.member), sel.dataset.field, sel.value));
  });

  document.querySelectorAll('[data-action="move-up"]').forEach(btn =>
    btn.addEventListener('click', () => moveMember(Number(btn.dataset.member), -1)));
  document.querySelectorAll('[data-action="move-down"]').forEach(btn =>
    btn.addEventListener('click', () => moveMember(Number(btn.dataset.member), 1)));
  document.querySelectorAll('[data-action="remove"]').forEach(btn =>
    btn.addEventListener('click', () => removeMember(Number(btn.dataset.member))));

  document.getElementById('add-member-btn').addEventListener('click', addMember);
  document.getElementById('export-excel-btn').addEventListener('click', () => exportAllDataToExcel());

  setupRowDragAndDrop();
}

function setupRowDragAndDrop() {
  const tbody = document.getElementById('att-rows-body');
  if (!tbody) return;

  // ハンドルを掴んでいる間だけ、その行を draggable にする
  tbody.querySelectorAll('.drag-handle').forEach((handle) => {
    handle.addEventListener('mousedown', () => {
      const tr = handle.closest('tr[data-row-member]');
      if (tr) tr.draggable = true;
    });
  });
  const resetDraggable = () => {
    tbody.querySelectorAll('tr[data-row-member]').forEach((tr) => { tr.draggable = false; });
  };
  document.addEventListener('mouseup', resetDraggable);

  let draggedId = null;

  tbody.addEventListener('dragstart', (e) => {
    const tr = e.target.closest('tr[data-row-member]');
    if (!tr) return;
    draggedId = Number(tr.dataset.rowMember);
    tr.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });

  tbody.addEventListener('dragover', (e) => {
    const tr = e.target.closest('tr[data-row-member]');
    if (!tr || draggedId === null) return;
    e.preventDefault();
    tbody.querySelectorAll('tr[data-row-member]').forEach((r) => r.classList.remove('drag-over-top', 'drag-over-bottom'));
    const rect = tr.getBoundingClientRect();
    const isAfter = (e.clientY - rect.top) > rect.height / 2;
    tr.classList.add(isAfter ? 'drag-over-bottom' : 'drag-over-top');
  });

  tbody.addEventListener('drop', (e) => {
    const tr = e.target.closest('tr[data-row-member]');
    tbody.querySelectorAll('tr[data-row-member]').forEach((r) => r.classList.remove('drag-over-top', 'drag-over-bottom', 'dragging'));
    if (!tr || draggedId === null) return;
    e.preventDefault();
    const targetId = Number(tr.dataset.rowMember);
    const rect = tr.getBoundingClientRect();
    const isAfter = (e.clientY - rect.top) > rect.height / 2;
    const droppedId = draggedId;
    draggedId = null;
    reorderMember(droppedId, targetId, isAfter);
  });

  tbody.addEventListener('dragend', () => {
    tbody.querySelectorAll('tr[data-row-member]').forEach((r) => r.classList.remove('drag-over-top', 'drag-over-bottom', 'dragging'));
    draggedId = null;
    resetDraggable();
  });
}

async function reorderMember(draggedId, targetId, insertAfter) {
  if (draggedId === targetId) return;
  const category = state.category;
  const year = selectedRosterYear();
  const list = getCategoryMemberEntries(category, year);
  const fromIndex = list.findIndex((m) => m.id === draggedId);
  let toIndex = list.findIndex((m) => m.id === targetId);
  if (fromIndex === -1 || toIndex === -1) return;

  const reordered = [...list];
  const [moved] = reordered.splice(fromIndex, 1);
  toIndex = reordered.findIndex((m) => m.id === targetId);
  reordered.splice(insertAfter ? toIndex + 1 : toIndex, 0, moved);

  const upserts = reordered.map((m, i) => {
    const existing = getRosterEntry(category, m.id, year) ?? { member_id: m.id, category, is_active: true };
    return { ...existing, member_id: m.id, category, sort_order: i + 1 };
  });
  await writeRoster(year, upserts);
  renderView();
}

// 特定の区分の名簿からだけ外す（退職にはしない）
async function removeMemberFromCategory(memberId, category) {
  const m = state.members.find((mm) => mm.id === memberId);
  const label = m && m.name.trim() ? m.name : 'このメンバー';
  if (!confirm(`${label} を「${CATEGORY_LABEL[category]}」の名簿からだけ外します（退職にはなりません）。よろしいですか？`)) return;
  const year = selectedRosterYear();
  const existing = getRosterEntry(category, memberId, year) ?? { member_id: memberId, category, sort_order: (m?.sort_order ?? 9999) };
  const updated = { ...existing, member_id: memberId, category, is_active: false };
  await writeRoster(year, [updated]);
  renderView();
}

// 一度外したメンバーを、特定の区分の名簿に戻す／追加する
async function addMemberToCategory(memberId, category, year = selectedRosterYear()) {
  const list = getCategoryMemberEntries(category, year);
  const maxOrder = list.length > 0 ? Math.max(...list.map((m) => m._catSortOrder)) : 0;
  const existing = getRosterEntry(category, memberId, year) ?? {};
  const updated = { ...existing, member_id: memberId, category, sort_order: maxOrder + 1, is_active: true };
  await writeRoster(year, [updated]);
}

// タップ時は画面上の表示だけを切り替える（保存はしない）
function toggleFieldChipLocal(memberId, seq, chipEl) {
  const category = state.fieldCategory;
  const key = attKey(memberId, category, seq);
  const current = state.attendance.get(key) ?? null;
  const next = current === '○' ? null : '○';

  if (next === null) state.attendance.delete(key); else state.attendance.set(key, next);
  chipEl.classList.toggle('filled', next === '○');

  // 変更したので、この班の「保存済み」表示は解除する
  state.fieldSavedGroups.delete(fieldSavedGroupKey(state.fieldCategory, state.fieldDeptFilter, state.fiscalYearId, seq));
  const deptBtn = document.querySelector(`.field-dept-btn[data-dept-key="${state.fieldDeptFilter}"]`);
  if (deptBtn && deptBtn.classList.contains('saved')) {
    deptBtn.classList.remove('saved');
    deptBtn.textContent = deptBtn.textContent.replace(/^✓\s*/, '');
  }

  const msgEl = document.getElementById('field-save-msg');
  if (msgEl) msgEl.textContent = '';
}

// 「この内容で保存」ボタンが押されたとき、今表示中の班のメンバー分をまとめて保存する
async function saveFieldGroup(members, seq) {
  const category = state.fieldCategory;
  const saveBtn = document.getElementById('field-save-btn');
  const msgEl = document.getElementById('field-save-msg');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '保存中…'; }

  let saveError = null;
  if (!state.fiscalYearId) saveError = { message: '年度が選ばれていません' };
  if (state.fiscalYearId) {
    const upserts = [];
    const deleteIds = [];
    // 「事前調査」だけは、タッチしていない人を欠席(×)として保存する
    // （×の人を「会場外」「会場内」のチェック時に赤く表示するため）。
    const isPreSurvey = YEARLY_CATEGORIES.includes(category)
      && !NO_CHECKPOINT_YEARLY_CATEGORIES.includes(category) && seq === 1;
    // それ以外は、タッチした人＝出席(○)だけを保存し、タッチしていない人は×にしない（空欄のまま）。
    // タッチを取り消した人は、以前に保存した○を取り消す。PCで入力済みの×はそのまま残す。
    for (const m of members) {
      const key = attKey(m.id, category, seq);
      const present = state.attendance.get(key) === '○';
      if (present) {
        upserts.push({ member_id: m.id, fiscal_year_id: state.fiscalYearId, category, month_seq: seq, status: '○' });
      } else if (isPreSurvey) {
        state.attendance.set(key, '×');
        upserts.push({ member_id: m.id, fiscal_year_id: state.fiscalYearId, category, month_seq: seq, status: '×' });
      } else {
        deleteIds.push(m.id);
        if (state.attendance.get(key) !== '×') state.attendance.delete(key);
      }
    }
    if (upserts.length > 0) {
      const res = await sb.from(T_ATTENDANCE).upsert(upserts, { onConflict: 'member_id,fiscal_year_id,category,month_seq' });
      if (res.error) saveError = res.error;
    }
    if (deleteIds.length > 0 && !saveError) {
      // 消すのは○だけ（PCで入力した×は消さない）
      const res = await sb.from(T_ATTENDANCE).delete()
        .match({ fiscal_year_id: state.fiscalYearId, category, month_seq: seq, status: '○' })
        .in('member_id', deleteIds);
      if (res.error) saveError = res.error;
    }
  }

  if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'この内容で保存'; }
  if (saveError) {
    console.error(saveError);
    if (msgEl) { msgEl.textContent = '✕ 保存できませんでした。もう一度「この内容で保存」を押してください（' + saveError.message + '）'; msgEl.style.color = 'var(--color-absent)'; }
    return;
  }
  if (msgEl) { msgEl.textContent = '✓ 保存しました'; msgEl.style.color = ''; }
  // PC側の出欠入力でも最新の内容を読み直すようにする
  state.yearlyAttendanceLoadedCategory = null;

  state.fieldSavedGroups.add(fieldSavedGroupKey(category, state.fieldDeptFilter, state.fiscalYearId, seq));
  const deptBtn = document.querySelector(`.field-dept-btn[data-dept-key="${state.fieldDeptFilter}"]`);
  if (deptBtn && !deptBtn.classList.contains('saved')) {
    deptBtn.classList.add('saved');
    deptBtn.textContent = '✓ ' + deptBtn.textContent;
  }
}

async function toggleCell(memberId, seq, btnEl) {
  const key = attKey(memberId, state.category, seq);
  const current = state.attendance.get(key) ?? null;
  const next = current === null ? '○' : current === '○' ? '×' : null;

  if (next === null) state.attendance.delete(key); else state.attendance.set(key, next);
  btnEl.textContent = next ?? '';
  btnEl.classList.remove('present', 'absent');
  if (next === '○') btnEl.classList.add('present');
  if (next === '×') btnEl.classList.add('absent');

  // 出席/欠席のセルを更新（出席率の欄は2026年10月に廃止。右端は「操作」の欄）
  const row = btnEl.closest('tr');
  const s = computeSummary(memberId, state.category);
  const tds = row.querySelectorAll('td');
  tds[tds.length - 3].textContent = s.present;
  tds[tds.length - 2].textContent = s.absent;

  if (!state.fiscalYearId) return;
  let res;
  if (next === null) {
    res = await sb.from(T_ATTENDANCE).delete().match({ member_id: memberId, fiscal_year_id: state.fiscalYearId, category: state.category, month_seq: seq });
  } else {
    res = await sb.from(T_ATTENDANCE).upsert(
      { member_id: memberId, fiscal_year_id: state.fiscalYearId, category: state.category, month_seq: seq, status: next },
      { onConflict: 'member_id,fiscal_year_id,category,month_seq' }
    );
  }
  alertIfAttendanceError(res);
}

async function updateMemberField(memberId, field, value) {
  const m = state.members.find(m => m.id === memberId);
  if (m) m[field] = value;
  await sb.from(T_MEMBERS).update({ [field]: value }).eq('id', memberId);
}

async function fetchAllRows(table, selectStr) {
  const pageSize = 1000;
  let allRows = [];
  let from = 0;
  while (true) {
    const { data, error } = await sb.from(table).select(selectStr).range(from, from + pageSize - 1);
    if (error) { console.error(error); break; }
    allRows = allRows.concat(data ?? []);
    if (!data || data.length < pageSize) break;
    from += pageSize;
  }
  return allRows;
}

async function exportAllDataToExcel() {
  const btn = document.getElementById('export-excel-btn');
  if (btn) { btn.disabled = true; btn.textContent = '書き出し中…'; }
  try {
    const [allMembers, fyResult, allAttendance] = await Promise.all([
      fetchAllRows(T_MEMBERS, '*'),
      sb.from(T_FISCAL_YEARS).select('*').order('start_reiki_year', { ascending: true }),
      fetchAllRows(T_ATTENDANCE, '*'),
    ]);
    const allFiscalYears = fyResult.data ?? [];

    const memberMap = new Map(allMembers.map((m) => [m.id, m]));
    const fyMap = new Map(allFiscalYears.map((fy) => [fy.id, fy]));

    const buildSheetRows = (category) => {
      const isYearlyCat = YEARLY_CATEGORIES.includes(category);
      const rows = allAttendance
        .filter((a) => a.category === category && a.status)
        .map((a) => {
          const m = memberMap.get(a.member_id);
          const fy = fyMap.get(a.fiscal_year_id);
          const periodLabel = isYearlyCat
            ? (fy ? `立教${fy.start_reiki_year}年` : '')
            : (MONTH_SEQUENCE[a.month_seq - 1] ? `${MONTH_SEQUENCE[a.month_seq - 1]}月` : '');
          const row = {
            '年度': fy ? fy.label : '',
            '部署': m ? (m.department || '') : '（削除済みメンバー）',
            '氏名': m ? m.name : `(member_id:${a.member_id})`,
            '立場': m ? (m.position || '') : '',
            '出欠': a.status,
          };
          if (isYearlyCat) {
            row['対象年'] = periodLabel;
            row['確認回'] = YEARLY_CHECKPOINTS.find((cp) => cp.seq === a.month_seq)?.label ?? '';
          } else {
            row['月'] = periodLabel;
          }
          return row;
        });
      rows.sort((r1, r2) =>
        (r1['年度'] + r1['部署'] + r1['氏名']).localeCompare(
          r2['年度'] + r2['部署'] + r2['氏名'], 'ja'
        )
      );
      return rows;
    };

    const wb = XLSX.utils.book_new();
    for (const category of ALL_CATEGORIES) {
      const rows = buildSheetRows(category);
      // シート名は31文字までなど制約があるため、括弧を取った短い名前にする
      const sheetName = CATEGORY_LABEL[category].replace(/[（）]/g, '').slice(0, 31);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), sheetName);
    }

    const dateStr = jstDateStr(); // 日本時間の今日（以前は0時〜9時に前の日になっていた）
    XLSX.writeFile(wb, `出欠記録_全期間_${dateStr}.xlsx`);
  } catch (err) {
    alert('書き出し中にエラーが発生しました: ' + err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Excelで書き出し'; }
  }
}

async function addMember() {
  const nextOrder = state.members.length > 0 ? Math.max(...state.members.map(m => m.sort_order)) + 1 : 1;
  const { data, error } = await sb.from(T_MEMBERS)
    .insert({ sort_order: nextOrder, department: '', name: '', position: '' })
    .select().single();
  if (!error && data) {
    state.members.push(data);
    // 新しいメンバーは、既定で全区分の名簿に登録する。
    // 区分名簿は年ごとのため、いま選んでいる年度とそれより後の年では名簿に入れ、それより前の年では名簿から外しておく
    const fromYear = selectedRosterYear();
    const years = [...new Set([...state.rosterYears, fromYear])].sort((a, b) => a - b);
    for (const y of years) {
      const catInserts = ALL_CATEGORIES.map((category) => ({ member_id: data.id, category, sort_order: nextOrder, is_active: y >= fromYear }));
      await writeRoster(y, catInserts);
    }
    renderView();
  }
}

async function removeMember(memberId) {
  const m = state.members.find(m => m.id === memberId);
  const label = m && m.name.trim() ? m.name : 'このメンバー';
  if (!confirm(`${label} を一覧から外します（退職扱い）。よろしいですか？\n※これまでの出欠記録・氏名・部署・立場のデータは削除されず、そのまま残ります。`)) return;
  await sb.from(T_MEMBERS).update({ is_active: false }).eq('id', memberId);
  state.members = state.members.filter(m => m.id !== memberId);
  renderView();
}

async function moveMember(memberId, direction) {
  const category = state.category;
  const year = selectedRosterYear();
  const list = getCategoryMemberEntries(category, year);
  const index = list.findIndex((m) => m.id === memberId);
  const target = index + direction;
  if (target < 0 || target >= list.length) return;
  const a = list[index], b = list[target];
  const orderA = a._catSortOrder, orderB = b._catSortOrder;

  const entryA = { ...(getRosterEntry(category, a.id, year) ?? { member_id: a.id, category, is_active: true }), sort_order: orderB };
  const entryB = { ...(getRosterEntry(category, b.id, year) ?? { member_id: b.id, category, is_active: true }), sort_order: orderA };
  await writeRoster(year, [entryA, entryB]);
  renderView();
}

async function addFiscalYear() {
  const label = prompt('新しい年度の表示名を入力してください（例: 立教190年4月〜191年3月）');
  if (!label) return;
  const startYearStr = prompt('立教年度の開始年を数字で入力してください（例: 190）');
  if (!startYearStr || !/^\d+$/.test(startYearStr)) { alert('数字で入力してください。'); return; }
  const { data, error } = await sb.from(T_FISCAL_YEARS)
    .insert({ label, start_reiki_year: Number(startYearStr), is_current: false })
    .select().single();
  if (!error && data) {
    await loadFiscalYearsAndMembers();
    // 読み直すと最初の年度に戻るため、追加した年度を選び直す
    state.fiscalYearId = data.id;
    await loadAttendanceForFiscalYear();
    renderView();
  }
}

function splitIntoTwoColumns(membersWithNo, leftCountOverride) {
  const total = membersWithNo.length;
  let half = Math.ceil(total / 2);
  if (leftCountOverride != null && Number.isFinite(leftCountOverride)) {
    half = Math.min(Math.max(leftCountOverride, 0), total);
  }
  return { left: membersWithNo.slice(0, half), right: membersWithNo.slice(half) };
}

  const posCounts = new Map();

  // 1列あたりの人数が基準（26名）を超えたら、行の高さ（余白・行間）だけを自動で縮めて収まるようにする。

  const BASELINE_ROWS_PER_COLUMN = 26;
  const MIN_ROW_SCALE = 0.62; // これ以上は行が詰まりすぎて読みにくくなるため下限とする

  const summaryHtml = `

  container.innerHTML = `

        <div class="field"><label>対象月</label><select id="${idPrefix}-month">${monthOptions}</select></div>
        <div class="field" style="flex:1;min-width:160px;"><label>部署名（表題）</label><input type="text" id="${idPrefix}-org" value="${escapeHtml(state[orgField])}" style="width:100%;" /></div>
        <div class="field" style="min-width:70px;">
          <label>左：人数</label>
          <input type="number" id="${idPrefix}-left-count" min="0" max="${membersForDisplay.length}" value="${left.length}" style="width:100%;" />
        </div>
        <div class="field" style="min-width:70px;">
          <label>右：人数</label>
          <input type="text" id="${idPrefix}-right-count" value="${right.length}名" readonly style="width:100%;background:#f1efe8;" />
        </div>

function effectiveDutyDay(member) {
  if (member.duty_day_override) return member.duty_day_override;
  const dept = state.departments.find((d) => d.name === member.department);
  return dept?.duty_day ?? null;
}

const SHOMU_ANCHOR_BY_DAY = { 1: null, 2: '木工班', 3: '現場第二班' };

function splitDayGroupsWithShomuLast(deptGroups, dayNum) {
  const shomuIdx = deptGroups.findIndex((g) => g.dept === '庶務係');
  const shomu = shomuIdx >= 0 ? deptGroups[shomuIdx] : null;
  const rest = shomuIdx >= 0 ? deptGroups.filter((_, i) => i !== shomuIdx) : deptGroups;
  const [col1, col2] = splitDeptGroupsIntoTwoColumns(rest);

  if (shomu) {
    const anchor = SHOMU_ANCHOR_BY_DAY[dayNum];
    const anchorPos = anchor ? col2.findIndex((g) => g.dept === anchor) : -1;
    if (anchorPos >= 0) {
      col2.splice(anchorPos + 1, 0, shomu);
    } else {
      col2.push(shomu);
    }
  }
  return [col1, col2];
}

function splitDeptGroupsIntoTwoColumns(deptGroups) {
  return splitDeptGroupsIntoColumns(deptGroups, 2);
}

function splitDeptGroupsIntoColumns(deptGroups, n) {
  const total = deptGroups.reduce((sum, g) => sum + g.members.length, 0);
  const target = Math.ceil(total / n);
  const columns = Array.from({ length: n }, () => []);
  let colIdx = 0;
  let running = 0;
  for (const g of deptGroups) {
    columns[colIdx].push(g);
    running += g.members.length;
    if (colIdx < n - 1 && running >= target) {
      colIdx++;
      running = 0;
    }
  }
  return columns;
}

function renderRosterView(container) {
  setPrintPageSize('size: 250mm 176mm; margin: 5mm;');

  if (!state._dutyPositionsLoaded) {
    container.innerHTML = `<div class="loading">読み込み中…</div>`;
    sb.from(T_DUTY_POSITIONS).select('*').then(({ data }) => {
      state.dutyPositions = new Map((data ?? []).map((r) => [r.item_key, { x: Number(r.x), y: Number(r.y) }]));
      state._dutyPositionsLoaded = true;
      renderView();
    });
    return;
  }

  const fyOptions = state.fiscalYears.map(fy =>
    `<option value="${fy.id}" ${fy.id === state.fiscalYearId ? 'selected' : ''}>${escapeHtml(fy.label)}</option>`
  ).join('');
  const monthOptions = Array.from({length:12}, (_,i)=>i+1).map(m =>
    `<option value="${m}" ${m === state.rosterMonth ? 'selected' : ''}>${m}月</option>`
  ).join('') + `<option value="template" ${state.rosterMonth === 'template' ? 'selected' : ''}>テンプレ</option>`;

  const isTemplate = state.rosterMonth === 'template';
  const monthSeq = isTemplate ? null : calendarMonthToSeq(state.rosterMonth);

  // 担当日（1〜3）ごとにメンバーを振り分け、日ごとに部署でまとめる（登録順を維持）
  const byDay = { 1: [], 2: [], 3: [], none: [] };
  const byDayIndex = { 1: new Map(), 2: new Map(), 3: new Map(), none: new Map() };
  for (const m of state.members) {
    const day = effectiveDutyDay(m);
    const bucket = day ?? 'none';
    const key = m.department || '（部署未設定）';
    const idxMap = byDayIndex[bucket];
    if (!idxMap.has(key)) {
      idxMap.set(key, byDay[bucket].length);
      byDay[bucket].push({ dept: key, members: [] });
    }
    byDay[bucket][idxMap.get(key)].members.push(m);
  }

  // 各部署グループ内で主任を先頭に並べ替え（それ以外は登録順を維持）
  for (const bucket of Object.values(byDay)) {
    for (const g of bucket) {
      g.members.sort((a, b) => (a.is_leader ? 0 : 1) - (b.is_leader ? 0 : 1));
    }
  }

  const renderMemberBox = (group, dayKey) => {
    const rows = group.members.map(m => {
      const status = isTemplate ? null : (state.attendance.get(attKey(m.id, 'asagami', monthSeq)) ?? null);
      const cls = status === '×' ? 'absent' : status === '○' ? 'present' : 'blank';
      const mark = status === '×' ? '×' : status === '○' ? '○' : '';
      return `<li>
        <span class="mark ${cls}">${mark}</span><span class="name">${escapeHtml(m.name)}</span>
      </li>`;
    }).join('');
    const dragKey = `dept-${dayKey}-${group.dept}`;
    const pos = state.dutyPositions.get(dragKey) ?? { x: 0, y: 0 };
    return `
      <div class="duty-dept piece-draggable" data-drag-key="${escapeHtml(dragKey)}" style="transform: translate(${pos.x}mm, ${pos.y}mm);">
        <p class="duty-dept-label">${escapeHtml(group.dept)}</p>
        <ul class="duty-dept-box">${rows}</ul>
      </div>`;
  };

  const renderSubcolumn = (groups, dayKey) => `
    <div class="duty-subcolumn">${groups.map((g) => renderMemberBox(g, dayKey)).join('')}</div>
  `;

function swapGroupsInColumn(col, deptA, deptB) {
  const idxA = col.findIndex((g) => g.dept === deptA);
  const idxB = col.findIndex((g) => g.dept === deptB);
  if (idxA >= 0 && idxB >= 0) {
    [col[idxA], col[idxB]] = [col[idxB], col[idxA]];
  }
}

function moveGroupToColumnFront(cols, deptName, targetIdx) {
  for (let i = 0; i < cols.length; i++) {
    const pos = cols[i].findIndex((g) => g.dept === deptName);
    if (pos >= 0) {
      const [group] = cols[i].splice(pos, 1);
      cols[targetIdx].unshift(group);
      return;
    }
  }
}

function moveGroupToColumnEnd(cols, deptName, targetIdx) {
  for (let i = 0; i < cols.length; i++) {
    const pos = cols[i].findIndex((g) => g.dept === deptName);
    if (pos >= 0) {
      const [group] = cols[i].splice(pos, 1);
      cols[targetIdx].push(group);
      return;
    }
  }
}

function moveGroupBeforeAnchor(cols, deptToMove, anchorDept) {
  let moved = null;
  for (const col of cols) {
    const pos = col.findIndex((g) => g.dept === deptToMove);
    if (pos >= 0) { [moved] = col.splice(pos, 1); break; }
  }
  if (!moved) return;
  for (const col of cols) {
    const anchorPos = col.findIndex((g) => g.dept === anchorDept);
    if (anchorPos >= 0) { col.splice(anchorPos, 0, moved); return; }
  }
}

const dayLabels = [state.rosterDay1, state.rosterDay2, state.rosterDay3];
  const dayBlocksHtml = [1, 2, 3].map((dayNum) => {
    const label = dayLabels[dayNum - 1];
    let [col1, col2] = splitDayGroupsWithShomuLast(byDay[dayNum], dayNum);
    if (dayNum === 2) { [col1, col2] = [col2, col1]; moveGroupToColumnFront([col1, col2], '現場第一班', 0); moveGroupToColumnEnd([col1, col2], '庶務係', 1); }
    if (dayNum === 3) { moveGroupToColumnFront([col1, col2], '現場第二班', 0); moveGroupBeforeAnchor([col1, col2], '大工班', '庶務係'); }
    return `
      <div class="duty-day-block">
        <div class="duty-day-header"><span>${escapeHtml(label || `${dayNum}日目`)}</span></div>
        <div class="duty-day-columns">
          ${renderSubcolumn(col1, dayNum)}
          ${renderSubcolumn(col2, dayNum)}
        </div>
      </div>
    `;
  }).join('');

  const noneColumns = splitDeptGroupsIntoColumns(byDay.none, 3);
  const noneHtml = byDay.none.length > 0 ? `
    <div class="duty-day-block">
      <div class="duty-day-header"><span>担当日未定</span></div>
      <div class="duty-day-columns">
        ${renderSubcolumn(noneColumns[0], 'none')}
        ${renderSubcolumn(noneColumns[1], 'none')}
        ${renderSubcolumn(noneColumns[2], 'none')}
      </div>
    </div>
  ` : '';

  const dateSummary = (state.rosterShowMonth && !isTemplate)
    ? `${state.rosterMonth}月${dayLabels.filter(Boolean).join('・')}`
    : dayLabels.filter(Boolean).join('・');

  container.innerHTML = `
    <div class="roster-wrap">
      <div class="toolbar no-print">
        <div class="field"><label>年度</label><select id="roster-fy">${fyOptions}</select></div>
        <div class="field"><label>対象月</label><select id="roster-month">${monthOptions}</select></div>
        <div class="field" style="min-width:160px;"><label>部署名（表題）</label><input type="text" id="roster-org" value="${escapeHtml(state.rosterOrgName)}" style="width:100%;" /></div>
        <div class="field" style="min-width:90px;"><label>1日目</label><input type="text" id="roster-day1" value="${escapeHtml(state.rosterDay1)}" placeholder="例: 8/21" style="width:100%;" /></div>
        <div class="field" style="min-width:90px;"><label>2日目</label><input type="text" id="roster-day2" value="${escapeHtml(state.rosterDay2)}" placeholder="例: 8/22" style="width:100%;" /></div>
        <div class="field" style="min-width:90px;"><label>3日目</label><input type="text" id="roster-day3" value="${escapeHtml(state.rosterDay3)}" placeholder="例: 8/23" style="width:100%;" /></div>
        <div class="field">
          <label>表題</label>
          <label style="display:flex;align-items:center;gap:6px;height:38px;white-space:nowrap;font-size:14px;">
            <input type="checkbox" id="roster-show-month" ${state.rosterShowMonth ? 'checked' : ''} />
            「○月」を表示する
          </label>
        </div>
        <div class="field"><label>&nbsp;</label><button class="btn-light" id="roster-reset-layout-btn">配置をリセット</button></div>
        <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
          <span class="roster-print-note">用紙はB5横、余白は最小で印刷してください</span>
          <button class="btn-dark" id="roster-print-btn">印刷 / PDFで保存</button>
        </div>
      </div>
      <p class="no-print hint-text" style="margin-top:0;margin-bottom:16px;">
        班の枠をクリックしたまま掴むと、位置をずらして配置できます(自動的に保存されます)。
      </p>
      <div class="roster-doc">
        <h1 id="roster-title-display">${escapeHtml(state.rosterOrgName)}　朝の神殿掃除出欠表　${escapeHtml(dateSummary)}</h1>
        <div class="duty-days-row">${dayBlocksHtml}</div>
        ${noneHtml}
      </div>
    </div>
  `;

  document.getElementById('roster-fy').addEventListener('change', async (e) => {
    state.fiscalYearId = Number(e.target.value);
    await loadAttendanceForFiscalYear();
    renderView();
  });
  document.getElementById('roster-month').addEventListener('change', (e) => {
    state.rosterMonth = e.target.value === 'template' ? 'template' : Number(e.target.value);
    renderView();
  });
  document.getElementById('roster-org').addEventListener('input', (e) => { state.rosterOrgName = e.target.value; });
  document.getElementById('roster-org').addEventListener('blur', () => renderView());
  document.getElementById('roster-day1').addEventListener('input', (e) => { state.rosterDay1 = e.target.value; });
  document.getElementById('roster-day1').addEventListener('blur', () => { saveDutyDayLabels(); renderView(); });
  document.getElementById('roster-day2').addEventListener('input', (e) => { state.rosterDay2 = e.target.value; });
  document.getElementById('roster-day2').addEventListener('blur', () => { saveDutyDayLabels(); renderView(); });
  document.getElementById('roster-day3').addEventListener('input', (e) => { state.rosterDay3 = e.target.value; });
  document.getElementById('roster-day3').addEventListener('blur', () => { saveDutyDayLabels(); renderView(); });
  document.getElementById('roster-show-month').addEventListener('change', (e) => {
    state.rosterShowMonth = e.target.checked;
    renderView();
  });
  document.getElementById('roster-reset-layout-btn').addEventListener('click', async () => {
    if (!confirm('班の位置ずらしをすべて元に戻します。よろしいですか？')) return;
    await sb.from(T_DUTY_POSITIONS).delete().neq('item_key', '__none__');
    state.dutyPositions = new Map();
    renderView();
  });
  document.getElementById('roster-print-btn').addEventListener('click', () => window.print());

  setupPieceDragAndDrop();
}

function setupPieceDragAndDrop() {
  const pieces = document.querySelectorAll('.piece-draggable');
  if (pieces.length === 0) return;
  const refCol = document.querySelector('.duty-subcolumn');
  const GRID_MM = 0.625;

  pieces.forEach((box) => {
    box.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const key = box.dataset.dragKey;
      const refRect = (refCol || box).getBoundingClientRect();
      const mmPerPx = 38 / refRect.width; // .duty-subcolumn の min-width: 38mm を基準に換算

      const startX = e.clientX;
      const startY = e.clientY;
      const currentTransform = box.style.transform || '';
      const match = /translate\(([-\d.]+)mm,\s*([-\d.]+)mm\)/.exec(currentTransform);
      const startDx = match ? parseFloat(match[1]) : 0;
      const startDy = match ? parseFloat(match[2]) : 0;

      box.classList.add('dragging-piece');
      document.body.style.userSelect = 'none';

      function onMove(ev) {
        const dxMm = (ev.clientX - startX) * mmPerPx;
        const dyMm = (ev.clientY - startY) * mmPerPx;
        let newX = Math.round((startDx + dxMm) / GRID_MM) * GRID_MM;
        let newY = Math.round((startDy + dyMm) / GRID_MM) * GRID_MM;
        box.style.transform = `translate(${newX}mm, ${newY}mm)`;
      }

      async function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        box.classList.remove('dragging-piece');
        document.body.style.userSelect = '';
        const m = /translate\(([-\d.]+)mm,\s*([-\d.]+)mm\)/.exec(box.style.transform);
        const finalX = m ? parseFloat(m[1]) : 0;
        const finalY = m ? parseFloat(m[2]) : 0;
        state.dutyPositions.set(key, { x: finalX, y: finalY });
        await sb.from(T_DUTY_POSITIONS).upsert({ item_key: key, x: finalX, y: finalY }, { onConflict: 'item_key' });
      }

      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}


// ==================== 起動 ====================
init();
</script>
