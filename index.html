function renderSheetGrid() {
  const doc = docsState.doc;
  const data = doc.data;
  docsState.values = sheetEvaluateAll(data);
  const host = document.getElementById('sheet-grid-host');
  if (!host) return;
  const cols = [];
  for (let c = 0; c < data.cols; c++) cols.push(`<col style="width:${data.colWidths[c]}px;">`);
  const head = [];
  for (let c = 0; c < data.cols; c++) {
    head.push(`<th class="sheet-col-h" data-c="${c}">${sheetColName(c)}<span class="sheet-col-resizer" data-c="${c}"></span></th>`);
  }
  const body = [];
  const layout = sheetMergeLayout(data);
  for (let r = 0; r < data.rows; r++) {
    const tds = [];
    for (let c = 0; c < data.cols; c++) {
      const key = sheetKey(r, c);
      const lay = layout.get(key);
      if (lay === 'skip') continue;
      const cell = data.cells[key];
      const disp = sheetDisplayText(key);
      const styles = [];
      const align = cell && cell.a ? cell.a : (disp.isNum ? 'right' : (disp.isErr ? 'center' : 'left'));
      styles.push(`text-align:${align}`);
      if (cell && cell.bg) styles.push(`background:${cell.bg}`);
      const bdCss = lay ? sheetMergedBorderStyle(data, lay, '1px solid #bdb6a6', '1px dotted #ece8df') : sheetBorderStyle(cell, '1px solid #bdb6a6', '1px dotted #ece8df');
      if (bdCss) styles.push(bdCss);
      const cls = ['sc'];
      if (lay) cls.push('merged');
      if (cell && cell.sf) cls.push('shrink');
      if (sheetCanSpill(data, layout, r, c, lay, align, disp, data.cols - 1)) cls.push('spill');
      if (cell && cell.fs) styles.push(`font-size:${cell.fs}pt`);
      styles.push(...sheetIndentVaStyles(cell, align, 6));
      if (cell && cell.b) cls.push('bold');
      if (disp.isErr) cls.push('err');
      const span = lay ? ` rowspan="${lay.rs}" colspan="${lay.cs}"` : '';
      tds.push(`<td class="${cls.join(' ')}" data-r="${r}" data-c="${c}"${span} style="${styles.join(';')}">${escapeHtml(disp.text)}</td>`);
    }
    body.push(`<tr style="height:${sheetRowHeight(data, r)}px;"><th class="sheet-row-h" data-r="${r}">${r + 1}<span class="sheet-row-resizer" data-r="${r}"></span></th>${tds.join('')}</tr>`);
  }
  host.innerHTML = `
    <table class="sheet-table" id="sheet-table" style="width:${44 + data.colWidths.slice(0, data.cols).reduce((a, w) => a + w, 0)}px;">
      <colgroup><col style="width:44px;">${cols.join('')}</colgroup>
      <thead><tr><th class="sheet-corner" title="すべて選択"></th>${head.join('')}</tr></thead>
      <tbody>${body.join('')}</tbody>
    </table>`;
  applySheetShrinkToFit();
  updateSheetSelection(false);
  drawSheetPrintOverlay();
}

// 「縮小して全体を表示」のセルは、文字がセルの幅に収まるまで文字を小さくする（元の文字サイズより大きくはしない）
function applySheetShrinkToFit() {
  const table = document.getElementById('sheet-table');
  docsState.shrinkPt = new Map();
  if (!table) return;
  const canvas = applySheetShrinkToFit.canvas || (applySheetShrinkToFit.canvas = document.createElement('canvas'));
  const ctx = canvas.getContext('2d');
  const data = docsState.doc.data;
  table.querySelectorAll('td.sc.shrink').forEach((td) => {
    const r = +td.dataset.r, c = +td.dataset.c;
    const key = sheetKey(r, c);
    const basePt = sheetCellFontPt(data.cells[key]);
    td.style.fontSize = `${basePt}pt`;
    const text = td.textContent;
    if (!text) return;
    const cs = getComputedStyle(td);
    ctx.font = `${cs.fontWeight} ${basePt}pt ${cs.fontFamily}`;
    const w = ctx.measureText(text).width;
    const avail = td.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 2;
    if (w <= avail || w <= 0 || avail <= 0) return;
    const pt = Math.max(4, Math.floor((basePt * avail / w) * 2) / 2);
    td.style.fontSize = `${pt}pt`;
    docsState.shrinkPt.set(key, pt);
  });
}
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => { if (state.view === 'docs' && docsState.doc && document.getElementById('sheet-table')) applySheetShrinkToFit(); });
}

function updateSheetSelection(scroll = true) {
  const table = document.getElementById('sheet-table');
  if (!table) return;
  const s = docsState.sel;
  const data = docsState.doc.data;
  // 選択中のセルが結合セルの中なら、その左上のセルを選択中として扱う
  const am = sheetMergeAt(data, s.ar, s.ac);
  if (am) {
    const single = s.fr === s.ar && s.fc === s.ac;
    s.ar = am.r; s.ac = am.c;
    if (single) { s.fr = s.ar; s.fc = s.ac; }
  }
  const { r1, r2, c1, c2 } = sheetSelRange();
  const single = sheetSelIsSingle();
  table.querySelectorAll('td.sc').forEach((td) => {
    const r = +td.dataset.r, c = +td.dataset.c;
    td.classList.toggle('sel', r >= r1 && r <= r2 && c >= c1 && c <= c2 && !single);
    td.classList.toggle('active', r === s.ar && c === s.ac);
  });
  table.querySelectorAll('th.sheet-col-h').forEach((th) => { const c = +th.dataset.c; th.classList.toggle('hl', c >= c1 && c <= c2); });
  table.querySelectorAll('th.sheet-row-h').forEach((th) => { const r = +th.dataset.r; th.classList.toggle('hl', r >= r1 && r <= r2); });
  const nameBox = document.getElementById('sheet-namebox');
  if (nameBox) nameBox.textContent = single ? sheetA1(s.ar, s.ac) : `${sheetA1(r1, c1)}:${sheetA1(r2, c2)}`;
  const fx = document.getElementById('sheet-formula-input');
  if (fx && document.activeElement !== fx) {
    const cell = docsState.doc.data.cells[sheetKey(s.ar, s.ac)];
    fx.value = cell ? String(cell.v ?? '') : '';
  }
  updateSheetSizeInputs();
  const shrinkBtn = document.querySelector('.sheet-tool[data-tool="shrink"]');
  if (shrinkBtn) { const ac = docsState.doc.data.cells[sheetKey(s.ar, s.ac)]; shrinkBtn.classList.toggle('on', !!(ac && ac.sf)); }
  const bgSel = document.getElementById('sheet-bg-select');
  if (bgSel) {
    const cell = docsState.doc.data.cells[sheetKey(s.ar, s.ac)];
    bgSel.value = (cell && cell.bg) || '';
  }
  if (!docsState.editing) positionCellEditor(true);
  if (scroll) {
    const td = table.querySelector(`td.sc[data-r="${s.fr}"][data-c="${s.fc}"]`);
    if (td) td.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
}

// 選んでいる列の幅・行の高さを数字欄に表示する（範囲内でバラバラなら空欄）
function updateSheetSizeInputs() {
  const data = docsState.doc && docsState.doc.data;
  if (!data) return;
  const { r1, r2, c1, c2 } = sheetSelRange();
  const wIn = document.getElementById('sheet-col-width-input');
  const hIn = document.getElementById('sheet-row-height-input');
  const fIn = document.getElementById('sheet-font-size-input');
  if (fIn && document.activeElement !== fIn) {
    const fsSet = new Set();
    for (let r = r1; r <= r2 && fsSet.size < 2; r++) for (let c = c1; c <= c2 && fsSet.size < 2; c++) fsSet.add(sheetCellFontPt(data.cells[sheetKey(r, c)]));
    fIn.value = fsSet.size === 1 ? [...fsSet][0] : '';
    fIn.placeholder = fsSet.size === 1 ? '' : '混在';
  }
  if (wIn && document.activeElement !== wIn) {
    const ws = new Set(); for (let c = c1; c <= c2; c++) ws.add(data.colWidths[c]);
    wIn.value = ws.size === 1 ? [...ws][0] : '';
    wIn.placeholder = ws.size === 1 ? '' : '混在';
  }
  if (hIn && document.activeElement !== hIn) {
    const hs = new Set(); for (let r = r1; r <= r2; r++) hs.add(sheetRowHeight(data, r));
    hIn.value = hs.size === 1 ? [...hs][0] : '';
    hIn.placeholder = hs.size === 1 ? '' : '混在';
  }
}

function applySheetFontSize(value) {
  const n = Math.round(Number(value));
  if (!Number.isFinite(n) || value === '') { updateSheetSizeInputs(); return; }
  const pt = Math.max(SHEET_FONT_PT_MIN, Math.min(SHEET_FONT_PT_MAX, n));
  applyToSelectionCells((cell) => { if (pt === SHEET_DEFAULT_FONT_PT) delete cell.fs; else cell.fs = pt; });
}

function applySheetColWidth(value) {
  const n = Math.round(Number(value));
  if (!Number.isFinite(n) || value === '') { updateSheetSizeInputs(); return; }
  const w = Math.max(SHEET_COL_WIDTH_MIN, Math.min(SHEET_COL_WIDTH_MAX, n));
  const { c1, c2 } = sheetSelRange();
  const data = docsState.doc.data;
  pushSheetUndo();
  for (let c = c1; c <= c2; c++) data.colWidths[c] = w;
  afterSheetChange();
}
function applySheetRowHeight(value) {
  const n = Math.round(Number(value));
  if (!Number.isFinite(n) || value === '') { updateSheetSizeInputs(); return; }
  const h = Math.max(SHEET_ROW_HEIGHT_MIN, Math.min(SHEET_ROW_HEIGHT_MAX, n));
  const { r1, r2 } = sheetSelRange();
  const data = docsState.doc.data;
  pushSheetUndo();
  for (let r = r1; r <= r2; r++) {
    if (h === SHEET_DEFAULT_ROW_HEIGHT) delete data.rowHeights[r]; else data.rowHeights[r] = h;
  }
  afterSheetChange();
}

// ドラッグ中に、今の幅・高さを数字で表示する小さな札
function showSheetSizeTip(text, x, y) {
  let tip = document.getElementById('sheet-size-tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'sheet-size-tip';
    tip.className = 'sheet-size-tip no-print';
    document.body.appendChild(tip);
  }
  tip.textContent = text;
  tip.style.left = `${x + 14}px`;
  tip.style.top = `${y + 14}px`;
  tip.style.display = 'block';
}
function hideSheetSizeTip() {
  const tip = document.getElementById('sheet-size-tip');
  if (tip) tip.style.display = 'none';
}

// 選択中のセルの上に入力欄を重ねておく（日本語入力もそのまま始められるように）
function positionCellEditor(focus) {
  const editor = document.getElementById('sheet-cell-editor');
  const table = document.getElementById('sheet-table');
  if (!editor || !table) return;
  const s = docsState.sel;
  const td = table.querySelector(`td.sc[data-r="${s.ar}"][data-c="${s.ac}"]`);
  if (!td) return;
  editor.style.top = `${table.offsetTop + td.offsetTop}px`;
  editor.style.left = `${table.offsetLeft + td.offsetLeft}px`;
  editor.style.width = `${Math.max(td.offsetWidth, 60)}px`;
  editor.style.height = `${td.offsetHeight}px`;
  editor.style.fontSize = `${sheetCellFontPt(docsState.doc.data.cells[sheetKey(s.ar, s.ac)])}pt`;
  if (!docsState.editing) {
    editor.classList.remove('editing');
    editor.value = '';
  }
  if (focus) {
    const active = document.activeElement;
    const typingElsewhere = active && active !== editor && (active.id === 'sheet-title-input' || active.id === 'sheet-formula-input');
    if (!typingElsewhere) editor.focus({ preventScroll: true });
  }
}

function startCellEdit(mode, initialText) {
  const editor = document.getElementById('sheet-cell-editor');
  if (!editor) return;
  docsState.editing = true;
  docsState.editMode = mode;
  positionCellEditor(false);
  editor.classList.add('editing');
  if (initialText !== undefined) editor.value = initialText;
  editor.focus({ preventScroll: true });
  const len = editor.value.length;
  try { editor.setSelectionRange(len, len); } catch (e) { /* 無視 */ }
}

function commitCellEdit(moveR, moveC) {
  const editor = document.getElementById('sheet-cell-editor');
  if (!docsState.editing || !editor) return;
  const s = docsState.sel;
  setCellRaw(s.ar, s.ac, editor.value, true);
  docsState.editing = false;
  editor.classList.remove('editing');
  editor.value = '';
  afterSheetChange();
  if (moveR || moveC) moveSheetSelection(moveR, moveC, false);
  else updateSheetSelection();
}
function cancelCellEdit() {
  const editor = document.getElementById('sheet-cell-editor');
  docsState.editing = false;
  if (editor) { editor.classList.remove('editing'); editor.value = ''; }
  updateSheetSelection();
}

function pushSheetUndo() {
  docsState.undo.push(JSON.stringify(docsState.doc.data));
  if (docsState.undo.length > 50) docsState.undo.shift();
}
function sheetUndo() {
  const prev = docsState.undo.pop();
  if (!prev) return;
  docsState.doc.data = normalizeSheetData(JSON.parse(prev));
  const d = docsState.doc.data;
  const clamp = (v, max) => Math.max(0, Math.min(v, max - 1));
  const s = docsState.sel;
  docsState.sel = { ar: clamp(s.ar, d.rows), ac: clamp(s.ac, d.cols), fr: clamp(s.fr, d.rows), fc: clamp(s.fc, d.cols) };
  renderSheetGrid();
  scheduleDocSave();
}

function setCellRaw(r, c, value, withUndo) {
  const data = docsState.doc.data;
  const key = sheetKey(r, c);
  let v = value == null ? '' : String(value);
  if (sheetIsFormula(v)) v = sheetNormalizeFormula(v);
  const cur = data.cells[key];
  if ((cur ? String(cur.v ?? '') : '') === v) return;
  if (withUndo) pushSheetUndo();
  if (r >= data.rows) data.rows = r + 1;
  if (c >= data.cols) { while (data.colWidths.length <= c) data.colWidths.push(SHEET_DEFAULT_COL_WIDTH); data.cols = c + 1; }
  if (v === '') {
    if (cur) {
      delete cur.v;
      if (sheetCellIsEmpty(cur)) delete data.cells[key];
    }
  } else {
    data.cells[key] = { ...(cur || {}), v };
  }
}

function afterSheetChange() {
  renderSheetGrid();
  scheduleDocSave();
}

function moveSheetSelection(dr, dc, extend) {
  const d = docsState.doc.data;
  const s = docsState.sel;
  if (extend) {
    s.fr = Math.max(0, Math.min(d.rows - 1, s.fr + dr));
    s.fc = Math.max(0, Math.min(d.cols - 1, s.fc + dc));
  } else {
    // 結合セルから下・右に動くときは、結合セルの端から数える
    const cm = sheetMergeAt(d, s.ar, s.ac);
    let fromR = s.ar, fromC = s.ac;
    if (cm) { if (dr > 0) fromR = cm.r + cm.rs - 1; if (dc > 0) fromC = cm.c + cm.cs - 1; }
    // 下に移動し続けて表の端に来たら、自動で行を増やす
    if (fromR + dr >= d.rows && dr > 0) { d.rows += 1; renderSheetGrid(); scheduleDocSave(); }
    s.ar = Math.max(0, Math.min(d.rows - 1, fromR + dr));
    s.ac = Math.max(0, Math.min(d.cols - 1, fromC + dc));
    const nm = sheetMergeAt(d, s.ar, s.ac);
    if (nm) { s.ar = nm.r; s.ac = nm.c; }
    s.fr = s.ar; s.fc = s.ac;
  }
  updateSheetSelection();
}

function mergeSheetSelection() {
  const data = docsState.doc.data;
  const { r1, r2, c1, c2 } = sheetSelRange();
  if (r1 === r2 && c1 === c2) { alert('結合するセルを2つ以上、ドラッグで選んでください'); return; }
  const others = [];
  for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) {
    if (r === r1 && c === c1) continue;
    const cell = data.cells[sheetKey(r, c)];
    if (cell && cell.v !== undefined && cell.v !== '') others.push(cell);
  }
  if (others.length && !confirm('結合すると、左上のセル以外の内容は消えます。結合してよろしいですか？')) return;
  pushSheetUndo();
  // 範囲内の既存の結合はいったん外す
  data.merges = (data.merges || []).filter((m) => m.r > r2 || m.r + m.rs - 1 < r1 || m.c > c2 || m.c + m.cs - 1 < c1);
  for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) {
    if (r === r1 && c === c1) continue;
    const key = sheetKey(r, c);
    const cell = data.cells[key];
    if (cell) { delete cell.v; if (sheetCellIsEmpty(cell)) delete data.cells[key]; }
  }
  data.merges.push({ r: r1, c: c1, rs: r2 - r1 + 1, cs: c2 - c1 + 1 });
  // 結合したセルは、最初は中央揃えにする（あとから左・右にも変えられます）
  const key = sheetKey(r1, c1);
  const top = { ...(data.cells[key] || {}) };
  if (!top.a) top.a = 'center';
  data.cells[key] = top;
  Object.assign(docsState.sel, { ar: r1, ac: c1, fr: r1, fc: c1 });
  afterSheetChange();
}
function unmergeSheetSelection() {
  const data = docsState.doc.data;
  const { r1, r2, c1, c2 } = sheetSelRange();
  const before = (data.merges || []).length;
  const kept = (data.merges || []).filter((m) => m.r > r2 || m.r + m.rs - 1 < r1 || m.c > c2 || m.c + m.cs - 1 < c1);
  if (kept.length === before) { alert('選んでいる所に結合したセルはありません'); return; }
  pushSheetUndo();
  data.merges = kept;
  afterSheetChange();
}

// 選んでいる範囲の罫線を変える
function applySheetBorders(mode) {
  const { r1, r2, c1, c2 } = sheetSelRange();
  const data = docsState.doc.data;
  pushSheetUndo();
  for (let r = r1; r <= r2; r++) {
    for (let c = c1; c <= c2; c++) {
      const key = sheetKey(r, c);
      const cell = { ...(data.cells[key] || {}) };
      let bd;
      if (mode === 'all') bd = null;
      else if (mode === 'none') bd = { t: 0, r: 0, b: 0, l: 0 };
      else if (mode === 'outer') bd = { t: r === r1 ? 1 : 0, b: r === r2 ? 1 : 0, l: c === c1 ? 1 : 0, r: c === c2 ? 1 : 0 };
      else if (mode === 'bottom') bd = { t: 0, r: 0, b: r === r2 ? 1 : 0, l: 0 };
      else if (mode === 'top') bd = { t: r === r1 ? 1 : 0, r: 0, b: 0, l: 0 };
      if (bd) cell.bd = bd; else delete cell.bd;
      if (mode === 'none') delete cell.bx; else cell.bx = 1;
      const empty = sheetCellIsEmpty(cell);
      if (empty) delete data.cells[key]; else data.cells[key] = cell;
    }
  }
  // 範囲の外側と接している線：隣のセルの線も消さないと残ってしまうので、合わせて調整する
  if (mode !== 'all') {
    const setSide = (r, c, side, val) => {
      if (r < 0 || c < 0 || r >= data.rows || c >= data.cols) return;
      const key = sheetKey(r, c);
      const cell = { ...(data.cells[key] || {}) };
      const bd = sheetCellBorders(cell);
      bd[side] = val;
      if (bd.t && bd.r && bd.b && bd.l) delete cell.bd; else cell.bd = bd;
      const empty = sheetCellIsEmpty(cell);
      if (empty) delete data.cells[key]; else data.cells[key] = cell;
    };
    const edgeOn = { top: mode === 'outer' || mode === 'top', bottom: mode === 'outer' || mode === 'bottom', left: mode === 'outer', right: mode === 'outer' };
    for (let c = c1; c <= c2; c++) {
      if (!edgeOn.top) setSide(r1 - 1, c, 'b', 0);
      if (!edgeOn.bottom) setSide(r2 + 1, c, 't', 0);
    }
    for (let r = r1; r <= r2; r++) {
      if (!edgeOn.left) setSide(r, c1 - 1, 'r', 0);
      if (!edgeOn.right) setSide(r, c2 + 1, 'l', 0);
    }
  }
  afterSheetChange();
}

function applyToSelectionCells(fn) {
  const { r1, r2, c1, c2 } = sheetSelRange();
  const data = docsState.doc.data;
  pushSheetUndo();
  for (let r = r1; r <= r2; r++) {
    for (let c = c1; c <= c2; c++) {
      const key = sheetKey(r, c);
      const cell = { ...(data.cells[key] || {}) };
      fn(cell);
      const empty = sheetCellIsEmpty(cell);
      if (empty) delete data.cells[key]; else data.cells[key] = cell;
    }
  }
  afterSheetChange();
}

function clearSelectionValues() {
  applyToSelectionCells((cell) => { delete cell.v; });
}

function toggleBoldSelection() {
  const data = docsState.doc.data;
  const s = docsState.sel;
  const cur = data.cells[sheetKey(s.ar, s.ac)];
  const makeBold = !(cur && cur.b);
  applyToSelectionCells((cell) => { if (makeBold) cell.b = true; else delete cell.b; });
}

function sheetShiftStructure(kind, index, count) {
  // kind: 'row-insert' | 'row-delete' | 'col-insert' | 'col-delete'
  const data = docsState.doc.data;
  const isRow = kind.startsWith('row');
  const isInsert = kind.endsWith('insert');
  const end = index + count - 1;
  const mapIndex = (i) => {
    if (isInsert) return i >= index ? i + count : i;
    if (i >= index && i <= end) return null;
    return i > end ? i - count : i;
  };
  const mapRC = (r, c) => {
    if (isRow) { const nr = mapIndex(r); return nr === null ? null : { r: nr, c }; }
    const nc = mapIndex(c); return nc === null ? null : { r, c: nc };
  };
  const newCells = {};
  for (const [key, cell] of Object.entries(data.cells)) {
    const [r, c] = key.split(':').map(Number);
    const rc = mapRC(r, c);
    if (!rc) continue;
    const copy = { ...cell };
    if (sheetIsFormula(String(copy.v ?? ''))) copy.v = sheetShiftFormulaRefs(String(copy.v), (fr, fc) => mapRC(fr, fc));
    newCells[sheetKey(rc.r, rc.c)] = copy;
  }
  data.cells = newCells;
  // 指定した印刷範囲も、行・列の挿入・削除に合わせて直す
  if (data.print && data.print.area) {
    const a = data.print.area;
    const lo = isRow ? Math.min(a.r1, a.r2) : Math.min(a.c1, a.c2);
    const hi = isRow ? Math.max(a.r1, a.r2) : Math.max(a.c1, a.c2);
    let nlo, nhi;
    if (isInsert) {
      nlo = index <= lo ? lo + count : lo;
      nhi = index <= hi ? hi + count : hi;
    } else {
      const kept = [];
      for (let i = lo; i <= hi; i++) { const ni = mapIndex(i); if (ni !== null) kept.push(ni); }
      if (kept.length) { nlo = kept[0]; nhi = kept[kept.length - 1]; }
    }
    if (nlo === undefined) delete data.print.area;
    else if (isRow) { data.print.area = { ...a, r1: nlo, r2: nhi }; }
    else { data.print.area = { ...a, c1: nlo, c2: nhi }; }
  }
  // 結合セルも、行・列の挿入・削除に合わせて位置と大きさを直す
  data.merges = (data.merges || []).map((m) => {
    const start = isRow ? m.r : m.c;
    const len = isRow ? m.rs : m.cs;
    let ns, nl;
    if (isInsert) {
      if (index <= start) { ns = start + count; nl = len; }
      else if (index < start + len) { ns = start; nl = len + count; }
      else { ns = start; nl = len; }
    } else {
      const kept = [];
      for (let i = start; i < start + len; i++) { const ni = mapIndex(i); if (ni !== null) kept.push(ni); }
      if (!kept.length) return null;
      ns = kept[0]; nl = kept.length;
    }
    const nm = isRow ? { r: ns, c: m.c, rs: nl, cs: m.cs } : { r: m.r, c: ns, rs: m.rs, cs: nl };
    return (nm.rs > 1 || nm.cs > 1) ? nm : null;
  }).filter(Boolean);
  if (isRow) {
    const newHeights = {};
    for (const [k, h] of Object.entries(data.rowHeights || {})) {
      const nr = mapIndex(Number(k));
      if (nr !== null) newHeights[nr] = h;
    }
    data.rowHeights = newHeights;
    data.rows = Math.max(1, data.rows + (isInsert ? count : -count));
  } else {
    if (isInsert) data.colWidths.splice(index, 0, ...Array(count).fill(SHEET_DEFAULT_COL_WIDTH));
    else data.colWidths.splice(index, count);
    data.cols = Math.max(1, data.cols + (isInsert ? count : -count));
    while (data.colWidths.length < data.cols) data.colWidths.push(SHEET_DEFAULT_COL_WIDTH);
  }
}

function runSheetTool(tool) {
  const data = docsState.doc.data;
  const { r1, r2, c1, c2 } = sheetSelRange();
  const s = docsState.sel;
  switch (tool) {
    case 'bold': toggleBoldSelection(); break;
    case 'merge': mergeSheetSelection(); break;
    case 'shrink': {
      const cur = data.cells[sheetKey(s.ar, s.ac)];
      const turnOn = !(cur && cur.sf);
      applyToSelectionCells((cell) => { if (turnOn) cell.sf = 1; else delete cell.sf; });
      break;
    }
    case 'indent-up': case 'indent-down': {
      const d = tool === 'indent-up' ? 1 : -1;
      applyToSelectionCells((cell) => {
        const n = Math.max(0, Math.min(SHEET_INDENT_MAX, (Number(cell.ind) || 0) + d));
        if (n) cell.ind = n; else delete cell.ind;
        // インデントは左揃えのときに効くので、中央揃えのセルは左揃えにする
        if (n && cell.a === 'center') cell.a = 'left';
      });
      break;
    }
    case 'valign-top': applyToSelectionCells((cell) => { cell.va = 'top'; }); break;
    case 'valign-middle': applyToSelectionCells((cell) => { delete cell.va; }); break;
    case 'valign-bottom': applyToSelectionCells((cell) => { cell.va = 'bottom'; }); break;
    case 'unmerge': unmergeSheetSelection(); break;
    case 'font-up': case 'font-down': {
      const cur = sheetCellFontPt(data.cells[sheetKey(s.ar, s.ac)]);
      const list = SHEET_FONT_SIZES;
      const next = tool === 'font-up' ? (list.find((n) => n > cur) ?? cur) : ([...list].reverse().find((n) => n < cur) ?? cur);
      applySheetFontSize(next);
      break;
    }
    case 'align-left': applyToSelectionCells((cell) => { cell.a = 'left'; }); break;
    case 'align-center': applyToSelectionCells((cell) => { cell.a = 'center'; }); break;
    case 'align-right': applyToSelectionCells((cell) => { cell.a = 'right'; }); break;
    case 'row-insert':
      pushSheetUndo(); sheetShiftStructure('row-insert', r1, r2 - r1 + 1); afterSheetChange(); break;
    case 'row-delete':
      if (data.rows - (r2 - r1 + 1) < 1) { alert('すべての行は削除できません'); break; }
      pushSheetUndo(); sheetShiftStructure('row-delete', r1, r2 - r1 + 1);
      s.ar = s.fr = Math.min(r1, data.rows - 1); s.fc = s.ac;
      afterSheetChange(); break;
    case 'col-insert':
      pushSheetUndo(); sheetShiftStructure('col-insert', c1, c2 - c1 + 1); afterSheetChange(); break;
    case 'col-delete':
      if (data.cols - (c2 - c1 + 1) < 1) { alert('すべての列は削除できません'); break; }
      pushSheetUndo(); sheetShiftStructure('col-delete', c1, c2 - c1 + 1);
      s.ac = s.fc = Math.min(c1, data.cols - 1); s.fr = s.ar;
      afterSheetChange(); break;
    case 'rows-add':
      pushSheetUndo(); data.rows += 10; afterSheetChange(); break;
    case 'undo': sheetUndo(); break;
    case 'export': exportSheetToXlsx(); break;
    case 'print': printSheet(); break;
  }
  positionCellEditor(true);
}

function sheetSelectionToTsv() {
  const { r1, r2, c1, c2 } = sheetSelRange();
  const lines = [];
  for (let r = r1; r <= r2; r++) {
    const vals = [];
    for (let c = c1; c <= c2; c++) {
      const t = sheetDisplayText(sheetKey(r, c)).text;
      vals.push(/[\t\n"]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t);
    }
    lines.push(vals.join('\t'));
  }
  return lines.join('\n');
}
function sheetParseTsv(text) {
  const rows = [];
  let row = [], field = '', i = 0, inQ = false;
  const t = text.replace(/\r\n?/g, '\n');
  while (i < t.length) {
    const ch = t[i];
    if (inQ) {
      if (ch === '"' && t[i + 1] === '"') { field += '"'; i += 2; continue; }
      if (ch === '"') { inQ = false; i++; continue; }
      field += ch; i++; continue;
    }
    if (ch === '"' && field === '') { inQ = true; i++; continue; }
    if (ch === '\t') { row.push(field); field = ''; i++; continue; }
    if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += ch; i++;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function sheetCopy(cut) {
  const { r1, r2, c1, c2 } = sheetSelRange();
  const data = docsState.doc.data;
  const raws = [];
  for (let r = r1; r <= r2; r++) {
    const line = [];
    for (let c = c1; c <= c2; c++) { const cell = data.cells[sheetKey(r, c)]; line.push(cell ? { ...cell } : null); }
    raws.push(line);
  }
  const text = sheetSelectionToTsv();
  docsState.clip = { text, raws, r1, c1 };
  if (cut) clearSelectionValues();
  return text;
}

function sheetPaste(text) {
  const data = docsState.doc.data;
  const s = docsState.sel;
  const { r1, r2, c1, c2 } = sheetSelRange();
  const internal = docsState.clip && docsState.clip.text.replace(/\r/g, '') === text.replace(/\r/g, '').replace(/\n$/, '');
  pushSheetUndo();
  if (internal) {
    const clip = docsState.clip;
    const h = clip.raws.length, w = clip.raws[0].length;
    // 1つのセルをコピーして範囲を選んでいる場合は、範囲全体に貼り付ける
    const fillR = (h === 1 && w === 1) ? r2 - r1 + 1 : h;
    const fillC = (h === 1 && w === 1) ? c2 - c1 + 1 : w;
    for (let i = 0; i < fillR; i++) {
      for (let j = 0; j < fillC; j++) {
        const src = clip.raws[i % h][j % w];
        const tr = r1 + i, tc = c1 + j;
        const dr = tr - (clip.r1 + (i % h)), dc = tc - (clip.c1 + (j % w));
        if (tr >= data.rows) data.rows = tr + 1;
        if (tc >= data.cols) { data.cols = tc + 1; while (data.colWidths.length < data.cols) data.colWidths.push(SHEET_DEFAULT_COL_WIDTH); }
        const key = sheetKey(tr, tc);
        if (!src) { delete data.cells[key]; continue; }
        const copy = { ...src };
        if (sheetIsFormula(String(copy.v ?? ''))) {
          copy.v = sheetShiftFormulaRefs(String(copy.v), (r, c, absR, absC) => ({ r: absR ? r : r + dr, c: absC ? c : c + dc }));
        }
        data.cells[key] = copy;
      }
    }
    s.fr = r1 + fillR - 1; s.fc = c1 + fillC - 1; s.ar = r1; s.ac = c1;
  } else {
    const rows = sheetParseTsv(text);
    if (!rows.length) { docsState.undo.pop(); return; }
    if (rows.length === 1 && rows[0].length === 1) {
      for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) setCellRaw(r, c, rows[0][0], false);
    } else {
      rows.forEach((line, i) => line.forEach((val, j) => setCellRaw(r1 + i, c1 + j, val, false)));
      s.ar = r1; s.ac = c1; s.fr = r1 + rows.length - 1; s.fc = c1 + Math.max(...rows.map((l) => l.length)) - 1;
    }
  }
  afterSheetChange();
}

// 印刷用に、入力がある範囲だけの表（行番号・列記号なし）を作る
// ---- 印刷の設定（用紙・向き・幅合わせ）と印刷範囲 ----
const SHEET_PAPERS = { A4: [210, 297], B5: [182, 257], A3: [297, 420] };
const SHEET_PRINT_MARGIN_MM = 10;
const SHEET_PX_PER_MM = 96 / 25.4;
function sheetPrintSettings(data) {
  const p = data.print || {};
  return { paper: SHEET_PAPERS[p.paper] ? p.paper : 'A4', orient: p.orient === 'landscape' ? 'landscape' : 'portrait', fit: !!p.fit };
}
// 用紙の中で、実際に印刷できる幅・高さ（ピクセル）
function sheetPageContentPx(data) {
  const ps = sheetPrintSettings(data);
  let [w, h] = SHEET_PAPERS[ps.paper];
  if (ps.orient === 'landscape') [w, h] = [h, w];
  return { w: (w - SHEET_PRINT_MARGIN_MM * 2) * SHEET_PX_PER_MM, h: (h - SHEET_PRINT_MARGIN_MM * 2) * SHEET_PX_PER_MM, mmW: w, mmH: h };
}
// 印刷範囲を自分で指定しているとき（data.print.area = { r1, c1, r2, c2 }）
function sheetManualPrintArea(data) {
  const a = data.print && data.print.area;
  if (!a || ![a.r1, a.c1, a.r2, a.c2].every(Number.isFinite)) return null;
  const clampR = (v) => Math.max(0, Math.min(data.rows - 1, v));
  const clampC = (v) => Math.max(0, Math.min(data.cols - 1, v));
  const rg = { r1: clampR(Math.min(a.r1, a.r2)), r2: clampR(Math.max(a.r1, a.r2)), c1: clampC(Math.min(a.c1, a.c2)), c2: clampC(Math.max(a.c1, a.c2)) };
  return sheetExpandRangeForMerges(data, rg);
}
// 「A1:F40」のような文字を範囲に変換する（全角やスペース、「〜」区切りでもOK）
function sheetParseRangeText(text) {
  const t = String(text || '').normalize('NFKC').toUpperCase().replace(/\s/g, '').replace(/[〜~\-－ー]/g, ':');
  const m = /^\$?([A-Z]+)\$?(\d+):\$?([A-Z]+)\$?(\d+)$/.exec(t);
  if (!m) return null;
  return { r1: Number(m[2]) - 1, c1: sheetColIndex(m[1]), r2: Number(m[4]) - 1, c2: sheetColIndex(m[3]) };
}

// 印刷される範囲。指定がなければ、A1から入力のある一番右下のセルまで（自動）
function sheetPrintRange(data) {
  const manual = sheetManualPrintArea(data);
  if (manual) return { minR: manual.r1, minC: manual.c1, maxR: manual.r2, maxC: manual.c2, manual: true };
  let maxR = -1, maxC = -1;
  for (const [key, cell] of Object.entries(data.cells)) {
    const [r, c] = key.split(':').map(Number);
    if (r >= data.rows || c >= data.cols) continue;
    // 空のセルでも、自分で罫線を引いた所（bx）は印刷範囲に含める
    if ((cell.v !== undefined && cell.v !== '') || cell.bg || cell.bx) { maxR = Math.max(maxR, r); maxC = Math.max(maxC, c); }
  }
  if (maxR < 0) return null;
  for (const m of data.merges || []) {
    if (m.r <= maxR && m.c <= maxC) { maxR = Math.max(maxR, m.r + m.rs - 1); maxC = Math.max(maxC, m.c + m.cs - 1); }
  }
  return { minR: 0, minC: 0, maxR: Math.min(maxR, data.rows - 1), maxC: Math.min(maxC, data.cols - 1), manual: false };
}
function sheetPrintZoom(data, range) {
  if (!range || !sheetPrintSettings(data).fit) return 1;
  const totalW = data.colWidths.slice(range.minC, range.maxC + 1).reduce((a, w) => a + w, 0);
  const pageW = sheetPageContentPx(data).w;
  return totalW > pageW ? pageW / totalW : 1;
}

// 画面上に、印刷範囲の枠と、ページの区切り線を表示する
function drawSheetPrintOverlay() {
  const wrap = document.getElementById('sheet-wrap');
  const table = document.getElementById('sheet-table');
  const info = document.getElementById('sheet-print-info');
  if (!wrap || !table) return;
  wrap.querySelectorAll('.sheet-print-overlay').forEach((el) => el.remove());
  const data = docsState.doc.data;
  // 印刷範囲の欄の表示も最新にする（行・列の挿入・削除や、元に戻すで範囲が動いたとき用）
  const areaInput = document.getElementById('sheet-area-input');
  if (areaInput && document.activeElement !== areaInput) {
    const a = sheetManualPrintArea(data);
    areaInput.value = a ? `${sheetA1(a.r1, a.c1)}:${sheetA1(a.r2, a.c2)}` : '';
    const clr = document.getElementById('sheet-area-clear');
    if (clr) clr.disabled = !a;
  }
  const range = sheetPrintRange(data);
  if (!range) { if (info) info.textContent = '印刷範囲：なし（まだ何も入力されていません）'; return; }
  const colTh = (c) => table.querySelector(`th.sheet-col-h[data-c="${c}"]`);
  const rowTh = (r) => table.querySelector(`th.sheet-row-h[data-r="${r}"]`);
  const baseX = table.offsetLeft, baseY = table.offsetTop;
  const left = baseX + colTh(range.minC).offsetLeft;
  const right = baseX + colTh(range.maxC).offsetLeft + colTh(range.maxC).offsetWidth;
  const top = baseY + rowTh(range.minR).offsetTop;
  const bottom = baseY + rowTh(range.maxR).offsetTop + rowTh(range.maxR).offsetHeight;
  const zoom = sheetPrintZoom(data, range);
  const page = sheetPageContentPx(data);
  const add = (cls, css, text) => {
    const el = document.createElement('div');
    el.className = `sheet-print-overlay ${cls}`;
    Object.assign(el.style, css);
    if (text) el.textContent = text;
    wrap.appendChild(el);
    return el;
  };
  const show = docsState.showPrintArea !== false;
  if (show) add('sheet-print-frame', { left: `${left}px`, top: `${top}px`, width: `${right - left}px`, height: `${bottom - top}px` });

  // 用紙の幅からはみ出す所（はみ出した部分は印刷されない）
  const widthPx = (right - left) * zoom;
  const overflow = widthPx > page.w + 1;
  if (show && overflow) {
    const x = left + page.w / zoom;
    add('sheet-print-overflow', { left: `${x}px`, top: `${top}px`, width: `${right - x}px`, height: `${bottom - top}px` }, 'はみ出し（印刷されません）');
  }

  // ページの区切り（行の途中では切れないので、行の境目で区切る）
  let pages = 1;
  let used = 0;
  for (let r = range.minR; r <= range.maxR; r++) {
    const th = rowTh(r);
    const h = th.offsetHeight * zoom;
    if (used > 0 && used + h > page.h) {
      pages++;
      used = 0;
      if (show) add('sheet-page-break', { left: `${left}px`, top: `${baseY + th.offsetTop - 1}px`, width: `${right - left}px` }, `${pages}ページ目`);
    }
    used += h;
  }
  if (info) {
    const ps = sheetPrintSettings(data);
    const parts = [`印刷範囲：${sheetA1(range.minR, range.minC)}〜${sheetA1(range.maxR, range.maxC)}（${range.manual ? '指定' : '自動'}）`, `${ps.paper}${ps.orient === 'landscape' ? '横' : '縦'}で${pages}ページ`];
    if (zoom < 1) parts.push(`幅を合わせるため${Math.round(zoom * 100)}%に縮小`);
    info.innerHTML = escapeHtml(parts.join('／')) + (overflow ? '　<span style="color:var(--color-absent);">※用紙の幅からはみ出しています（赤い部分は印刷されません）。「横」にするか「幅を用紙に合わせる」にチェックしてください。</span>' : '');
  }
}

function printSheet() {
  buildSheetPrintTable();
  const data = docsState.doc.data;
  const page = sheetPageContentPx(data);
  const prevStyle = document.getElementById('dynamic-page-style');
  const prev = prevStyle ? prevStyle.textContent : null;
  setPrintPageSize(`size: ${page.mmW}mm ${page.mmH}mm; margin: ${SHEET_PRINT_MARGIN_MM}mm;`);
  const restore = () => {
    window.removeEventListener('afterprint', restore);
    const el = document.getElementById('dynamic-page-style');
    if (el) el.textContent = prev ?? '';
  };
  window.addEventListener('afterprint', restore);
  window.print();
}

function buildSheetPrintTable() {
  const host = document.getElementById('sheet-print-host');
  if (!host) return;
  const data = docsState.doc.data;
  const range = sheetPrintRange(data);
  if (!range) { host.innerHTML = ''; return; }
  const { minR, minC, maxR, maxC } = range;
  const layout = sheetMergeLayout(data);
  const cols = data.colWidths.slice(minC, maxC + 1).map((w) => `<col style="width:${w}px;">`).join('');
  const rows = [];
  for (let r = minR; r <= maxR; r++) {
    const tds = [];
    for (let c = minC; c <= maxC; c++) {
      const key = sheetKey(r, c);
      const lay = layout.get(key);
      if (lay === 'skip') continue;
      const cell = data.cells[key];
      const disp = sheetDisplayText(key);
      const align = cell && cell.a ? cell.a : (disp.isNum ? 'right' : 'left');
      const st = [`text-align:${align}`];
      if (cell && cell.bg) st.push(`background:${cell.bg}`);
      const shrunk = docsState.shrinkPt && docsState.shrinkPt.get(key);
      if (shrunk) st.push(`font-size:${shrunk}pt`);
      else if (cell && cell.fs) st.push(`font-size:${cell.fs}pt`);
      st.push(...sheetIndentVaStyles(cell, align, 5));
      const bdCss = lay ? sheetMergedBorderStyle(data, lay, '1px solid #555', 'none') : sheetBorderStyle(cell, '1px solid #555', 'none');
      if (bdCss) st.push(bdCss);
      const span = lay ? ` rowspan="${Math.min(lay.rs, maxR - r + 1)}" colspan="${Math.min(lay.cs, maxC - c + 1)}"` : '';
      const pcls = [];
      if (cell && cell.b) pcls.push('bold');
      if (sheetCanSpill(data, layout, r, c, lay, align, disp, maxC)) pcls.push('spill');
      tds.push(`<td class="${pcls.join(' ')}"${span} style="${st.join(';')}">${escapeHtml(disp.text)}</td>`);
    }
    rows.push(`<tr style="height:${sheetRowHeight(data, r)}px;">${tds.join('')}</tr>`);
  }
  const totalW = data.colWidths.slice(minC, maxC + 1).reduce((a, w) => a + w, 0);
  const zoom = sheetPrintZoom(data, range);
  host.innerHTML = `<table class="sheet-print-table" style="width:${totalW}px;${zoom < 1 ? `zoom:${zoom};` : ''}"><colgroup>${cols}</colgroup><tbody>${rows.join('')}</tbody></table>`;
}

function exportSheetToXlsx() {
  const doc = docsState.doc;
  const data = doc.data;
  const ws = {};
  let maxR = 0, maxC = 0;
  for (const [key, cell] of Object.entries(data.cells)) {
    if (cell.v === undefined || cell.v === '') continue;
    const [r, c] = key.split(':').map(Number);
    maxR = Math.max(maxR, r); maxC = Math.max(maxC, c);
    const raw = String(cell.v);
    const addr = XLSX.utils.encode_cell({ r, c });
    if (sheetIsFormula(raw)) {
      const res = docsState.values.get(key);
      const v = res && !res.err ? res.v : '';
      ws[addr] = typeof v === 'number' ? { t: 'n', v, f: raw.slice(1) } : { t: 's', v: String(v ?? ''), f: raw.slice(1) };
    } else {
      const n = sheetParseNumber(raw);
      ws[addr] = (n !== null && !/^0\d/.test(raw.trim())) ? { t: 'n', v: n } : { t: 's', v: raw };
    }
  }
  for (const m of data.merges || []) { maxR = Math.max(maxR, m.r + m.rs - 1); maxC = Math.max(maxC, m.c + m.cs - 1); }
  ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: maxR, c: maxC } });
  if ((data.merges || []).length) ws['!merges'] = data.merges.map((m) => ({ s: { r: m.r, c: m.c }, e: { r: m.r + m.rs - 1, c: m.c + m.cs - 1 } }));
  ws['!cols'] = data.colWidths.slice(0, maxC + 1).map((w) => ({ wpx: w }));
  ws['!rows'] = Array.from({ length: maxR + 1 }, (_, r) => ({ hpx: sheetRowHeight(data, r) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  const safeName = (doc.title || '資料').replace(/[\\/:*?"<>|]/g, '_');
  XLSX.writeFile(wb, `${safeName}.xlsx`);
}

function attachSheetEditorHandlers() {
  const wrap = document.getElementById('sheet-wrap');
  const editor = document.getElementById('sheet-cell-editor');
  const fx = document.getElementById('sheet-formula-input');
  const titleInput = document.getElementById('sheet-title-input');

  // 「保存」ボタン（Ctrl+S でも保存）。自動保存を待たずに、すぐ保存する
  const saveNow = async () => {
    if (docsState.editing) commitCellEdit(0, 0);
    docsState.dirty = true;
    const btn = document.getElementById('sheet-save-btn');
    if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
    await flushDocSave();
    if (btn) { btn.disabled = false; btn.textContent = '保存'; }
    positionCellEditor(true);
  };
  document.getElementById('sheet-save-btn').addEventListener('mousedown', (e) => e.preventDefault());
  document.getElementById('sheet-save-btn').addEventListener('click', saveNow);
  if (!docsState.saveKeyAttached) {
    docsState.saveKeyAttached = true;
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && state.view === 'docs' && docsState.doc) {
        e.preventDefault();
        document.getElementById('sheet-save-btn')?.click();
      }
    });
  }

  document.getElementById('sheet-back-btn').addEventListener('click', async () => {
    if (docsState.editing) commitCellEdit(0, 0);
    await flushDocSave();
    state.docId = null;
    docsState.doc = null;
    docsState.loaded = false;
    renderView();
  });

  titleInput.addEventListener('input', () => {
    docsState.doc.title = titleInput.value.trim() || '無題の資料';
    scheduleDocSave();
  });
  titleInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); positionCellEditor(true); } });

  document.querySelectorAll('.sheet-tool').forEach((btn) => {
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => {
      if (docsState.editing) commitCellEdit(0, 0);
      runSheetTool(btn.dataset.tool);
    });
  });
  document.getElementById('sheet-border-select').addEventListener('change', (e) => {
    const mode = e.target.value;
    e.target.value = '';
    if (!mode) return;
    applySheetBorders(mode);
    positionCellEditor(true);
  });
  document.getElementById('sheet-bg-select').addEventListener('change', (e) => {
    const bg = e.target.value;
    applyToSelectionCells((cell) => { if (bg) cell.bg = bg; else delete cell.bg; });
    positionCellEditor(true);
  });

  // ---- 列幅・行の高さ（数字で指定） ----
  const wIn = document.getElementById('sheet-col-width-input');
  const hIn = document.getElementById('sheet-row-height-input');
  const fIn = document.getElementById('sheet-font-size-input');
  [[wIn, applySheetColWidth], [hIn, applySheetRowHeight], [fIn, applySheetFontSize]].forEach(([input, apply]) => {
    input.addEventListener('keydown', (e) => {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      else if (e.key === 'Escape') { e.preventDefault(); input.value = ''; updateSheetSizeInputs(); positionCellEditor(true); }
    });
    input.addEventListener('change', () => { apply(input.value); positionCellEditor(true); });
    // リスト（候補）から選んだときは、すぐに反映する
    input.addEventListener('input', (e) => {
      if (e.inputType === 'insertReplacementText' || e.inputType === undefined) { apply(input.value); input.blur(); positionCellEditor(true); }
    });
    input.addEventListener('blur', () => { setTimeout(() => updateSheetSizeInputs(), 0); });
  });

  // ---- マウス操作（セルの選択・範囲選択・列幅の変更） ----
  wrap.addEventListener('mousedown', (e) => {
    const resizer = e.target.closest('.sheet-col-resizer');
    if (resizer) {
      e.preventDefault();
      e.stopPropagation();
      const c = +resizer.dataset.c;
      const data = docsState.doc.data;
      const startX = e.clientX;
      const startW = data.colWidths[c];
      // 複数の列を選んでいて、その中の列の端をドラッグしたときは、選んだ列すべてを同じ幅にする
      const { r1, r2, c1, c2 } = sheetSelRange();
      const wholeCols = r1 === 0 && r2 === data.rows - 1;
      const targets = (wholeCols && c >= c1 && c <= c2) ? Array.from({ length: c2 - c1 + 1 }, (_, i) => c1 + i) : [c];
      const colEls = document.querySelectorAll('#sheet-table colgroup col');
      const wIn = document.getElementById('sheet-col-width-input');
      pushSheetUndo();
      let moved = false;
      const onMove = (ev) => {
        moved = true;
        const w = Math.max(SHEET_COL_WIDTH_MIN, Math.min(SHEET_COL_WIDTH_MAX, Math.round(startW + ev.clientX - startX)));
        targets.forEach((tc) => { data.colWidths[tc] = w; if (colEls[tc + 1]) colEls[tc + 1].style.width = `${w}px`; });
        const tbl = document.getElementById('sheet-table');
        if (tbl) tbl.style.width = `${44 + data.colWidths.slice(0, data.cols).reduce((a, x) => a + x, 0)}px`;
        if (wIn) wIn.value = w;
        showSheetSizeTip(`列幅: ${w}`, ev.clientX, ev.clientY);
      };
      const onUp = () => {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        hideSheetSizeTip();
        if (!moved) { docsState.undo.pop(); return; }
        applySheetShrinkToFit();
        positionCellEditor(true);
        updateSheetSizeInputs();
        drawSheetPrintOverlay();
        scheduleDocSave();
      };
      showSheetSizeTip(`列幅: ${startW}`, e.clientX, e.clientY);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      return;
    }
    const rowResizer = e.target.closest('.sheet-row-resizer');
    if (rowResizer) {
      e.preventDefault();
      e.stopPropagation();
      const r = +rowResizer.dataset.r;
      const data = docsState.doc.data;
      const startY = e.clientY;
      const startH = sheetRowHeight(data, r);
      const { r1, r2, c1, c2 } = sheetSelRange();
      const wholeRows = c1 === 0 && c2 === data.cols - 1;
      const targets = (wholeRows && r >= r1 && r <= r2) ? Array.from({ length: r2 - r1 + 1 }, (_, i) => r1 + i) : [r];
      const trs = document.querySelectorAll('#sheet-table tbody tr');
      const hIn = document.getElementById('sheet-row-height-input');
      pushSheetUndo();
      let moved = false;
      const onMove = (ev) => {
        moved = true;
        const h = Math.max(SHEET_ROW_HEIGHT_MIN, Math.min(SHEET_ROW_HEIGHT_MAX, Math.round(startH + ev.clientY - startY)));
        targets.forEach((tr) => {
          if (h === SHEET_DEFAULT_ROW_HEIGHT) delete data.rowHeights[tr]; else data.rowHeights[tr] = h;
          if (trs[tr]) trs[tr].style.height = `${h}px`;
        });
        if (hIn) hIn.value = h;
        showSheetSizeTip(`行の高さ: ${h}`, ev.clientX, ev.clientY);
      };
      const onUp = () => {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        hideSheetSizeTip();
        if (!moved) { docsState.undo.pop(); return; }
        applySheetShrinkToFit();
        positionCellEditor(true);
        updateSheetSizeInputs();
        drawSheetPrintOverlay();
        scheduleDocSave();
      };
      showSheetSizeTip(`行の高さ: ${startH}`, e.clientX, e.clientY);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      return;
    }
    if (e.target === editor && docsState.editing) return;
    const s = docsState.sel;
    const d = docsState.doc.data;
    const td = e.target.closest('td.sc');
    const colH = e.target.closest('th.sheet-col-h');
    const rowH = e.target.closest('th.sheet-row-h');
    const corner = e.target.closest('th.sheet-corner');
    if (!td && !colH && !rowH && !corner) return;
    e.preventDefault();
    // 数式バーや資料名の欄に入力中なら、先に確定させてから選択を移す
    if (document.activeElement && document.activeElement !== editor && document.activeElement !== document.body) document.activeElement.blur();
    if (docsState.editing) commitCellEdit(0, 0);
    if (td) {
      const r = +td.dataset.r, c = +td.dataset.c;
      if (e.shiftKey) { s.fr = r; s.fc = c; }
      else { s.ar = s.fr = r; s.ac = s.fc = c; }
      docsState.dragging = 'cell';
    } else if (colH) {
      const c = +colH.dataset.c;
      if (e.shiftKey) { s.fc = c; } else { s.ac = s.fc = c; }
      s.ar = 0; s.fr = d.rows - 1;
      docsState.dragging = 'col';
    } else if (rowH) {
      const r = +rowH.dataset.r;
      if (e.shiftKey) { s.fr = r; } else { s.ar = s.fr = r; }
      s.ac = 0; s.fc = d.cols - 1;
      docsState.dragging = 'row';
    } else if (corner) {
      s.ar = 0; s.ac = 0; s.fr = d.rows - 1; s.fc = d.cols - 1;
    }
    updateSheetSelection(false);
    positionCellEditor(true);
  });
  wrap.addEventListener('mouseover', (e) => {
    if (!docsState.dragging) return;
    const s = docsState.sel;
    if (docsState.dragging === 'cell') {
      const td = e.target.closest('td.sc');
      if (!td) return;
      s.fr = +td.dataset.r; s.fc = +td.dataset.c;
    } else if (docsState.dragging === 'col') {
      const th = e.target.closest('th.sheet-col-h') || e.target.closest('td.sc');
      if (!th) return;
      s.fc = +th.dataset.c;
    } else if (docsState.dragging === 'row') {
      const th = e.target.closest('th.sheet-row-h') || e.target.closest('td.sc');
      if (!th) return;
      s.fr = +th.dataset.r;
    }
    updateSheetSelection(false);
  });
  if (!docsState.globalHandlersAttached) {
    window.addEventListener('mouseup', () => { docsState.dragging = false; });
    docsState.globalHandlersAttached = true;
  }
  wrap.addEventListener('dblclick', (e) => {
    const td = e.target.closest('td.sc');
    if (!td) return;
    const cell = docsState.doc.data.cells[sheetKey(+td.dataset.r, +td.dataset.c)];
    startCellEdit('edit', cell ? String(cell.v ?? '') : '');
  });

  // ---- キーボード操作 ----
  editor.addEventListener('compositionstart', () => {
    if (!docsState.editing) { docsState.editing = true; docsState.editMode = 'enter'; editor.classList.add('editing'); }
  });
  editor.addEventListener('input', () => {
    if (!docsState.editing) { docsState.editing = true; docsState.editMode = 'enter'; editor.classList.add('editing'); }
  });
  editor.addEventListener('blur', () => {
    // ほかの場所をクリックしたときは、入力中の内容を確定する
    setTimeout(() => {
      if (docsState.editing && document.activeElement !== editor) commitCellEdit(0, 0);
    }, 0);
  });
  editor.addEventListener('keydown', (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    const key = e.key;
    if (docsState.editing) {
      if (key === 'Enter') { e.preventDefault(); commitCellEdit(e.shiftKey ? -1 : 1, 0); return; }
      if (key === 'Tab') { e.preventDefault(); commitCellEdit(0, e.shiftKey ? -1 : 1); return; }
      if (key === 'Escape') { e.preventDefault(); cancelCellEdit(); return; }
      if (docsState.editMode === 'enter') {
        const arrows = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
        if (arrows[key]) { e.preventDefault(); commitCellEdit(...arrows[key]); }
      }
      return;
    }
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl) {
      const k = key.toLowerCase();
      if (k === 'b') { e.preventDefault(); toggleBoldSelection(); positionCellEditor(true); }
      else if (k === 'z') { e.preventDefault(); sheetUndo(); positionCellEditor(true); }
      else if (k === 'a') { e.preventDefault(); const d = docsState.doc.data; Object.assign(docsState.sel, { ar: 0, ac: 0, fr: d.rows - 1, fc: d.cols - 1 }); updateSheetSelection(false); }
      return; // コピー・切り取り・貼り付けは下のcopy/cut/pasteで扱う
    }
    const arrows = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
    if (arrows[key]) { e.preventDefault(); moveSheetSelection(...arrows[key], e.shiftKey); return; }
    if (key === 'Enter') { e.preventDefault(); moveSheetSelection(e.shiftKey ? -1 : 1, 0, false); return; }
    if (key === 'Tab') { e.preventDefault(); moveSheetSelection(0, e.shiftKey ? -1 : 1, false); return; }
    if (key === 'F2') {
      e.preventDefault();
      const s = docsState.sel;
      const cell = docsState.doc.data.cells[sheetKey(s.ar, s.ac)];
      startCellEdit('edit', cell ? String(cell.v ?? '') : '');
      return;
    }
    if (key === 'Delete' || key === 'Backspace') { e.preventDefault(); clearSelectionValues(); positionCellEditor(true); return; }
    // それ以外の文字は、そのまま入力欄に入り（inputイベント）、入力が始まる
  });
  editor.addEventListener('copy', (e) => {
    if (docsState.editing) return;
    e.preventDefault();
    e.clipboardData.setData('text/plain', sheetCopy(false));
  });
  editor.addEventListener('cut', (e) => {
    if (docsState.editing) return;
    e.preventDefault();
    e.clipboardData.setData('text/plain', sheetCopy(true));
    positionCellEditor(true);
  });
  editor.addEventListener('paste', (e) => {
    if (docsState.editing) return;
    e.preventDefault();
    const text = e.clipboardData.getData('text/plain');
    if (text) { sheetPaste(text); positionCellEditor(true); }
  });

  // ---- 数式バー ----
  fx.addEventListener('keydown', (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    const s = docsState.sel;
    if (e.key === 'Enter') {
      e.preventDefault();
      pushSheetUndo();
      setCellRaw(s.ar, s.ac, fx.value, false);
      afterSheetChange();
      fx.blur();
      moveSheetSelection(1, 0, false);
      positionCellEditor(true);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      fx.blur();
      updateSheetSelection();
      positionCellEditor(true);
    }
  });
  fx.addEventListener('change', () => {
    const s = docsState.sel;
    const cell = docsState.doc.data.cells[sheetKey(s.ar, s.ac)];
    const next = sheetIsFormula(fx.value) ? sheetNormalizeFormula(fx.value) : fx.value;
    if ((cell ? String(cell.v ?? '') : '') !== next) {
      pushSheetUndo();
      setCellRaw(s.ar, s.ac, fx.value, false);
      afterSheetChange();
    }
  });
}

// ==================== データ取得 ====================
async function loadFiscalYearsAndMembers() {
  const { data: fyData, error: fyError } = await sb
    .from(T_FISCAL_YEARS).select('*').order('start_reiki_year', { ascending: false });
  if (fyError) { console.error(fyError); return; }
  state.fiscalYears = fyData ?? [];
  await ensureFiscalYearForToday();
  // 最初に選ぶ年度は、今日（日本時間）が入っている年度。無いときは「今年度」の印の年度
  const todayStart = currentFiscalStartReikiYear();
  state.fiscalYearId = (state.fiscalYears.find(y => y.start_reiki_year === todayStart)
    ?? state.fiscalYears.find(y => y.is_current) ?? state.fiscalYears[0])?.id ?? null;

  const { data: memberData, error: memberError } = await sb
    .from(T_MEMBERS).select('*').eq('is_active', true).order('sort_order', { ascending: true });
  if (memberError) { console.error(memberError); return; }
  state.members = memberData ?? [];

  const { data: deptData } = await sb.from(T_DEPARTMENTS).select('*').order('sort_order', { ascending: true });
  state.departments = deptData ?? [];

  const { data: posData } = await sb.from(T_POSITIONS).select('*').order('sort_order', { ascending: true });
  state.positions = posData ?? [];

  const { data: catMemberData } = await fetchAllPaged(() => sb.from(T_CATEGORY_MEMBERS).select('*').order('reiki_year').order('member_id').order('category'));
  state.categoryMembers = new Map((catMemberData ?? []).map((r) => [rosterKey(r.reiki_year, r.category, r.member_id), r]));
  state.rosterYears = [...new Set((catMemberData ?? []).map((r) => r.reiki_year))].sort((a, b) => a - b);

  const { data: catData } = await sb.from(T_CATEGORIES).select('*').order('sort_order', { ascending: true });
  state.categories = catData ?? [];
  applyCategoriesFromState();

  const { data: checkpointTimeData } = await sb.from(T_CHECKPOINT_TIMES).select('*');
  state.checkpointTimes = new Map((checkpointTimeData ?? []).map((r) => [`${r.category}::${r.fiscal_year_id}::${r.checkpoint}`, r.time_value]));

  const { data: nioigakeDateData } = await fetchAllPaged(() => sb.from(T_NIOIGAKE_DATES).select('*').order('reiki_year').order('category'));
  state.nioigakeDates = new Map((nioigakeDateData ?? []).map((r) => [`${r.reiki_year}::${r.category}`, r.event_date]));

  const { data: configData } = await sb.from(T_CONFIG).select('day1_label,day2_label,day3_label').eq('id', true).maybeSingle();
  if (configData) {
    state.rosterDay1 = configData.day1_label ?? state.rosterDay1;
    state.rosterDay2 = configData.day2_label ?? state.rosterDay2;
    state.rosterDay3 = configData.day3_label ?? state.rosterDay3;
  }

  await loadAttendanceForFiscalYear();
}

// 4月になって新しい年度に入ったら、その年度を自動で作り、「今年度」の印も移す。
// （前の年度のまま4月の出欠を入れると、1年前の4月の記録に上書きしてしまうため）
// 端末の時計が大きくずれているときに先の年度を作らないよう、
// 「いちばん新しい年度の次の年度」のときだけ作る。
async function ensureFiscalYearForToday() {
  const list = state.fiscalYears;
  if (list.length === 0) return; // 読み込みに失敗したときなどは何もしない
  const todayStart = currentFiscalStartReikiYear();
  const maxStart = Math.max(...list.map((y) => y.start_reiki_year));
  let fy = list.find((y) => y.start_reiki_year === todayStart);
  if (!fy && todayStart === maxStart + 1) {
    const label = `立教${todayStart}年4月～立教${todayStart + 1}年3月`;
    const { data, error } = await sb.from(T_FISCAL_YEARS)
      .insert({ label, start_reiki_year: todayStart, is_current: false })
      .select().single();
    if (!error && data) {
      fy = data;
    } else {
      // ほかの端末が同時に作ったときなどは、読み直して使う
      const { data: again } = await sb.from(T_FISCAL_YEARS).select('*').eq('start_reiki_year', todayStart).maybeSingle();
      if (again) fy = again;
    }
    if (fy) {
      list.push(fy);
      list.sort((a, b) => b.start_reiki_year - a.start_reiki_year);
    }
  }
  if (!fy || fy.is_current) return;
  // 「今年度」の印は、今より新しい年度へ進めるときだけ移す（前の年度へは戻さない）
  const cur = list.find((y) => y.is_current);
  if (cur && cur.start_reiki_year >= fy.start_reiki_year) return;
  const { error: e1 } = await sb.from(T_FISCAL_YEARS).update({ is_current: true }).eq('id', fy.id);
  if (e1) return;
  fy.is_current = true;
  const { error: e2 } = await sb.from(T_FISCAL_YEARS).update({ is_current: false }).neq('id', fy.id).eq('is_current', true);
  if (!e2) list.forEach((y) => { if (y.id !== fy.id) y.is_current = false; });
}

// state.categories の内容を、アプリ全体で使うCATEGORY_LABEL等に反映する
function applyCategoriesFromState() {
  CATEGORY_LABEL = Object.fromEntries(state.categories.map((c) => [c.key, c.label]));
  ALL_CATEGORIES = [...state.categories].sort((a, b) => a.sort_order - b.sort_order).map((c) => c.key);
  YEARLY_CATEGORIES = state.categories.filter((c) => c.is_yearly).map((c) => c.key);
  SPECIAL_ROLE_CATEGORIES = state.categories.filter((c) => c.has_special_role).map((c) => c.key);
  NO_CHECKPOINT_YEARLY_CATEGORIES = state.categories.filter((c) => c.is_yearly && c.has_checkpoints === false).map((c) => c.key);
  FIELD_VISIBLE_CATEGORIES = state.categories
    .filter((c) => c.show_in_field)
    .sort((a, b) => (a.field_sort_order ?? a.sort_order) - (b.field_sort_order ?? b.sort_order))
    .map((c) => c.key);
  GRID_VISIBLE_CATEGORIES = state.categories
    .filter((c) => c.show_in_grid)
    .sort((a, b) => a.sort_order - b.sort_order)
    .map((c) => c.key);
  if (!ALL_CATEGORIES.includes(state.category)) state.category = ALL_CATEGORIES[0] ?? state.category;
  if (!GRID_VISIBLE_CATEGORIES.includes(state.category)) state.category = GRID_VISIBLE_CATEGORIES[0] ?? ALL_CATEGORIES[0] ?? state.category;
  // 現場入力は「スマホのリストに表示」がオンの区分しか選べないので、
  // それ以外の区分が選ばれたままなら先頭の表示区分に切り替える
  // （プルダウンの見た目と実際の区分がずれて、月・当番日の欄が残るのを防ぐ）
  if (!FIELD_VISIBLE_CATEGORIES.includes(state.fieldCategory)) state.fieldCategory = FIELD_VISIBLE_CATEGORIES[0] ?? ALL_CATEGORIES[0] ?? state.fieldCategory;
}

// 指定区分の名簿（有効なメンバーのみ、区分ごとの並び順）を返す
// 「にをいがけでー(9/28)」のような区分名から、括弧の中身（日付部分）だけを取り出す。
// 括弧がなければそのまま返す
function shortenCategoryLabelForDay(label) {
  const match = label.match(/[（(]([^）)]+)[）)]/);
  return match ? match[1] : label;
}

// にをいがけデーの、指定した年（立教）の日付を「9/29」の形で返す（未設定なら空文字）
// 日付は「にをいがけデー役割」の画面で、年ごとに入力する
function nioigakeDateText(category, reikiYear) {
  const d = state.nioigakeDates.get(`${reikiYear}::${category}`);
  if (!d) return '';
  const [, m, day] = String(d).split('-');
  return `${Number(m)}/${Number(day)}`;
}

// ==================== 区分名簿（年度・年ごと） ====================
// 区分名簿は、立教の年ごとに別々に保存する。朝の神殿掃除・月例参拝では「立教○年度」（4月〜翌3月）、
// 慰労拝受・にをいがけデーでは「立教○年」の名簿として使う（どちらも年度の開始年の数字で管理する）。
// その年の名簿がまだ無いときは、前の年（無ければ後の年）で一番近い年の名簿をそのまま使い、
// 名簿を書き換えたときに初めて、その年の名簿を写して作る（元の年の名簿は変わらない）。
const ROSTER_CONFLICT = 'member_id,category,reiki_year';

function rosterKey(year, category, memberId) { return `${year}::${category}::${memberId}`; }

// 出欠入力・報告書・現場入力などで選んでいる年度の立教年
function selectedRosterYear() {
  const fy = state.fiscalYears.find((y) => y.id === state.fiscalYearId);
  return fy ? fy.start_reiki_year : currentReikiYear();
}

// その年の名簿として実際に使う年（その年の名簿が無ければ、一番近い年）
function rosterBaseYear(year) {
  const years = state.rosterYears;
  if (years.includes(year)) return year;
  const earlier = years.filter((y) => y < year);
  if (earlier.length > 0) return earlier[earlier.length - 1];
  const later = years.filter((y) => y > year);
  return later.length > 0 ? later[0] : null;
}

function getRosterEntry(category, memberId, year) {
  const base = rosterBaseYear(year);
  if (base == null) return undefined;
  return state.categoryMembers.get(rosterKey(base, category, memberId));
}

function alertIfRosterError(res) {
  if (res && res.error) {
    console.error(res.error);
    alert('区分名簿を保存できませんでした。画面を読み込み直して、もう一度操作してください。\n（' + res.error.message + '）');
    return true;
  }
  return false;
}

// 名簿を書き換える前に呼ぶ。その年の名簿がまだ無ければ、元にしている年の名簿を写して作る
async function ensureRosterYear(year) {
  if (state.rosterYears.includes(year)) return { error: null };
  const base = rosterBaseYear(year);
  const copies = [];
  if (base != null) {
    for (const r of state.categoryMembers.values()) {
      if (r.reiki_year === base) copies.push({ ...r, reiki_year: year });
    }
  }
  for (let i = 0; i < copies.length; i += 500) {
    const res = await sb.from(T_CATEGORY_MEMBERS).upsert(copies.slice(i, i + 500), { onConflict: ROSTER_CONFLICT });
    if (res.error) return res;
  }
  for (const c of copies) state.categoryMembers.set(rosterKey(year, c.category, c.member_id), c);
  state.rosterYears = [...state.rosterYears, year].sort((a, b) => a - b);
  return { error: null };
}

// 指定した年の区分名簿に、行（1人×1区分）を保存する
async function writeRoster(year, rows) {
  let res = await ensureRosterYear(year);
  if (!res.error && rows.length > 0) {
    const saved = rows.map((row) => ({ ...row, reiki_year: year }));
    for (const r of saved) state.categoryMembers.set(rosterKey(year, r.category, r.member_id), r);
    res = await sb.from(T_CATEGORY_MEMBERS).upsert(saved, { onConflict: ROSTER_CONFLICT });
  }
  alertIfRosterError(res);
  return res;
}

function getCategoryMemberEntries(category, year = selectedRosterYear()) {
  return state.members
    .map((m) => {
      const cm = getRosterEntry(category, m.id, year);
      const isActive = cm ? cm.is_active : true;
      const sortOrder = cm ? cm.sort_order : m.sort_order;
      return isActive ? { ...m, _catSortOrder: sortOrder, _isSpecial: !!cm?.is_special, _isSpecialLeader: !!cm?.is_special_leader, _isDayLeader: !!cm?.is_day_leader, _isTransport: !!cm?.is_transport } : null;
    })
    .filter(Boolean)
    .sort((a, b) => a._catSortOrder - b._catSortOrder);
}

// 1000件対策：Supabaseは1回に最大1000件しか返さないため、1000件ずつ区切って最後まで読む。
// makeQuery は毎回新しいクエリを作る関数（並び順を固定するため order を付けておく）。
// 戻り値は従来の書き方に合わせて { data, error } の形にする。
async function fetchAllPaged(makeQuery) {
  const PAGE = 1000;
  const rows = [];
  for (let from = 0; ; from += PAGE) {
    const { data, error } = await makeQuery().range(from, from + PAGE - 1);
    if (error) return { data: rows.length ? rows : null, error };
    rows.push(...(data ?? []));
    if (!data || data.length < PAGE) break;
  }
  return { data: rows, error: null };
}

async function loadAttendanceForFiscalYear() {
  state.attendance = new Map();
  if (!state.fiscalYearId) return;
  const { data, error } = await fetchAllPaged(() => sb
    .from(T_ATTENDANCE).select('*').eq('fiscal_year_id', state.fiscalYearId).order('id'));
  if (error) { console.error(error); return; }
  for (const row of (data ?? [])) {
    state.attendance.set(attKey(row.member_id, row.category, row.month_seq), row.status);
  }
}

function currentFiscalYearLabel() {
  return state.fiscalYears.find(y => y.id === state.fiscalYearId)?.label ?? '';
}

          <li>上部のタブ(朝の神殿掃除・月例参拝・慰労拝受(中元)・慰労拝受(歳暮)など)で、入力する区分を切り替えます。区分の種類は「表示区分」タブで追加・変更でき、出欠入力画面に表示するかどうかも区分ごとに選べます。</li>
          <li>「朝の神殿掃除」「月例参拝」など月ごとの区分は、各月のマスをクリックすると空欄→○→×→空欄の順に切り替わります。</li>
          <li>「年ごと」に設定された区分は、月の代わりに「立教○○○年」の列が並びます。「慰労拝受(中元)」「慰労拝受(歳暮)」のように「①事前調査 ②会場外 ③会場内」の3回チェックできる区分と、シンプルに年に1回だけの区分(例:にをいがけデー)があり、どちらにするかは区分ごとに設定できます。3回チェックできる区分では、事前調査で×だった人は、会場外・会場内の欄で氏名が赤く表示されます。</li>
          <li>「会場外」「会場内」の列には、その回・その年の共通の時刻を1つだけ入力できます(名前ごとではありません)。「0812」のように入力すると自動で「8:12」に変換されます。</li>
          <li>にをいがけデーのように「神・責欄を使う」に設定された区分では、氏名の右に「役割」列が表示され、「組総責任者」「神名流し責任者」「神名流し」「マイクロ運転手」が該当する人にだけ表示されます。役割が2つ以上ある人は「組総責任者 神名流し」のように横一列に並びます。設定は「にをいがけデー役割」タブで行います。</li>
          <li>氏名・部署・立場はその場で書き換えられます(部署・立場はプルダウンから選択)。</li>
          <li>行の左端の「⠿」を掴んでドラッグすると、メンバーの並び順を変えられます。「↑」「↓」ボタンでも1つずつ動かせます。<strong>この並び順は区分ごとに別々に管理されています。</strong>(にをいがけデーは部署順・主任優先の並びが自動で適用され、さらに<strong>「総」(その日全体の責任者)の人が一番先頭</strong>に表示されます)</li>
          <li>「＋年度追加」で新しい年度を追加できます。今年度のデータが消えることはありません。</li>
          <li>画面を開くと、今日の日付(日本時間)が入っている年度が最初に選ばれます。4月になると新しい年度が自動で作られ、「今年度」もその年度に切り替わります(スマホの現場入力も同じです)。</li>
          <li>月ごとの区分では「○月分 全員出席」「○月分未入力を○にする」「この月をクリア」、年ごとの区分では「立教○年分 全員出席」などの一括操作ができます。</li>
          <li>「×」ボタンは、メンバーを退職扱いにして一覧から外します。<strong>これまでの出欠記録は削除されず、データベースには残ります。</strong></li>
          <li>「Excelで書き出し」で、登録されている全期間・全区分の出欠記録を1つのExcelファイル(区分ごとにシート分け)としてダウンロードできます。</li>
        </ul>
      </section>

      <section class="help-section">
        <h2>② 現場入力（スマホ用）</h2>
        <p>スマホで、現場にいながら出欠(主に出席のチェック)を入力するための画面です。その端末で一度ログインしておけば、次回からはURLを開くだけで直接使えます。</p>
        <ul>
          <li>URLの末尾に <code>?field=1</code> を付けて開くと、他の画面を含まないスマホ専用の表示になります。ホーム画面に追加しておくと便利です。</li>
          <li>上部のプルダウン(リスト)で区分を切り替えます。リストに出る区分は「表示区分」タブで「スマホのリストに表示」にチェックが入っているものだけです。</li>
          <li>「年」は立教○○○年の表記で、<strong>まだ作られていない先の年度を選んでも自動的にその年度が作成されます</strong>(常に最新から2年先まで選べます)。3回チェックできる年ごとの区分では、「月」の代わりに「事前調査」「会場外」「会場内」から選びます(年1回だけの区分では、この選択自体が出ません)。</li>
          <li>「朝の神殿掃除」を選んでいるときは、「年」「月」の横に「21日」「22日」「23日」(表示名はマスターの当番表画面で変更可)のプルダウンが出ます。選ぶと、その日が当番の人だけに絞り込まれます。班タブの「日全体」はその日の当番の人だけ、「課全体」は日にちに関わらず全員を、それぞれ部署順・主任優先で表示します。</li>
          <li>にをいがけデーを選んでいるときは、「日全体」「課全体」で<strong>「総」(その日全体の責任者)の人が一番先頭</strong>に表示されます。</li>
          <li>「事前調査」で×だった人は、「会場外」「会場内」を確認するとき、名前が赤く表示されて見分けられます。</li>
          <li>名前をタップすると枠が塗りつぶされて「出席」になります。もう一度タップすると取り消せます。「この内容で保存」を押すと、<strong>タップした人だけが出席(○)として保存</strong>され、タップしていない人は空欄のままです(×にはなりません。ただし「事前調査」だけは、タップしていない人が欠席(×)として保存されます)。保存した内容はPCの出欠入力にもそのまま反映されます(画面に表示されている人だけが対象です)。名前の右側には「組責」「神責」「神名」「運転」のバッジが、該当する人にだけ表示されます。</li>
          <li>「全員出席」でその場に表示されている全員を出席にできます。入力が終わったら「この内容で保存」を押してください。保存した班のタブには✓が付き、内容を変えると✓は消えます。</li>
          <li>右上の「Update」ボタンで、キャッシュを無視して最新版を読み込み直せます。押しても出欠入力には戻らず、<strong>選んでいた区分・班・月などもそのまま</strong>で現場入力の画面に戻ってきます。</li>
        </ul>
      </section>

      <section class="help-section">
        <h2>③ 神殿掃除報告書</h2>
        <p>朝の神殿掃除の1ヶ月分の出欠を、提出用のB5用紙1枚のレイアウトで印刷するための画面です。</p>
        <ul>
          <li>「年度」「対象月」「部署名(表題)」を設定してから、「印刷 / PDFで保存」を押してください。</li>
          <li>「左：人数」で、氏名一覧を左右どちらに何名ずつ振り分けるか調整できます(「自動(半分ずつ)」で元に戻せます)。</li>
          <li>人数が多い月は、文字サイズはそのまま、行の余白だけ自動的に少し詰めて1枚に収まるよう調整されます。</li>
        </ul>
      </section>

      <section class="help-section">
        <h2>④ 神殿掃除当番表</h2>
        <p>1日目・2日目・3日目ごとに、部署の当番割り当てと出欠を印刷するための当番表です。</p>
        <ul>
          <li>「対象月」で出欠結果を反映する月を選べます。「テンプレ」を選ぶと、○×を一切表示しない空欄の状態で印刷できます(配布用の当番表として使えます)。</li>
          <li>「『○月』を表示する」のチェックを外すと、表題から月の表示だけを消せます。</li>
          <li>各部署の枠は、クリックしたまま掴んで少しずらして配置を調整できます(自動保存されます)。「配置をリセット」で元の並びに戻せます。</li>
          <li>担当日を個別に変えたい人は、「マスター」タブの「担当日の個別設定」で設定します。</li>
        </ul>
      </section>

      <section class="help-section">
        <h2>⑤ 月例参拝報告書</h2>
        <p>月例参拝の1ヶ月分の出欠を、提出用のB5用紙1枚のレイアウトで印刷するための画面です。「年度」「対象月」の選び方、人数の振り分け、印刷の仕方は神殿掃除報告書と同じです。</p>
        <ul>
          <li>月例参拝の報告書は、営繕課を除いた部署順(庶務係→現場第一班→…→空調衛生係)で、各部署の主任が一番上に来るように並び、「立場」欄の代わりに「部署」欄が表示されます。</li>
        </ul>
      </section>

      <section class="help-section">
        <h2>⑥ マスター</h2>
        <p>部署・立場など、システム全体で使う基本情報を管理する画面です。</p>
        <ul>
          <li><strong>部署を編集</strong>：部署名の追加・変更・削除と、部署ごとの既定の当番日(1〜3日目)を設定します。</li>
          <li><strong>立場を編集</strong>：立場(役職)名の一覧を管理します。</li>
          <li><strong>担当日の個別設定</strong>：特定の人だけ、部署の既定と違う当番日にしたい場合に設定します。</li>
          <li><strong>主任の設定</strong>：チェックした人は、当番表・報告書でその部署の一番上に表示されます。</li>
          <li><strong>メンバーの部署を変更</strong>：出欠入力画面を開かなくても、ここから直接メンバーの所属部署を変更できます。</li>
          <li><strong>古いデータの整理</strong>：年度を選ぶと、それより前の年度の出欠記録と、その年度の設定（年度・会場外/会場内の時刻・にをいがけデー役割）をまとめて削除します。「対象を確認する」で件数を確かめてから削除してください（削除の直前に管理者パスワードが必要です）。慰労拝受・にをいがけデーの通算の出席・欠席の回数も、消した年度の分だけ減ります。元に戻せません。</li>
        </ul>
      </section>

      <section class="help-section">
        <h2>⑦ 表示区分</h2>
        <p>出欠入力・現場入力で使う区分そのものを管理します。</p>
        <ul>
          <li>名前の変更、出欠入力への表示・非表示、現場入力(スマホ)のリストへの表示・非表示、月ごと/年ごとの切り替え、「神・責欄を使う」の切り替え、新しい区分の追加・削除ができます。</li>
          <li>並び順は「出欠入力の並び順」「現場入力の並び順」でそれぞれ別々に設定できます。</li>
          <li>「スマホのリストに表示」をオフにした区分は、現場入力(スマホ)のプルダウンから消え、選べなくなります。</li>
        </ul>
      </section>

      <section class="help-section">
        <h2>⑧ 区分名簿</h2>
        <p>区分ごとに、名簿から外す・戻すをチェックボックスで切り替えられます。退職ではなく「その区分だけ対象外にする」ための機能です。</p>
        <ul>
          <li>にをいがけデーは「参加日」を1つのプルダウンで選ぶ形式になっており、「神」「責」「総」「運」の設定は「にをいがけデー役割」で行います。</li>
          <li>見出し行は上部に固定されています。</li>
          <li>上の<strong>「年度・年」</strong>で、どの年の名簿を見る・直すかを選べます。名簿は年ごとに別々に保存されます。朝の神殿掃除・月例参拝は「年度」(4月〜翌年3月)、慰労拝受・にをいがけデーは「年」の名簿として使われます。</li>
          <li>出欠入力・報告書・現場入力(スマホ)では、それぞれの画面で選んでいる年度の名簿が使われます。にをいがけデー役割では、選んでいる年の名簿が使われます。</li>
          <li>新しい年度の名簿は、はじめは前の年の名簿と同じ内容です。チェックなどを変えると、その年の名簿として保存され、前の年の名簿は変わりません。</li>
          <li>「古いデータの整理」で古い年度を消しても、その年の区分名簿は消えずに残り、ここで選べます。</li>
        </ul>
      </section>

      <section class="help-section">
        <h2>⑨ にをいがけデー役割</h2>
        <p>「区分名簿」で参加日を選んだ人だけが、参加日ごとに横並びで表示されます。</p>
        <ul>
          <li>上の「年」で、立教の年号(今年・去年・2年前・3年前)を選べます。年が新しくなると、一番古い年は選べなくなり、新しい年が「今年」になります。役割は年ごとに別々に保存されます。</li>
          <li>「神」(神名流し)・「責」(神名流しリーダー)・「総」(その日全体の責任者、1人だけ)・「運」(マイクロ運転手)をチェックできます。</li>
          <li>チェックが終わったら<strong>「各役割のチェック済み」</strong>を押すと保存され、チェックの付いていない所が薄くなって、変更できない状態になります。<strong>押すまでは保存されない</strong>ので注意してください。</li>
          <li>もう一度変更したいときは<strong>「解除」</strong>を押すと、チェックを付け直せるようになります。直したら、また「各役割のチェック済み」を押してください。</li>
          <li>「今年」の役割を保存すると、出欠入力の「役割」欄や、現場入力(スマホ)のバッジにも反映されます。</li>
          <li>「総」にチェックした人は、出欠入力と現場入力(スマホ)の「日全体」「課全体」で、名簿の一番先頭に表示されます。</li>
          <li>各参加日の見出しの下の<strong>「日付」</strong>に、その年の実際の日付を入れてください(にをいがけデーは毎年9/28・9/29・9/30のうち2日で、年によって変わるため)。入力するとすぐ保存され、「チェック済み」のときでも変更できます。今年の日付は区分名簿・現場入力(スマホ)の区分名の横に、各年の日付は出欠入力の年の見出しの下に表示されます。</li>
          <li>ここに表示されるのは、「表示区分」タブで「神・責欄を使う」がオンになっている区分だけです。</li>
          <li>各見出しには参加人数が自動で表示されます。</li>
        </ul>
      </section>

      <section class="help-section">
        <h2>⑩ 資料作成</h2>
        <p>エクセルのような表を作って保存できる画面です。</p>
        <ul>
          <li>「＋ 新しい表を作成」で新しい表を作ります。作った表は一覧に並び、「開く」で続きを編集できます。「名前を変更」を押すと、その場で資料名を書き換えられます(Enterで確定、Escで取り消し)。「複製」でコピー、「削除」で削除できます。左の「⠿」を掴んでドラッグすると、一覧の並び順を変えられます(新しく作った資料は一番上に入ります)。資料を開いた画面でも、上の資料名の欄をクリックすれば書き換えられます。</li>
          <li>セルをクリックしてそのまま文字を打つと入力できます。今の内容を修正したいときは、ダブルクリックかF2キーを押します。Enterで下、Tabで右に移動します。上の「fx」欄でも入力・修正できます。</li>
          <li>ドラッグやShift+クリックで範囲を選び、太字・揃え・背景色をまとめて設定できます。行番号・列の記号(A、B…)をクリックすると行・列ごと選べます。列の記号の右端をドラッグすると列の幅を、行番号の下端をドラッグすると行の高さを変えられます(ドラッグ中は数字が表示されます)。</li>
          <li>上のツールバーの「列幅」「行の高さ」の欄には、選んでいるセルの列幅・行の高さが数字(ピクセル)で表示されます。数字を入れてEnterを押すと、その大きさに変わります。範囲を選んでいれば、選んだ列・行をまとめて同じ大きさにできます(範囲内で大きさがバラバラのときは「混在」と表示されます)。標準は列幅100・行の高さ26です。</li>
          <li><strong>文字サイズ</strong>:セルや範囲を選んで、ツールバーの「文字サイズ」欄に数字(ポイント、エクセルと同じ単位)を入れてEnterを押すか、候補から選びます。「A＋」「A－」で一段階ずつ大きく・小さくできます。標準は11です。文字を大きくすると、行の高さも自動で広がります。</li>
          <li><strong>縮小して全体を表示</strong>:セルや範囲を選んで「縮小して全体を表示」を押すと、文字がセルの幅に収まるように自動で文字が小さくなります(ボタンが青くなっているセルが対象です)。列幅を広げると元の大きさまで戻り、それ以上は大きくなりません。解除するときは、もう一度ボタンを押します。印刷にも反映されます。</li>
          <li><strong>インデント・上下の位置</strong>:「インデント ⇥」を押すたびに、文字が全角1文字分ずつ右に下がります(最大10段)。「⇤ インデント」で1段ずつ戻せます。右揃えのセルでは右側が空きます。「上」「上下中央」「下」で、行の高さの中での文字の位置を変えられます(最初は上下中央です)。</li>
          <li><strong>セル結合</strong>:結合したい範囲をドラッグで選んで「セル結合」を押すと、1つのセルにまとまります(最初は中央揃え)。元に戻すときは、結合したセルを選んで「結合解除」を押します。左上以外のセルに入力があった場合は、確認のあと左上の内容だけが残ります。結合したセルは、印刷やExcelへの書き出しでも結合されたままになります。</li>
          <li><strong>罫線</strong>:最初はすべてのセルに罫線があります。範囲を選んでツールバーの「罫線…」から「格子(すべての罫線)」「外枠だけ」「罫線なし」「下線だけ」「上線だけ」を選ぶと変えられます。画面では、罫線のある所は実線、無い所は薄い点線で表示されます(点線は印刷されません)。「罫線なし」にすると、選んだセルの周りの線はすべて消えます。隣の表の線まで消えてしまったときは、その表を選んで「格子」か「外枠だけ」を選び直してください。</li>
          <li>エクセルなどからコピーした表は、そのまま貼り付け(Ctrl+V)できます。Ctrl+Zで元に戻せます。</li>
          <li>「=」から始めると計算式になります。例: =A1+B1、=SUM(B2:B20)、=AVERAGE(B2:B20)、=COUNTIF(C2:C30,"○")、=IF(B2>=80,"合格","")。使える関数: SUM・AVERAGE・MIN・MAX・COUNT・COUNTA・COUNTIF・SUMIF・ROUND・IF など。</li>
          <li>変更は自動で保存されます(資料名の横に「✓ 保存しました(時刻)」と出ます)。すぐに保存したいときは、資料名の横の「保存」ボタンを押すか、Ctrl+S(Macは⌘+S)を押してください。</li>
          <li>「Excelで書き出し」で .xlsx ファイルとして保存でき、一覧の「Excelファイルを読み込む」で既存のエクセルファイルを取り込めます(シートが複数ある場合は、シートごとに別の資料になります)。</li>
          <li><strong>印刷範囲の確認</strong>:表の上の「印刷設定」で、用紙(A4・B5・A3)と向き(縦・横)を選べます。画面では、印刷される範囲が青い点線の枠で囲まれ、2ページ以上になるときはページの区切りに「2ページ目」などの青い点線が出ます。用紙の幅に収まらない部分は赤い斜線で表示され、その部分は印刷されません。その場合は「横」にするか、「幅を用紙に合わせる」にチェックすると、幅がちょうど収まるように縮小して印刷されます。<strong>印刷範囲は変更できます</strong>:印刷したい範囲をドラッグで選んで「選択範囲を印刷範囲にする」を押すか、「印刷範囲」の欄に「A1:F40」のように入力してEnterを押します。「自動に戻す」を押すと、A1から入力のある所までを自動で印刷する状態に戻ります。枠や線が邪魔なときは「印刷範囲を表示」のチェックを外すと消せます(印刷には影響しません)。ページの区切りの位置は目安です。</li>

async function copySettingsUrl(btn) {
  const text = btn.dataset.url;
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e2) { /* コピーできなくても続ける */ }
    document.body.removeChild(ta);
  }
  btn.textContent = 'コピーしました';
  setTimeout(() => { btn.textContent = 'コピー'; }, 2000);
}

// GitHubに入っている最新のファイルを、元のファイル名（index.html）のまま保存する
// （const にすると、ここより前で止まっている間は使えないため、関数にしている）
function latestFileUrl() { return 'https://raw.githubusercontent.com/marusora8190/asasin-attendance/main/index.html'; }
async function downloadLatestFromGitHub(btn) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '取得中…';
  try {
    const res = await fetch(latestFileUrl() + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = new Blob([await res.arrayBuffer()], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'index.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    btn.textContent = '保存しました';
  } catch (e) {
    btn.textContent = 'できませんでした';
    alert('ダウンロードできませんでした。通信環境を確かめて、もう一度押してください。\nうまくいかないときは、URLを開いてから保存してください。');
  } finally {
    btn.disabled = false;
    setTimeout(() => { btn.textContent = label; }, 2500);
  }
}

let settingsLockedPayload = null;
function settingsB64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function unlockSettingsSection() {
  const input = document.getElementById('settings-lock-pw');
  const btn = document.getElementById('settings-lock-btn');
  const msg = document.getElementById('settings-lock-msg');
  const pw = input.value;
  if (!pw) { msg.textContent = 'パスワードを入れてください。'; input.focus(); return; }
  if (!window.crypto || !crypto.subtle) { msg.textContent = 'このブラウザでは開けません。https:// で始まるアドレスで開いてください。'; return; }
  btn.disabled = true; msg.textContent = '確認しています…';
  let payload;
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: settingsB64ToBytes(SETTINGS_LOCKED.salt), iterations: SETTINGS_LOCKED.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: settingsB64ToBytes(SETTINGS_LOCKED.iv) }, key, settingsB64ToBytes(SETTINGS_LOCKED.data));
    payload = JSON.parse(new TextDecoder().decode(plain));
  } catch (e) {
    btn.disabled = false;
    msg.textContent = 'パスワードが違います。もう一度入れてください。';
    input.select();
    return;
  }
  input.value = '';
  settingsLockedPayload = payload;
  showSettingsLockedContent();
}
function showSettingsLockedContent() {
  const payload = settingsLockedPayload;
  const box = document.getElementById('settings-locked-content');
  const lockBox = document.getElementById('settings-lock-box');
  if (!payload || !box || !lockBox) return;
  box.innerHTML = payload.html;
  const list = document.getElementById('settings-locked-files');
  payload.files.forEach((f, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'settings-file';
    const head = document.createElement('div');
    head.className = 'settings-file-head';
    const name = document.createElement('span');
    name.className = 'settings-file-name';
    name.textContent = '📄 ' + f.label;
    const dl = document.createElement('button');
    dl.type = 'button'; dl.className = 'settings-file-btn'; dl.textContent = 'ダウンロード';
    dl.addEventListener('click', () => downloadSettingsFile(idx));
    head.appendChild(name); head.appendChild(dl);
    const det = document.createElement('details');
    const sum = document.createElement('summary');
    sum.textContent = '全文をここで読む（押すと開きます）';
    const pre = document.createElement('pre');
    pre.textContent = f.text;
    det.appendChild(sum); det.appendChild(pre);
    wrap.appendChild(head); wrap.appendChild(det);
    list.appendChild(wrap);
  });
  lockBox.hidden = true;
  box.hidden = false;
}
function downloadSettingsFile(idx) {
  const f = settingsLockedPayload && settingsLockedPayload.files[idx];
  if (!f) return;
  const blob = new Blob([(f.bom ? '\ufeff' : '') + f.text], { type: f.type + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = f.name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
